// which clothes an answer names, in order: '긴팔 + 바람막이' → ['long', 'jacket']
const OUTFIT_WORDS = [['sleeveless', '민소매'], ['tee', '반팔'], ['long', '긴팔'], ['base', '베이스레이어'], ['halfzip', '하프집업'], ['padding', '경량패딩'], ['vest', '조끼'], ['jacket', '바람막이'], ['shorts', '반바지'], ['pants', '긴바지'], ['fleece', '기모바지']];
function outfitPieces(text) {
  return OUTFIT_WORDS.map(([k, w]) => [k, String(text || '').indexOf(w)]).filter(x => x[1] >= 0).sort((a, b) => a[1] - b[1]).map(x => x[0]);
}
// w: { t, rh, ws (m/s), pp (rain chance %), pr (mm/h), wc (weather code), dark } · hard: interval/tempo day (runs warmer → one band lighter)
function outfitFor(w, hard) {
  if (!w || !isNum(w.t)) return null;
  const feel = feelsKo(w.t, w.rh, w.ws);
  // light breeze is part of normal running weather (the user's and YouTubers' temperatures assume it): the band follows the air temperature
  // unless the wind is real (≥ 3 m/s) or the heat feels hotter; the 체감온도 shown is always the 기상청-style one
  const basis = (isNum(w.ws) && w.ws >= 3) || feel > w.t ? feel : w.t;
  let i = OUTFIT.findIndex(b => basis >= b.lo);
  if (hard && i > 1) i--; // a hard session warms you up: one band lighter (never lighter than 반팔+반바지 for cold)
  const b = OUTFIT[i], acc = b.acc.slice(), notes = [];
  if (basis <= 5 && !acc.includes('장갑')) acc.push('장갑');
  const rain = (isNum(w.pr) && w.pr >= 0.5) || (isNum(w.pp) && w.pp >= 60) || [61, 63, 65, 80, 81, 82].includes(w.wc);
  const snow = [71, 73, 75, 77, 85, 86].includes(w.wc);
  if (rain || snow) { acc.push('챙 있는 모자'); notes.push((snow ? '눈' : '비') + ' 예보가 있어요. 방수 바람막이를 입고, 젖으면 체온이 빨리 떨어지니 한 단계 따뜻하게 입으세요.'); }
  if (isNum(w.ws) && w.ws >= 5 && feel < 20 && !/바람막이/.test(b.top)) notes.push('바람이 강해요(초속 ' + Math.round(w.ws) + 'm). 얇은 바람막이를 더하세요.');
  if (w.dark) notes.push('어두워요. 밝은 색이나 반사 소재 옷, 라이트를 챙기세요.');
  if (basis < 13 && basis > -5) notes.push('출발할 때 살짝 춥다 싶게 입으면 10분쯤 뒤 딱 좋아요.');
  if (b.note) notes.push(b.note);
  return { feel: Math.round(feel * 10) / 10, t: w.t, top: b.top, bottom: b.bottom, acc, alt: b.alt || null, notes, band: i, hard: !!hard };
}

// ===== core_schedule.js — monthly training calendar: weekly km from a monthly goal, recent volume check, .ics export =====
// a plan: { goals: { '2026-11': { km, wk: { <monday day>: km } } }, days: { '2026-11-03': { k, km, pace } } }  (wk = weeks the runner changed by hand)
const TP_KINDS = [['easy', '이지'], ['recovery', '회복'], ['long', '장거리'], ['progression', '빌드업'], ['tempo', '템포'], ['vo2', '인터벌'], ['speed', '스피드'], ['mpace', 'MP'], ['race', '레이스'], ['rest', '휴식']];
const TP_SHAPE = [1, 1.08, 1.16, 0.8]; // three weeks building, one easier week to absorb them

function tpShort(k) { const x = TP_KINDS.find(t => t[0] === k); return x ? x[1] : ''; }
function monthKey(y, m) { return y + '-' + pad2(m); }

// Monday-to-Sunday weeks touching the month; days = the dates of that week inside the month
function monthWeeks(y, m) {
  const first = daysFromCivil(y, m, 1), last = daysFromCivil(m === 12 ? y + 1 : y, m === 12 ? 1 : m + 1, 1) - 1, out = [];
  for (let mon = first - ((weekday(first) + 6) % 7); mon <= last; mon += 7) {
    const days = [];
    for (let d = Math.max(mon, first); d <= Math.min(mon + 6, last); d++) days.push(d);
    out.push({ mon, days });
  }
  return out;
}

// split a monthly goal over its weeks; weeks in `fixed` keep their km and the rest share what's left. Weeks come out in whole km and add up to the goal.
function splitMonth(goal, y, m, fixed) {
  const weeks = monthWeeks(y, m), wk = fixed || {};
  let n = 0; // a stub of a week at the month's edge doesn't count as a step in the build-up
  const weight = weeks.map(w => w.days.length / 7 * (w.days.length >= 4 ? TP_SHAPE[n++ % TP_SHAPE.length] : 1));
  const isFixed = w => isNum(wk[w.mon]);
  const left = Math.max(0, goal - sum(weeks.filter(isFixed).map(w => wk[w.mon])));
  const total = sum(weeks.map((w, i) => isFixed(w) ? 0 : weight[i]));
  const res = weeks.map((w, i) => Object.assign({}, w, { fixed: isFixed(w), km: isFixed(w) ? wk[w.mon] : total > 0 ? Math.round(left * weight[i] / total) : 0 }));
  const free = res.filter(w => !w.fixed);
  if (free.length) {
    const big = free.reduce((a, b) => b.km > a.km ? b : a);
    big.km = Math.max(0, Math.round((big.km + left - sum(free.map(w => w.km))) * 10) / 10);
  }
  return res;
}

// average km per week over the last 4 finished weeks
function recentWeekKm(runs, today) {
  const mon = today - ((weekday(today) + 6) % 7);
  return sum(runs.filter(r => r.day >= mon - 28 && r.day < mon).map(r => r.dist)) / 1000 / 4;
}

// the biggest full week against what the runner has been doing lately; null when it's a safe step (or there's no recent running to compare)
function tpLoadWarn(weeks, base) {
  if (!(base >= 5)) return null;
  const full = weeks.filter(w => w.days.length === 7), peak = full.length ? Math.max(...full.map(w => w.km)) : 0;
  return peak > base * 1.3 ? { peak, base } : null;
}

// '5:30', '5.30', '530' or the app's own 5'30" → seconds per km (3:00–12:59); '' → 0; anything else → null
function parsePace(s) {
  const t = String(s || '').trim().replace(/"$/, ''); if (!t) return 0;
  const m = /^(\d{1,2})[:.'](\d{2})$/.exec(t) || /^(\d{1,2})(\d{2})$/.exec(t);
  if (!m || +m[2] > 59) return null;
  const p = +m[1] * 60 + +m[2];
  return p >= 180 && p < 780 ? p : null;
}

function icsText(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
// RFC 5545: a line is at most 75 bytes, and folding must not cut a Korean character in half
function icsFold(line) {
  const size = c => { const n = c.codePointAt(0); return n < 0x80 ? 1 : n < 0x800 ? 2 : n < 0x10000 ? 3 : 4; };
  const out = []; let cur = '', bytes = 0;
  for (const c of line) {
    if (bytes + size(c) > (out.length ? 74 : 75)) { out.push(cur); cur = ''; bytes = 0; }
    cur += c; bytes += size(c);
  }
  out.push(cur);
  return out.join('\r\n ');
}
function tpTitle(e) { return WK[e.k].name + (e.km ? ' ' + e.km + 'km' : ''); }
function icsStamp(utc) { return new Date(utc * 1000).toISOString().replace(/[-:]|\.\d+/g, ''); }
function icsDate(day) { return dayISO(day).replace(/-/g, ''); }

// all-day events for the planned runs from day a to day b; rest days stay out of the phone's calendar. Each date has a fixed UID so a re-import can match it.
function buildIcs(plan, a, b, nowSec) {
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//SOOM//Training Plan//KO', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:SOOM 훈련'];
  let n = 0;
  for (let d = a; d <= b; d++) {
    const e = plan.days[dayISO(d)];
    if (!e || !WK[e.k] || e.k === 'rest') continue;
    n++;
    L.push('BEGIN:VEVENT', 'UID:soom-' + icsDate(d) + '@trade-on-master.github.io', 'DTSTAMP:' + icsStamp(nowSec), 'DTSTART;VALUE=DATE:' + icsDate(d), 'DTEND;VALUE=DATE:' + icsDate(d + 1),
      'SUMMARY:' + icsText(tpTitle(e)), 'DESCRIPTION:' + icsText((e.pace ? '목표 페이스 ' + fmtPace(e.pace) + '/km\n' : '') + WK[e.k].purpose), 'TRANSP:TRANSPARENT', 'END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return { n, text: L.map(icsFold).join('\r\n') + '\r\n' };
}

// ===== core_course.js — same courses: runs that follow the same path, compared with the weather taken out =====
// Found from the route shape alone, on the device: the start and the finish within 250 m, the distance within 12 %, and at least
// 85 % of each path within 60 m of the other's. Comparisons use the moving pace with the heat/wind effect (러닝 날씨 영향) taken out.
const CRS = { step: 50, near: 60, share: 0.85, endM: 250, tol: 0.12, minM: 1000, maxPts: 400 };
const CSIG = new Map();
// the route resampled every 50 m (lat/lon), kept per run
function courseSig(r) {
  const rt = r && !r.indoor && r.route; if (!rt || !rt.la || rt.la.length < 10 || !rt.d || rt.d.length !== rt.la.length) return null;
  const total = rt.d[rt.d.length - 1]; if (!(total >= CRS.minM)) return null;
  const hit = CSIG.get(r.id); if (hit && hit.np === rt.la.length && hit.total === total) return hit;
  const n = clamp(Math.round(total / CRS.step) + 1, 20, CRS.maxPts), la = [], lo = [];

function tableTwin(cfg) {

// track-oval gauge: the score runs around a 400 m-track shape
function ovalGauge(score, color, label) {
  const W = 168, H = 108, sw = 13, rx = (H - sw) / 2;
  const x0 = sw / 2, y0 = sw / 2, w = W - sw, h = H - sw;
  const path = 'M' + (x0 + rx) + ' ' + (y0 + h) + 'H' + (x0 + w - rx) + 'A' + rx + ' ' + rx + ' 0 0 0 ' + (x0 + w - rx) + ' ' + y0 + 'H' + (x0 + rx) + 'A' + rx + ' ' + rx + ' 0 0 0 ' + (x0 + rx) + ' ' + (y0 + h) + 'Z';
  const p = isNum(score) ? clamp(score, 0, 100) : 0;
  return '<div class="oval"><svg viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">' +
    '<path d="' + path + '" fill="none" style="stroke:var(--surface-2)" stroke-width="' + sw + '"/>' +
    '<path d="' + path + '" fill="none" style="stroke:' + color + '" stroke-width="' + sw + '" pathLength="100" stroke-dasharray="' + p + ' 100" stroke-linecap="butt"/>' +
    '<path d="' + path + '" fill="none" style="stroke:var(--surface)" stroke-width=".9" stroke-dasharray="3 3" opacity=".75"/>' +
    '<line x1="' + (x0 + rx) + '" x2="' + (x0 + rx) + '" y1="' + (y0 + h - sw / 2) + '" y2="' + (y0 + h + sw / 2) + '" style="stroke:var(--ink)" stroke-width="2"/>' +
    '</svg><div class="c"><span class="num">' + (isNum(score) ? Math.round(score) : '–') + '</span><span style="color:' + color + '">' + esc(label || '') + '</span></div></div>';
}

function routeSVG(r) {
  const rt = r.route; if (!rt || rt.la.length < 5) return '';
  const lat0 = mean(rt.la), kx = Math.cos(lat0 * Math.PI / 180);
  const X = rt.lo.map(v => v * kx), Y = rt.la;
  const minX = Math.min(...X), maxX = Math.max(...X), minY = Math.min(...Y), maxY = Math.max(...Y);
  const W = 400, H = 300, pad = 28;
  const sc = Math.min((W - 2 * pad) / Math.max(1e-9, maxX - minX), (H - 2 * pad) / Math.max(1e-9, maxY - minY));
  const ox = (W - (maxX - minX) * sc) / 2, oy = (H - (maxY - minY) * sc) / 2;
  const px = i => (ox + (X[i] - minX) * sc).toFixed(1), py = i => (H - oy - (Y[i] - minY) * sc).toFixed(1);
  const mPerPx = 111320 / sc; // one degree of latitude ≈ 111.32 km
  const nice = [20, 50, 100, 200, 250, 500, 1000, 2000, 2500, 5000, 10000, 20000, 50000];
  let unit = nice[0]; for (const v of nice) if (v / mPerPx <= 110) unit = v;
  const upx = unit / mPerPx;
  const s = r.ser, sp0 = [];
  for (let i = 0; i < rt.la.length; i++) { const k = clamp(bsearch(s.d, rt.d[i]), 0, s.d.length - 1); sp0.push(s.v[k] / 100); }
  const sp = sp0.map((_, i) => mean(sp0.slice(Math.max(0, i - 4), i + 5)));
  const mv = sp.filter(v => v > 1);
  const qs = [0.2, 0.4, 0.6, 0.8].map(q => quantile(mv, q));
  const bucket = v => v < qs[0] ? 0 : v < qs[1] ? 1 : v < qs[2] ? 2 : v < qs[3] ? 3 : 4;
  let out = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="러닝 경로 (속도별 색, 1km마다 표시)">';
  // faint grid, one square = the scale-bar length
  if (upx >= 18) { out += '<g style="stroke:var(--line)" stroke-width="1" opacity=".7">'; for (let x = W / 2 % upx; x < W; x += upx) out += '<line x1="' + x.toFixed(1) + '" x2="' + x.toFixed(1) + '" y1="0" y2="' + H + '"/>'; for (let y = H / 2 % upx; y < H; y += upx) out += '<line x1="0" x2="' + W + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/>'; out += '</g>'; }
  let cur = -1, pts = '';
  out += '<polyline points="' + rt.la.map((_, i) => px(i) + ',' + py(i)).join(' ') + '" fill="none" style="stroke:var(--surface)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>';
  for (let i = 1; i < rt.la.length; i++) {
    const b = bucket(sp[i]);
    if (b !== cur) { if (pts) out += '<polyline points="' + pts + '" fill="none" style="stroke:' + ZC[cur] + '" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'; cur = b; pts = px(i - 1) + ',' + py(i - 1); }
    pts += ' ' + px(i) + ',' + py(i);
  }
  if (pts) out += '<polyline points="' + pts + '" fill="none" style="stroke:' + ZC[cur] + '" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>';
  const L = rt.la.length - 1;
  // kilometre marks (every 1, 2 or 5 km so long runs stay readable)
  const totKm = (rt.d[L] || 0) / 1000, every = totKm <= 12 ? 1 : totKm <= 26 ? 2 : 5;
  for (let k = every; k < totKm - every * 0.25; k += every) {
    const i = rt.d.findIndex(d => d >= k * 1000); if (i < 0) break;
    out += '<g><circle cx="' + px(i) + '" cy="' + py(i) + '" r="8.5" style="fill:var(--surface);stroke:var(--ink-2)" stroke-width="1.5"/><text x="' + px(i) + '" y="' + (+py(i) + 3.3).toFixed(1) + '" text-anchor="middle" style="fill:var(--ink)" font-size="9.5" font-weight="700">' + k + '</text></g>';
  }
  out += '<circle cx="' + px(0) + '" cy="' + py(0) + '" r="7" style="fill:var(--good);stroke:var(--surface)" stroke-width="3"/>';
  out += '<rect x="' + (px(L) - 6) + '" y="' + (py(L) - 6) + '" width="12" height="12" rx="2" style="fill:var(--ink);stroke:var(--surface)" stroke-width="3"/>';
  // scale bar and north arrow
  const sx = 14, sy = H - 14, lbl = unit >= 1000 ? (unit / 1000) + ' km' : unit + ' m';
  out += '<g style="stroke:var(--ink-2)" stroke-width="1.5" fill="none"><path d="M' + sx + ' ' + (sy - 4) + 'V' + sy + 'H' + (sx + upx).toFixed(1) + 'V' + (sy - 4) + '"/></g><text x="' + (sx + upx + 6).toFixed(1) + '" y="' + (sy + 1) + '" style="fill:var(--ink-2)" font-size="11">' + lbl + '</text>';
  out += '<g transform="translate(' + (W - 20) + ' 22)"><path d="M0 -10 L6 6 L0 2 L-6 6 Z" style="fill:var(--ink-2)"/><text y="19" text-anchor="middle" style="fill:var(--ink-2)" font-size="10" font-weight="700">N</text></g>';
  return out + '</svg>';
}
// opens this run's route on a real map in a new tab (geojson.io reads the route from the link itself)
function mapLink(r) {
  const rt = r.route; if (!rt || rt.la.length < 2) return '';
  const n = rt.la.length, step = Math.max(1, Math.ceil(n / 300)), c = [];
  for (let i = 0; i < n; i += step) c.push([round(rt.lo[i], 5), round(rt.la[i], 5)]);
  if ((n - 1) % step) c.push([round(rt.lo[n - 1], 5), round(rt.la[n - 1], 5)]);
  const fc = { type: 'FeatureCollection', features: [
    { type: 'Feature', properties: { name: fmtDay(r.day) + ' 러닝 ' + (r.dist / 1000).toFixed(2) + 'km', stroke: '#4f46e5', 'stroke-width': 4, 'stroke-opacity': 0.9 }, geometry: { type: 'LineString', coordinates: c } },
    { type: 'Feature', properties: { name: '출발', 'marker-color': '#16a34a' }, geometry: { type: 'Point', coordinates: c[0] } },
    { type: 'Feature', properties: { name: '도착', 'marker-color': '#111827' }, geometry: { type: 'Point', coordinates: c[c.length - 1] } }] };

// Garmin-style colour gauge for running dynamics. ranges: 4 cut points from worst to best side.
const DYN_RANGES = {
  cad: { name: '케이던스', unit: 'spm', cuts: [151, 163, 174, 186], better: 'high', fmt: v => Math.round(v) },
  gc: { name: '지면 접촉 시간', unit: 'ms', cuts: [308, 278, 248, 218], better: 'low', fmt: v => Math.round(v) },
  vo: { name: '수직 진폭', unit: 'cm', cuts: [11.5, 9.75, 8.15, 6.4], better: 'low', fmt: v => v.toFixed(1) },
  vr: { name: '수직 비율', unit: '%', cuts: [10.1, 8.65, 7.45, 6.1], better: 'low', fmt: v => v.toFixed(1) },
};
const GCOL = ['var(--g-red)', 'var(--g-orange)', 'var(--g-green)', 'var(--g-blue)', 'var(--g-purple)'];

function dynGauge(key, v) {
  const R = DYN_RANGES[key]; if (!isNum(v)) return '';

  // position within its zone (0..1) → overall 0..100%
  const edges = [hi ? c[0] - (c[1] - c[0]) : c[0] + (c[0] - c[1]), ...c, hi ? c[3] + (c[3] - c[2]) : c[3] - (c[2] - c[3])];
  const a = edges[zone], b = edges[zone + 1];

  const pos = (zone + f) / 5 * 100;
  return '<div class="gauge"><div class="gl"><span>' + esc(R.name) + '</span><span><b>' + esc(R.fmt(v)) + '</b> <span class="xs muted">' + R.unit + '</span> · <span class="xs" style="font-weight:700">' + GNAME[zone] + '</span></span></div>' +
    '<div class="gt">' + GCOL.map(col => '<i style="background:' + col + '"></i>').join('') + '<span class="mk" style="left:' + pos + '%"></span></div>' +
    '<div class="gs"><span>' + (hi ? '낮음' : '큼') + '</span><span>' + (hi ? '높음 (좋음)' : '작음 (좋음)') + '</span></div></div>';
}

function teBars(label, v) {

  load: { t: '훈련 부하', b: '운동이 몸에 준 자극의 크기예요. 오래, 높은 심박으로 달릴수록 커져요. 걷기·근력 같은 다른 운동도 심박으로 함께 계산해요.', how: '심박 기반 TRIMP(배니스터 방식): 매 순간 \'여유 심박 대비 강도\'에 강도가 높을수록 커지는 가중치를 곱해 더해요. 심박이 끊긴 러닝은 경사 보정 페이스로 대신 계산해요.', ref: '가민 \'운동 부하\', 코로스 \'트레이닝 로드\'' },
  fitness: { t: '기초 체력 · 단기 피로 · 폼', b: '기초 체력은 최근 6주 부하 평균(쌓아 온 체력), 단기 피로는 최근 1주 부하 평균, 폼은 어제 기준 둘의 차이예요. 폼이 플러스면 몸이 가볍고, 크게 마이너스면 피로가 쌓인 상태예요.', how: '지수 가중 이동 평균(체력 42일, 피로 7일). 레이스 직전에는 폼을 +5~+20으로 만드는 게 좋아요(테이퍼).', ref: '코로스 \'베이스 피트니스·로드 임팩트\', 트레이닝피크스 \'CTL·ATL·TSB\'' },
  acwr: { t: '부하 비율', b: '최근 1주 부하가 평소(6주)보다 얼마나 큰지예요. 0.8~1.3이 적당하고, 1.5를 넘으면 부상 위험이 커져요.', how: '단기 피로(7일 평균) ÷ 기초 체력(42일 평균).', ref: '가민 \'급성 부하 비율\', 코로스 \'강도 추세\'' },
  fatigue: { t: '피로도', b: '0은 완전히 회복된 상태, 50은 평소 훈련하는 정도, 80 이상은 많이 지친 상태예요.', how: '단기 피로와 기초 체력의 차이를 0~100으로 바꿨어요.', ref: '코로스 \'피로도\'' },
  focus: { t: '부하 집중도 (4주)', b: '최근 4주 부하가 저강도 유산소, 고강도 유산소, 무산소 중 어디에 쏠렸는지 보여줘요. 고르게 채울수록 체력이 균형 있게 올라요. 점선 상자는 목표 범위예요.', how: '달리는 동안 심박이 젖산역치의 89% 미만이면 저강도, 그 이상이면 고강도 유산소, VO2max 속도보다 빠르면 무산소로 나눠 부하를 더해요. 목표: 저강도 45~70%, 고강도 20~45%, 무산소 3~12%.', ref: '가민 \'훈련 부하 집중도\'' },
  dist: { t: '강도 분포 (4주)', b: '달린 시간 중 각 심박 구간에 머문 비율이에요. 엘리트 선수들도 약 80%는 편하게(1~2구간), 20%만 힘들게 달려요.', how: '4주간 러닝의 심박 구간별 시간을 더해요.', ref: '코로스 \'4주 강도 분포\', 80/20 훈련법' },
  vo2: { t: '러닝 VO2max (VDOT)', b: '달리기 능력을 나타내는 지수예요. 높을수록 같은 속도를 더 편하게 달려요. 레이스 예측과 훈련 페이스가 모두 이 값에서 나와요.', how: '① 최근 8주 기록 중 가장 좋은 구간 기록(언덕 보정)을 잭 다니엘스 공식으로 환산하고, ② 꾸준히 달린 구간의 심박-속도 관계로 VO2max를 추정해 합쳐요. 최근에 최선을 다해 달린 적이 없으면 심박 추정 쪽으로 보정해요.', ref: '가민 \'VO2 Max\', 코로스 \'러닝 레벨\'' },
  apple: { t: '애플 심폐 체력', b: '애플워치가 실외 걷기·달리기 중 측정한 VO2max예요. 걷기도 포함한 전반적인 심폐 체력에 가까워요.', how: '건강 앱의 \'심폐 체력(VO2 최대)\' 기록을 그대로 가져와요.', ref: '' },
  fitAge: { t: '체력 나이', b: '내 VO2max가 몇 살의 평균과 같은지 보여줘요. 실제 나이보다 낮을수록 좋아요.', how: '애플 심폐 체력(없으면 러닝 VO2max)을 나이·성별 평균과 비교해요.', ref: '가민 \'피트니스 나이\'' },
  preds: { t: '레이스 예측', b: '지금 체력으로 각 거리를 최선을 다해 달렸을 때 예상 기록이에요.', how: '러닝 VO2max로 다니엘스 공식의 예상 기록을 구한 뒤, 하프·풀은 최근 6주 주간 거리와 최장 거리가 부족한 만큼 느리게 보정해요. 실제 기록은 코스·날씨·컨디션에 따라 ±2~3% 달라질 수 있어요.', ref: '가민·코로스 \'레이스 예측\'' },
  paces: { t: '훈련 페이스', b: '목적에 맞는 훈련 속도예요. 이지런은 이지 페이스, 템포런은 역치 페이스처럼 맞춰 달리면 효과가 커져요.', how: '러닝 VO2max의 일정 비율(회복 55~60%, 이지 62~70%, 역치 87~89%, 인터벌 96~99%, 반복 104~108%)에 해당하는 속도예요. 마라톤 페이스는 풀코스 예측 기록 기준이에요.', ref: '잭 다니엘스 VDOT 훈련 페이스' },
  zones: { t: '심박 구간', b: '운동 강도를 5단계로 나눈 심박 범위예요. 1~2구간은 편한 유산소, 3구간은 템포, 4구간은 역치, 5구간은 최대 강도예요.', how: '설정에서 기준을 고를 수 있어요: 여유심박(기본) · 최대심박 · 젖산역치. 최대·안정·역치 심박은 기록에서 자동으로 찾고, 직접 입력할 수도 있어요. 구간은 기록이 쌓이면서 자동으로 바뀌고(안정 심박은 최근 30일, 최대 심박은 최근 1년, 젖산역치는 최근 6개월 기록), 지난 러닝은 그날까지의 기록으로 정한 그날의 구간으로 계산해요. 그래서 나중에 구간이 바뀌어도 지난 기록의 구간별 시간과 훈련 부하는 그대로예요. 설정에 숫자를 직접 넣으면 모든 기록에 그 값을 써요.', ref: '가민·코로스 심박 구간' },
  te: { t: '훈련 효과', b: '이번 운동이 체력에 준 효과를 0~5로 보여줘요. 2점대 유지, 3점대 향상, 4점대 크게 향상, 5는 과도해요.', how: '유산소 효과는 이 운동의 부하를 평소 체력(기초 체력)과 비교해 계산하고, 무산소 효과는 역치 이상 심박 시간, VO2max 속도 이상 달린 시간, 짧은 질주 횟수로 계산해요.', ref: '가민 \'트레이닝 이펙트\', 코로스 \'트레이닝 이펙트\'' },
  label: { t: '운동 유형 (주요 효과)', b: '이번 운동이 주로 어떤 능력을 키웠는지예요: 회복 · 기초 지구력 · 장거리 · 템포 · 역치 · VO2max · 무산소 · 스프린트.', how: '젖산역치 대비 심박 분포, 빠른 구간 시간, 무산소 효과, 운동 시간으로 분류해요.', ref: '가민 \'주요 효과\'' },
  decoup: { t: '심박 드리프트', b: '같은 속도로 달려도 후반에 심박이 얼마나 올랐는지예요. 5% 미만이면 그 거리에 대한 유산소 지구력이 충분하다는 뜻이에요.', how: '처음 10분을 뺀 구간을 앞뒤 절반으로 나눠 \'심박 1회당 속도\'를 비교해요. 일정한 페이스로 40분 이상 달린 운동만 계산해요.', ref: '트레이닝피크스 \'유산소 디커플링(Pa:Hr)\'' },
  perf: { t: '러닝 퍼포먼스', b: '그날 달리기가 평소 체력에 비해 얼마나 좋았는지예요. 100%가 평소 수준이고, 높을수록 컨디션이 좋았던 거예요.', how: '이번 운동의 심박-속도로 추정한 VO2max ÷ 현재 러닝 VO2max (80~120%).', ref: '코로스 \'러닝 퍼포먼스\', 가민 \'퍼포먼스 컨디션\'' },
  gap: { t: '경사 보정 페이스 (GAP)', b: '오르막·내리막을 평지로 바꿔 계산한 페이스예요. 언덕이 많은 날의 실제 노력을 공정하게 비교할 수 있어요.', how: '구간마다 경사에 따른 에너지 비용 차이(스트라바 연구 곡선에 가까운 근사식)를 반영해요.', ref: '스트라바 \'GAP\'' },
  dynamics: { t: '러닝 폼 (러닝 다이내믹스)', b: '애플워치가 측정한 달리기 자세 지표예요. 색 막대는 가민이 많은 러너를 조사해 만든 기준이고, 오른쪽(보라)으로 갈수록 숙련된 러너에 가까워요.', how: '케이던스: 분당 걸음 수(높을수록 효율적) · 지면 접촉 시간: 발이 땅에 닿아 있는 시간(짧을수록 좋음) · 수직 진폭: 몸이 위아래로 움직인 높이(작을수록 좋음) · 수직 비율: 수직 진폭 ÷ 보폭(작을수록 효율적). 키와 속도에 따라 자연스러운 값이 달라서 \'변화 추세\'가 더 중요해요. 애플워치는 손목에서 추정하므로 가슴 센서 기준과 조금 다를 수 있어요.', ref: '가민 \'러닝 다이내믹스\'' },
  cp: { t: '역치 파워 (CP)', b: '오래 유지할 수 있는 최대 러닝 파워예요. 파워는 언덕·바람에도 즉시 반응해서 일정한 노력을 유지하는 데 좋아요.', how: '최근 90일 최고 3분·12분 평균 파워로 임계 파워 모델을 계산해요.', ref: '스트라이드 \'Critical Power\'' },
  hrv: { t: 'HRV 상태', b: '심박변이도(HRV)는 자율신경의 회복 상태를 보여줘요. 평소 범위 안에 있으면 \'균형\', 크게 낮아지면 피로·스트레스·질병의 신호일 수 있어요.', how: '애플워치가 주로 수면 중 측정하는 HRV(SDNN)의 7일 평균을 지난 60일 기준 범위(초록 띠)와 비교해요. 하루 값보다 흐름이 중요해요.', ref: '가민 \'HRV 상태\'' },
  rhr: { t: '안정 심박', b: '쉬고 있을 때의 심박수예요. 체력이 좋아지면 서서히 낮아지고, 피로하거나 아플 때는 올라가요.', how: '애플워치가 기록한 하루 안정 심박을 30일 중앙값과 비교해요.', ref: '' },
  sleep: { t: '수면 점수', b: '수면 시간과 질을 0~100점으로 보여줘요. 80점 이상이면 좋아요.', how: '수면 시간(40점), 깊은 수면 비율(20점, 13% 이상 만점), 렘 수면 비율(20점, 20% 이상 만점), 깨어 있던 시간(20점)으로 계산해요. 애플워치를 차고 자야 수면 단계가 기록돼요.', ref: '가민 \'수면 점수\'' },
  temp: { t: '손목 체온 변화', b: '수면 중 손목 체온이 평소보다 얼마나 다른지예요. 0.5°C 이상 오르면 몸살·피로의 신호일 수 있어요.', how: '애플워치(시리즈 8 이후)의 수면 중 손목 체온을 30일 중앙값과 비교해요.', ref: '' },
  prs: { t: '개인 기록', b: '모든 러닝에서 찾은 거리별 가장 빠른 구간 기록이에요(레이스가 아니어도 포함돼요).', how: '각 러닝 안에서 해당 거리를 가장 빨리 달린 구간을 찾아요(멈춘 시간 제외). GPS 오차로 몇 초 차이가 날 수 있어요.', ref: '가민 \'개인 기록\'' },
  abilities: { t: '거리별 실력 균형', b: '짧은 거리부터 긴 거리까지 기록이 고르게 좋은지 보여줘요. 낮은 막대는 그 거리대가 상대적 약점이거나, 최근 그 거리를 힘껏 달린 적이 없다는 뜻이에요.', how: '최근 12주 거리대별 최고 기록을 VDOT으로 바꿔 현재 러닝 VO2max와 비교해요(100% = 같은 수준).', ref: '코로스 \'러닝 피트니스 분석\'' },
  efficiency: { t: '유산소 효율', b: '같은 심박으로 얼마나 빨리 달리는지예요. 선이 위로 갈수록(빨라질수록) 유산소 체력이 좋아지고 있다는 뜻이에요.', how: '이지런마다 \'경사 보정 속도 ÷ 심박\'을 구해, 기준 심박에서의 예상 페이스로 바꿔요.', ref: '트레이닝피크스 \'효율 지수(EF)\'' },
  weekly: { t: '주간 거리', b: '주(월~일)마다 달린 거리예요. 한 주에 10% 넘게 갑자기 늘리면 부상 위험이 커져요.', how: '진한 막대는 이번 주(진행 중)예요.', ref: '' },
  plan: { t: '훈련 계획', b: '목표 거리와 대회 날짜에 맞춰 이번 주 일정을 만들어요. 날짜가 없으면 목표 거리에 맞춘 꾸준한 향상 계획을, 목표 거리도 없으면 전반적인 체력 향상 계획을 짜요. 오늘 훈련은 컨디션 점수와 회복 시간에 따라 자동으로 조정돼요.', how: '최근 4주 평균 주간 거리에서 10% 이내로 늘리고, 4주에 한 번은 회복 주간을 둬요. 부하 집중도에서 부족한 영역을 핵심 훈련에 반영해요. 설정에서 주당 러닝 횟수, 장거리 요일, 목표 레이스를 바꿀 수 있어요.', ref: '가민 \'추천 운동\'·가민 코치' },
  loadRange: { t: '주간 권장 부하', b: '체력을 늘리면서도 무리하지 않는 이번 주(최근 7일) 부하 범위예요. 초록 띠 안에 있으면 좋아요.', how: '기초 체력(42일 평균 하루 부하) × 7일의 100~130%.', ref: '코로스 \'권장 7일 부하\'' },
  calendar: { t: '훈련 캘린더', b: '최근 12주 동안 달린 날을 보여줘요. 색이 진할수록 그날 부하가 컸어요.', how: '', ref: '' },
  power: { t: '러닝 파워', b: '달리는 데 쓰는 힘(와트)이에요. 애플워치 시리즈 6 이후에서 기록돼요.', how: '', ref: '' },

// ===== ui_map.js — the route on a real map, coloured by pace like the Fitness app =====
// Only in the home-screen web app: claude.ai pages may not load map pictures, so there the route stays a drawing.
const MAPS = new Set();
let FULLMAP = null;
function mapsOn() { return typeof TARGET !== 'undefined' && TARGET === 'web' && typeof L !== 'undefined'; }
function clearMaps() { for (const m of MAPS) { try { m.remove(); } catch (e) { /* already gone */ } } MAPS.clear(); }
function isDarkUI() { const t = document.documentElement.dataset.theme; return t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches); }
const OSM_ATTR = '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>';
// map pictures that need no key: OpenStreetMap's own, then the French OpenStreetMap servers; if neither loads, say so on the map
// (CARTO's free pictures now come back with an "API key required" stamp, so they are no longer used)
function tileSources() {
  return [
    { url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', subdomains: '', maxNativeZoom: 19, attribution: OSM_ATTR },
    { url: 'https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', subdomains: 'abc', maxNativeZoom: 19, attribution: OSM_ATTR + ' · OSM France' },
  ];
}
function mapNote(el, text) { const n = document.createElement('div'); n.className = 'map-note'; n.textContent = text; el.appendChild(n); }
function addTiles(map, el, k) {
  const src = tileSources()[k];
  if (!src) { mapNote(el, '지도 그림을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.'); return; }
  const layer = L.tileLayer(src.url, { subdomains: src.subdomains || 'abc', maxNativeZoom: src.maxNativeZoom, maxZoom: 20, attribution: src.attribution }).addTo(map);
  let ok = 0, bad = 0, asked = 0, done = false, timer = null;
  layer.on('tileloadstart', () => { asked++; });
  layer.on('tileload', () => { ok++; });
  layer.on('tileerror', () => { // pictures fail and none has arrived: try the next source
    bad++; clearTimeout(timer);
    timer = setTimeout(() => {
      if (done || ok > 0 || bad < Math.min(2, asked) || !el.isConnected) return;
      done = true; try { map.removeLayer(layer); } catch (e) { /* map gone */ } addTiles(map, el, k + 1);
    }, 400);
  });
}

// ---- Kakao Map: SOOM's own key (built in), or the person's own free JavaScript key ----
// Kakao counts one call each time a map is created; the free amount (300,000 a day) is far more than SOOM needs.
let KAKAO = null; // promise of the loaded SDK
function kakaoKey() {
  const S = st.settings || {};
  if (S.map === 'osm') return '';
  if (S.mapKind === 'kakao' && S.kakaoKey) return String(S.kakaoKey).trim(); // a key the person entered themselves
  return KAKAO_KEY || '';
}
// Kakao Map shows Korea in detail and little elsewhere: runs abroad stay on OpenStreetMap
function inKorea(lat, lon) { return lat >= 33 && lat <= 38.9 && lon >= 124.5 && lon <= 132; }
function routeInKorea(rt) { const n = rt.la.length; return inKorea(rt.la[0], rt.lo[0]) && inKorea(rt.la[n - 1], rt.lo[n - 1]) && inKorea(rt.la[n >> 1], rt.lo[n >> 1]); }

  if (KAKAO && KAKAO.key === key) return KAKAO.p;
  const p = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&libraries=services&appkey=' + encodeURIComponent(key);
    const t = setTimeout(() => rej(new Error('timeout')), 9000);
    sc.onload = () => { try { window.kakao.maps.load(() => { clearTimeout(t); res(window.kakao); }); } catch (e) { clearTimeout(t); rej(e); } };
    sc.onerror = () => { clearTimeout(t); rej(new Error('load')); };
    document.head.appendChild(sc);
  });
  KAKAO = { key, p }; p.catch(() => { KAKAO = null; });
  return p;
}

function drawKakao(el, r, full, kakao) {
  const K = kakao.maps, rt = r.route, dark = isDarkUI();
  const path = rt.la.map((la, i) => new K.LatLng(la, rt.lo[i]));
  el.innerHTML = ''; el.classList.add('kakao-map'); if (dark) el.classList.add('kakao-dark');
  const map = new K.Map(el, { center: path[0], level: 5, draggable: full, scrollwheel: full, disableDoubleClickZoom: !full });
  if (!full) map.setZoomable(false);
  new K.Polyline({ map, path, strokeWeight: full ? 10 : 8, strokeColor: dark ? '#0b0c10' : '#ffffff', strokeOpacity: 0.95, strokeStyle: 'solid' });
  const sp = routeSpeeds(r), [lo, hi] = speedRange(sp), span = Math.max(0.05, hi - lo);
  const step = f => Math.round(clamp(f, 0, 1) * 24) / 24;
  let seg = [path[0]], cur = step((sp[1] - lo) / span);
  for (let i = 1; i < path.length; i++) {
    const q = step((sp[i] - lo) / span); seg.push(path[i]);
    if (q !== cur || i === path.length - 1) { new K.Polyline({ map, path: seg, strokeWeight: full ? 6 : 5, strokeColor: hex(paceRGB(cur)), strokeOpacity: 1, strokeStyle: 'solid' }); seg = [path[i]]; cur = q; }
  }
  new K.CustomOverlay({ map, position: path[path.length - 1], content: '<div class="end-mark" style="width:16px;height:16px"></div>', xAnchor: 0.5, yAnchor: 0.5, zIndex: 3 });

// speed (m/s) at each route point, averaged over about 80 m either side so colours change smoothly along the road
function routeSpeeds(r) {
  const rt = r.route, s = r.ser, n = rt.la.length, raw = new Float64Array(n);
  for (let i = 0; i < n; i++) { const k = clamp(bsearch(s.d, rt.d[i]), 0, s.d.length - 1); raw[i] = s.v[k] / 100; }
  const out = []; let a = 0, b = -1, sum = 0, cnt = 0;
  for (let i = 0; i < n; i++) {
    while (b + 1 < n && rt.d[b + 1] <= rt.d[i] + 80) { b++; if (raw[b] > 0.5) { sum += raw[b]; cnt++; } }
    while (rt.d[a] < rt.d[i] - 80) { if (raw[a] > 0.5) { sum -= raw[a]; cnt--; } a++; }

}
function speedRange(sp) { const mv = sp.filter(v => v > 0.5); return mv.length ? [quantile(mv, 0.05), quantile(mv, 0.95)] : [0, 1]; }

const PACE_STOPS = [[0, [255, 59, 48]], [0.5, [255, 204, 0]], [1, [52, 199, 89]]];
function paceRGB(f) {

  const j = f <= 0.5 ? 0 : 1, a = PACE_STOPS[j], b = PACE_STOPS[j + 1], t = (f - a[0]) / (b[0] - a[0]);

}
function paceLegend(r) {

  return '<div class="pace-legend"><div class="pl-scale"><span class="pl-end">느림 <b>' + pace(lo) + '</b></span><span class="pl-bar" aria-hidden="true"></span><span class="pl-end"><b>' + pace(hi) + '</b> 빠름</span></div>' +
    '<div class="pl-pts"><span class="pl-pt"><i style="background:#34c759"></i>출발</span><span class="pl-pt"><i class="sq" style="background:#12141b"></i>도착</span></div></div>';
}

// draw a run's route on a map inside el. Inline maps sit still (page scrolling stays easy); the full-screen map moves freely.

  const key = kakaoKey();

    zoomControl: full && !coarse, attributionControl: true, dragging: full, touchZoom: full, doubleClickZoom: full, scrollWheelZoom: full,
    boxZoom: false, keyboard: full, tap: false, zoomSnap: 0.25, preferCanvas: true, fadeAnimation: true,

    const q = step((sp[i] - lo) / span);
    seg.push(pts[i]);
    if (q !== cur || i === pts.length - 1) { L.polyline(seg, Object.assign({ color: paceRGB(cur), weight: full ? 6 : 5 }, line)).addTo(map); seg = [pts[i]]; cur = q; }

function outfitInit(fc) {
  const now = st.M.now, nx = Math.ceil(now / 3600) * 3600;
  const days = st.M.plan && st.M.plan.days || [], b = days.map(d => d.wx && d.wx.best).find(x => x && x.s >= now - 1800);
  const t0 = b ? b.s : nx;

}
function outfitBox() {
  const fc = fcUsable(st.wx.fc, st.M.now); if (!fc) return '';
  if (!st.outfit) outfitInit(fc);
  const body = outfitBody(); if (!body) return '';
  return '<div class="divider"></div><h2 class="of-head">' + IC.shirt + '복장 추천</h2><div id="of-box">' + body + '</div>';

function outfitSet(k, v) {
  const o = st.outfit || (st.outfit = { d: st.M.today, h: 7, hard: false });
  if (k === 'hard') o.hard = !o.hard; else o[k] = +v;

}
function outfitBody() {
  const fc = fcUsable(st.wx.fc, st.M.now); if (!fc) return '';

  // hours we have a forecast for, grouped by local day (only from the current hour on)

  const dlist = [...byDay.keys()].slice(0, 7); if (!dlist.length) return '';

  const t = H.t[k], w = { t: H.temp[k], rh: H.rh[k], ws: H.ws[k], pp: H.pp[k], pr: H.pr[k], wc: H.wc[k], dark: isDarkAt(fc, t + 1800) };

// a small drawing of the route (no map) for lists
function crsThumb(r, size) {
  const S = size || 56, rt = r && r.route;
  if (!rt || rt.la.length < 3) return '<svg class="crs-thumb" viewBox="0 0 ' + S + ' ' + S + '" aria-hidden="true"></svg>';
  const kx = Math.cos(rt.la[0] * Math.PI / 180), X = rt.lo.map(v => v * kx), Y = rt.la, pad = 7;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < X.length; i++) { if (X[i] < minX) minX = X[i]; if (X[i] > maxX) maxX = X[i]; if (Y[i] < minY) minY = Y[i]; if (Y[i] > maxY) maxY = Y[i]; }
  const sc = Math.min((S - 2 * pad) / Math.max(1e-9, maxX - minX), (S - 2 * pad) / Math.max(1e-9, maxY - minY));
  const ox = (S - (maxX - minX) * sc) / 2, oy = (S - (maxY - minY) * sc) / 2, px = i => (ox + (X[i] - minX) * sc).toFixed(1), py = i => (S - oy - (Y[i] - minY) * sc).toFixed(1);
  const step = Math.max(1, Math.floor(rt.la.length / 150)); let pts = '';
  for (let i = 0; i < rt.la.length; i += step) pts += px(i) + ',' + py(i) + ' ';
  pts += px(rt.la.length - 1) + ',' + py(rt.la.length - 1);
  return '<svg class="crs-thumb" viewBox="0 0 ' + S + ' ' + S + '" aria-hidden="true"><polyline points="' + pts + '" fill="none" style="stroke:var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="' + px(0) + '" cy="' + py(0) + '" r="3.2" style="fill:var(--good);stroke:var(--surface-2)" stroke-width="1.5"/></svg>';
}

// iPhones offer 'add to calendar' only for a calendar file opened like a web page, so the service worker serves it from the phone's own cache
async function tpOpenIcs(text) {

  try {
    const c = await caches.open('run-files');
    await c.put(new URL('plan.ics', location.href), new Response(text, { headers: { 'Content-Type': 'text/calendar; charset=utf-8' } }));
    const r = await fetch('plan.ics', { cache: 'no-store' }); // an older service worker or none: use the file instead
    if (!r.ok || !/calendar/.test(r.headers.get('Content-Type') || '')) return false;
    location.href = 'plan.ics?t=' + Date.now();
    return true;
  } catch (e) { return false; }
}

function calendarCard() {
  const M = st.M, weeks = 12, thisMon = M.today - ((weekday(M.today) + 6) % 7), start = thisMon - 7 * (weeks - 1);
  const loads = {}; for (const r of M.runs) if (r.day >= start) loads[r.day] = (loads[r.day] || 0) + r.load;
  const vals = Object.values(loads); const q = [0.25, 0.5, 0.75].map(p => quantile(vals, p));
  const lvl = v => !v ? 0 : v < q[0] ? 0.3 : v < q[1] ? 0.5 : v < q[2] ? 0.75 : 1;
  let g = '<div class="cal" style="--cols:' + weeks + '">';
  for (let row = 0; row < 7; row++) {
    g += '<span>' + ['월', '', '수', '', '금', '', '일'][row] + '</span>';
    for (let c = 0; c < weeks; c++) {
      const d = start + c * 7 + row, v = loads[d], o = lvl(v);
      g += d > M.today ? '<i style="opacity:.3"></i>' : '<i title="' + fmtDay(d) + (v ? ' · 부하 ' + Math.round(v) : '') + '"' + (o ? ' style="background:var(--accent);opacity:' + o + '"' : '') + '></i>';
    }
  }
  g += '</div>';

}

function sleepChart(el, nights) {
  if (!el) return;
  const W = Math.max(240, el.clientWidth || 320), H = 150, m = { l: 30, r: 6, t: 8, b: 22 };
  const n = nights.length, pw = W - m.l - m.r, ph = H - m.t - m.b, maxH = Math.max(9, ...nights.map(x => (x.asleep || 0) / 3600 + (x.awake || 0) / 3600));
  const bw = Math.min(16, pw / n * 0.62), Y = v => m.t + ph - v / maxH * ph;
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" height="' + H + '" role="img" aria-label="최근 14일 수면"><g class="grid">';
  for (const t of [0, 4, 8]) s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(t) + '" y2="' + Y(t) + '"/><text x="' + (m.l - 6) + '" y="' + (Y(t) + 3.5) + '" text-anchor="end">' + t + 'h</text>';
  s += '</g>';
  nights.forEach((nt, i) => {
    const cx = m.l + (i + 0.5) * pw / n;
    if (i % 2 === (n - 1) % 2) s += '<text x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle">' + fmtDayShort(nt.d) + '</text>';
    if (!nt.asleep) return;
    const parts = nt.staged ? [[nt.deep, 'var(--sleep-deep)'], [nt.core, 'var(--sleep-core)'], [nt.rem, 'var(--sleep-rem)'], [nt.awake, 'var(--sleep-awake)']] : [[nt.asleep, 'var(--sleep-core)'], [nt.awake, 'var(--sleep-awake)']];
    let acc = 0;
    for (const [v, c] of parts) { if (!v) continue; const y1 = Y(acc / 3600), y2 = Y((acc + v) / 3600); s += '<rect x="' + (cx - bw / 2) + '" y="' + y2 + '" width="' + bw + '" height="' + Math.max(0, y1 - y2 - 1) + '" style="fill:' + c + '"/>'; acc += v; }
    s += '<text x="' + cx + '" y="' + (Y(acc / 3600) - 4) + '" text-anchor="middle" style="fill:var(--ink-2);font-size:10px">' + (nt.score || '') + '</text>';
  });
  el.innerHTML = s + '</svg><div class="legend"><span>막대 위 숫자 = 수면 점수</span></div>';
}

// ===== ui_app.js — navigation, events, import / backup flows, boot =====
const TAB_VIEWS = ['today', 'runs', 'training', 'growth', 'recovery', 'shoes'];
function tabOf(v) { if (TAB_VIEWS.includes(v)) return v; if (v.startsWith('course:') || v.startsWith('cmp:')) return 'runs'; if (v.startsWith('run:')) return st.back.includes('runs') ? 'runs' : st.back[st.back.length - 1] || 'runs'; return null; }

function render(keepScroll) {
  const v = st.view;
  const tab = tabOf(v);
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.v === tab ? 'page' : 'false'));
  renderBanner();
  clearMaps();
  st.mounts = []; st.dirty = false;
  let html;
  try {
    if (!st.M) html = '<div class="empty">불러오는 중…</div>';
    else if (v === 'today') html = vToday();
    else if (v === 'runs') html = vRuns();
    else if (v === 'training') html = vTraining();
    else if (v === 'growth') html = vGrowth();
    else if (v === 'recovery') html = vRecovery();
    else if (v === 'shoes') html = vShoes();
    else if (v === 'settings') html = vSettings();
    else if (v === 'import') html = vImport();
    else if (v === 'guide') html = vGuide();
    else if (v.startsWith('run:')) html = vRun(v.slice(4));
    else if (v.startsWith('course:')) html = vCourse(v.slice(7));
    else if (v.startsWith('cmp:')) html = vCompare(v.slice(4).split(','));
    else html = vToday();
  } catch (e) {
    console.error(e);
    html = '<div class="card"><div class="empty">화면을 그리는 중 문제가 생겼어요.<br><span class="xs">' + esc(e && e.message) + '</span></div></div>';
  }
  $('#view').innerHTML = html;
  for (const f of st.mounts) { try { f(); } catch (e) { console.error(e); } }
  if (!keepScroll) window.scrollTo(0, st.scroll[v] || 0);
}
function renderBanner() {

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, v = a.dataset.v;
  switch (act) {
    case 'tab': closeSheet(); st.cmp = { on: false, ids: [], from: null }; go(v); break;
    case 'go': closeSheet(); go(v); break;
    case 'back': goBack(); break;
    case 'run': closeSheet(); go('run:' + v); break;
    case 'info': openSheet(infoSheet(v)); break;
    case 'planday': openSheet(planDaySheet(+v)); break;
    case 'close': closeSheet(); break;
    case 'close-bg': if (e.target === a) closeSheet(); break;
    case 'filter': st.runFilter = v; st.runLimit = 60; render(true); break;
    case 'runs-tab': st.runsTab = v; render(true); break;
    case 'course': closeSheet(); go('course:' + v); break;
    case 'crs-rename': openSheet(crsRenameSheet(v)); break;
    case 'cmp-start': st.cmp = { on: true, ids: [], from: v || 'runs' }; if (v === 'runs') st.runsTab = 'list'; render(true); break;

async function doImport(files) {

  const t0 = Date.now();

  const prevMin = new Set(); if (prev) for (const r of prev.runs) { const k = Math.round(r.start / 60); prevMin.add(k - 1); prevMin.add(k); prevMin.add(k + 1); }
  try {

    const info = data.lastImport || {};
    if (!data.runs.length) throw new UserError(info.hae && !info.full ? '러닝 기록이 없어요. SOOM 폴더에서 \'SOOM 운동\'으로 시작하는 파일도 함께 골라 주세요.' : '러닝 기록을 찾지 못했어요. 애플워치 운동 앱의 \'실외 달리기\'·\'실내 달리기\'로 기록한 러닝만 분석할 수 있어요.');
    st.data = data;

    recompute();
    st.newIds = prev ? data.runs.filter(r => !prevMin.has(Math.round(r.start / 60))).map(r => r.id) : [];

      : n ? '새 러닝 ' + n + '개를 반영했어요' + (info.recChanged ? ' · 회복 기록도 최신으로 바꿨어요' : '')
      : info.recChanged ? '새 러닝은 없어요. 수면·회복 기록을 최신으로 반영했어요'

    render();
  } finally { try { if (wake) wake.release(); } catch (e) { /* ignore */ } }
}
function updateProgress(pr) {
  const map = { open: ['파일 여는 중…', 0, 0.02], xml: ['건강 기록 읽는 중', 0.02, 0.76], sort: ['운동별로 정리하는 중…', 0.76, 0.79], routes: ['러닝 경로·구간 분석 중', 0.79, 0.99],

  st.gear = (await DB.get('gear')) || LS.get('gear') || { shoes: [], pick: {} };
  if (!st.gear.pick) st.gear.pick = {};
  st.tplan = (await DB.get('tplan')) || LS.get('tplan') || { goals: {}, days: {} };
  const wxs = await DB.get('wx');
  if (wxs && wxs.v === WX_V && wxs.runs) { st.wx.runs = wxs.runs; st.wx.ktry = wxs.ktry || {}; }
  st.wx.kerr = LS.get('wxkerr') || null;
  const fcs = LS.get('wxfc'); if (fcs && fcs.v === WX_V) st.wx.fc = fcs;
  st.wx.place = LS.get('wxplace') || null;
  st.notes = LS.get('notes') || (await DB.get('notes')) || {};
  const saved = await DB.get('data');
  if (saved && Array.isArray(saved.runs) && saved.runs.length) { st.data = saved; st.saved = true; }
  else st.data = await makeDemoData();
  try { recompute(); } catch (e) { console.error(e); st.data = await makeDemoData(); recompute(); }
  const h = (location.hash || '').replace('#', '');
  if (TAB_VIEWS.includes(h)) st.view = h;
  render();
  setupDownloads();
  if (TARGET === 'web') {
    // keep the stored records from being cleared when the phone runs low on space, and make the app open offline
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* not supported */ }
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
    setTimeout(checkUpdate, 2500);
    setTimeout(() => wxSync(), 700);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { checkUpdate(); wxSync(); } });
  }
}
// a home-screen app often comes back without reloading; when a newer SOOM is online, load it (once per version)
async function checkUpdate() {
  try {
    if (st.importing || $('#sheet-root').innerHTML || document.querySelector('.mapfull')) return;
    const r = await fetch('version.json', { cache: 'no-store' }); if (!r.ok) return;
    const v = (await r.json()).v; if (!v || v === APP_VERSION) return;
    let tried = null; try { tried = sessionStorage.getItem('soom:reloadFor'); } catch (e) { /* storage blocked */ }
    if (tried === v) return;
    try { sessionStorage.setItem('soom:reloadFor', v); } catch (e) { /* storage blocked */ }
    location.reload();
  } catch (e) { /* offline */ }
}
boot();
</script>
