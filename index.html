<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOOM</title>
<meta name="description" content="애플워치·아이폰 건강 데이터로 만드는 개인 러닝 분석">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0e13" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SOOM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>/* Layout: one phone-width column (max 720px), sticky top bar + fixed bottom tab bar; cards only where an element is a separate object. */
:root {
  --bg: #f3f4f8;
  --surface: #ffffff;
  --surface-2: #eceef4;
  --ink: #12141b;
  --ink-2: #464b5a;
  --muted: #777c8d;
  --line: #e1e4ec;
  --accent: #3b39d1;
  --accent-ink: #ffffff;
  --accent-soft: #e9e9fb;
  --track: #c8553d;
  --lane: #ffffff;
  --z1: #a1a8b6; --z2: #3a8ad3; --z3: #1aa56d; --z4: #ee9d24; --z5: #e2484c;
  --good: #15803d; --good-soft: #e3f4e8;
  --warn: #b45309; --warn-soft: #fcf0dc;
  --bad: #c62828; --bad-soft: #fbe5e5;
  --g-red: #e2484c; --g-orange: #ee9d24; --g-green: #1aa56d; --g-blue: #3a8ad3; --g-purple: #7c4ddb;
  --sleep-deep: #3330a8; --sleep-core: #6f7ce8; --sleep-rem: #4fb7e8; --sleep-awake: #f1a33c;
  --s1: #3b39d1; --s2: #ee9d24; --s3: #1aa56d;
  --shadow: 0 1px 2px rgba(18, 20, 27, .05), 0 8px 24px rgba(18, 20, 27, .05);
  --font-ui: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
  --font-num: "Barlow Condensed", "SF Pro Display", "Arial Narrow", -apple-system, system-ui, sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0e13; --surface: #16181f; --surface-2: #1f222c; --ink: #eceef4; --ink-2: #b9bdcb; --muted: #8b90a2; --line: #282b37;
    --accent: #8f8dff; --accent-ink: #12122e; --accent-soft: #24244a; --track: #d9694f; --lane: #16181f;
    --z1: #737b8c; --z2: #4f9be0; --z3: #2dba80; --z4: #f2ad45; --z5: #ee5d62;
    --good: #4ade80; --good-soft: #13291b; --warn: #fbbf24; --warn-soft: #2e2410; --bad: #f87171; --bad-soft: #321718;
    --g-red: #ee5d62; --g-orange: #f2ad45; --g-green: #2dba80; --g-blue: #4f9be0; --g-purple: #a07cf0;
    --sleep-deep: #6b67e8; --sleep-core: #8d97f0; --sleep-rem: #63c3ef; --sleep-awake: #f2ad45;
    --s1: #9085e9; --s2: #d95926; --s3: #199e70;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0e13; --surface: #16181f; --surface-2: #1f222c; --ink: #eceef4; --ink-2: #b9bdcb; --muted: #8b90a2; --line: #282b37;
  --accent: #8f8dff; --accent-ink: #12122e; --accent-soft: #24244a; --track: #d9694f; --lane: #16181f;
  --z1: #737b8c; --z2: #4f9be0; --z3: #2dba80; --z4: #f2ad45; --z5: #ee5d62;
  --good: #4ade80; --good-soft: #13291b; --warn: #fbbf24; --warn-soft: #2e2410; --bad: #f87171; --bad-soft: #321718;
  --g-red: #ee5d62; --g-orange: #f2ad45; --g-green: #2dba80; --g-blue: #4f9be0; --g-purple: #a07cf0;
  --sleep-deep: #6b67e8; --sleep-core: #8d97f0; --sleep-rem: #63c3ef; --sleep-awake: #f2ad45;
  --s1: #9085e9; --s2: #d95926; --s3: #199e70;
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.num { font-family: var(--font-num); font-weight: 600; letter-spacing: .01em; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: 13px; }
.xs { font-size: 12px; }

#app { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand b { font-size: 17px; font-weight: 700; letter-spacing: .16em; }
.brand svg { flex: none; }
.top-actions { display: flex; gap: 6px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; height: 36px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.round { width: 36px; padding: 0; justify-content: center; }

/* bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { background: none; border: 0; padding: 8px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }

/* banners & toast */
.banner { display: flex; align-items: center; gap: 10px; justify-content: space-between; background: var(--accent-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
.banner b { color: var(--accent); }
.banner .btn { flex: none; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-size: 14px; z-index: 60; width: max-content; max-width: calc(100% - 32px); text-align: center; box-shadow: var(--shadow); }

/* page scaffolding */
.view { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.view > * { min-width: 0; }
.page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-top: 4px; }
.page-head h1 { font-size: 26px; letter-spacing: -.02em; }
.page-sub { color: var(--muted); font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card.accent { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-head h2 { font-size: 16px; letter-spacing: -.01em; display: flex; align-items: center; gap: 6px; }
.eyebrow { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.section-title { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .03em; margin: 6px 2px -4px; }
.info { border: 0; background: var(--surface-2); color: var(--muted); width: 22px; height: 22px; border-radius: 50%; font-size: 13px; font-weight: 700; line-height: 22px; padding: 0; flex: none; }
.link { background: none; border: 0; color: var(--accent); font-size: 14px; padding: 4px 0; font-weight: 600; }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 11px 16px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.secondary { background: var(--surface-2); color: var(--ink); }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.small { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 380px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.divider { height: 1px; background: var(--line); margin: 12px 0; }

/* stats */
.stat { min-width: 0; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .k .info { width: 18px; height: 18px; line-height: 18px; font-size: 11px; margin-left: 3px; vertical-align: 1px; }
.stat .v { font-family: var(--font-num); font-weight: 600; font-size: 28px; line-height: 1.1; letter-spacing: .005em; }
.stat .v small { font-family: var(--font-ui); font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
.stat .s { font-size: 12px; color: var(--ink-2); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); text-align: left; min-width: 0; }
button.tile { width: 100%; }
.hero-v { font-family: var(--font-num); font-weight: 700; font-size: 56px; line-height: 1; letter-spacing: -.005em; }

/* chips & pills */
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 9px 3px 8px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 700; }
.pill svg { width: 14px; height: 14px; }
.tone-good { background: var(--good-soft); color: var(--good); }
.tone-ok { background: var(--accent-soft); color: var(--accent); }
.tone-warn { background: var(--warn-soft); color: var(--warn); }
.tone-bad { background: var(--bad-soft); color: var(--bad); }
.tone-muted { background: var(--surface-2); color: var(--muted); }
.tone-info { background: var(--surface-2); color: var(--ink-2); }

/* readiness */
.ready { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 14px; align-items: center; }
@media (max-width: 400px) { .ready { grid-template-columns: 136px minmax(0, 1fr); gap: 12px; } }
.oval { position: relative; width: 100%; }
.oval svg { width: 100%; height: auto; display: block; }
.oval .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.oval .c .num { font-size: 44px; font-weight: 700; line-height: .95; }
.oval .c span { font-size: 12px; font-weight: 700; }
.factors { display: grid; gap: 6px; margin-top: 10px; }
.factor { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: 12px; }
.factor .bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.factor .bar b { display: block; height: 100%; border-radius: 999px; }
.factor .val { color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }

/* workout card */
.wk-title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.wk-purpose { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.adjust { margin-top: 10px; font-size: 13px; padding: 8px 10px; border-radius: 10px; }
.steps { margin-top: 12px; display: grid; gap: 0; border-top: 1px solid var(--line); }
.step { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.step .dot { width: 10px; height: 10px; border-radius: 3px; margin-top: 6px; }
.step .lbl { font-weight: 600; font-size: 14px; }
.step .sub { font-size: 12px; color: var(--muted); }
.step .amt { font-family: var(--font-num); font-size: 20px; font-weight: 600; text-align: right; line-height: 1.2; white-space: nowrap; }
.step .tgt { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.set-box { border-left: 2px solid var(--line); padding-left: 10px; margin-top: 4px; display: grid; gap: 2px; }
.totals { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
.totals b { font-family: var(--font-num); font-size: 18px; color: var(--ink); font-weight: 600; margin-right: 2px; }
details.fold { margin-top: 12px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
details.fold summary { font-weight: 600; font-size: 14px; cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; }
details.fold summary::-webkit-details-marker { display: none; }
details.fold summary::after { content: "펼치기"; font-size: 12px; color: var(--accent); font-weight: 600; flex: none; margin-left: 10px; }
details.fold[open] summary::after { content: "접기"; }
details.fold ol { margin: 8px 0 0; padding-left: 20px; font-size: 13px; color: var(--ink-2); display: grid; gap: 4px; }
details.fold ol.steps-guide { padding-left: 0; gap: 12px; }
details.fold + details.fold { margin-top: 8px; }
.setlist { display: grid; margin-top: 8px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.setlist div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 6px 10px; font-size: 13px; border-bottom: 1px solid var(--line); }
.setlist div:last-child { border-bottom: 0; }
.setlist span { color: var(--ink-2); min-width: 0; overflow-wrap: anywhere; }
.setlist b { color: var(--ink); font-weight: 700; text-align: right; flex: none; }

/* week strip */
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(84px, 1fr); gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; margin: 0 -2px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: left; scroll-snap-align: start; min-width: 0; display: grid; gap: 4px; }
.day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.day .dw { font-size: 12px; color: var(--muted); }
.day .dn { font-size: 13px; font-weight: 700; line-height: 1.3; min-height: 34px; }
.day .dk { font-family: var(--font-num); font-size: 18px; font-weight: 600; }
.day .bar { height: 4px; border-radius: 999px; }

/* lists */
.list { display: grid; }
.li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; }
.li:last-child { border-bottom: 0; }
.li .t { font-weight: 600; font-size: 14px; }
.li .m { font-size: 12px; color: var(--muted); }
.run-row { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.run-row .date { text-align: center; line-height: 1.1; }
.run-row .date b { display: block; font-family: var(--font-num); font-size: 22px; font-weight: 600; }
.run-row .date span { font-size: 11px; color: var(--muted); }
.run-row .main { min-width: 0; }
.run-row .main .l1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.run-row .main .l1 .num { font-size: 20px; }
.run-row .main .l2 { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.run-row .te { text-align: right; font-size: 11px; color: var(--muted); }
.run-row .te b { display: block; font-family: var(--font-num); font-size: 18px; color: var(--ink); font-weight: 600; }
.month-head { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 2px 4px; font-size: 13px; color: var(--muted); }
.month-head b { color: var(--ink); font-size: 15px; }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.filter { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; white-space: nowrap; }
.filter[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* tables */
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: right; font-weight: 600; color: var(--muted); font-size: 12px; padding: 6px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { text-align: right; padding: 7px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.l { text-align: left; white-space: normal; }
.tbl .best { color: var(--accent); font-weight: 700; }

/* bars, meters, gauges */
.hbar { display: grid; grid-template-columns: 84px minmax(0, 1fr) 86px; gap: 10px; align-items: center; font-size: 13px; padding: 4px 0; }
.hbar .track { height: 10px; border-radius: 999px; background: var(--surface-2); position: relative; overflow: hidden; }
.hbar .track b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; }
.hbar.has-tgt .track { height: 16px; border-radius: 6px; }
.hbar.has-tgt .track b { top: 4px; bottom: 4px; }
.hbar .track .tgt { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--good) 22%, transparent); border-left: 2px solid color-mix(in srgb, var(--good) 70%, transparent); border-right: 2px solid color-mix(in srgb, var(--good) 70%, transparent); }
.hbar .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.stack { display: flex; height: 14px; border-radius: 999px; overflow: hidden; gap: 2px; background: var(--surface); }
.stack b { display: block; height: 100%; min-width: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend i.line { height: 2px; border-radius: 1px; width: 14px; }
.meter { position: relative; height: 12px; border-radius: 999px; background: var(--surface-2); margin: 22px 0 6px; }
.meter .rng { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--good) 22%, transparent); border-radius: 999px; }
.meter .cur { position: absolute; top: -4px; width: 4px; height: 20px; border-radius: 2px; background: var(--ink); transform: translateX(-2px); }
.meter .cur span { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 700; white-space: nowrap; }
.gauge { margin: 6px 0 14px; }
.gauge .gl { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
.gauge .gl b { font-family: var(--font-num); font-size: 20px; font-weight: 600; }
.gauge .gt { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; height: 8px; margin-top: 6px; position: relative; }
.gauge .gt i { display: block; border-radius: 2px; opacity: .8; }

'use strict';

// ---------- calendar math (day numbers = days since 1970-01-01, local calendar) ----------
function daysFromCivil(y, m, d) {
  y -= m <= 2 ? 1 : 0;

}

    tgt[type] = {
      sum: num(tagAttr(t, ' sum="')), avg: num(tagAttr(t, ' average="')),
      min: num(tagAttr(t, ' minimum="')), max: num(tagAttr(t, ' maximum="')), unit: tagAttr(t, ' unit="') || '',

  }
  wevent(t) {
    const w = this.cur; if (!w) return;
    const ty = EVT[tagAttr(t, ' type="')]; if (!ty) return;
    const k = t.indexOf(' date="'); if (k < 0) return;
    const at = parseAppleDate(t, k + 7);
    const dur = toSeconds(num(tagAttr(t, ' duration="')), tagAttr(t, ' durationUnit="') || 'min');

  }
  wmeta(t) {

  }
  meTag(t) {

  }
  endWorkout() {

      hr: this.hr.view(), steps: this.steps, dist: this.dist, dyn: this.dyn,
      rhr: this.rhr, hrv: this.hrv, vo2: this.vo2, resp: this.resp, temp: this.temp, hrr1: this.hrr1,

}

function parseGPX(text) {
  const t = [], lat = [], lon = [], ele = [], spd = [], hacc = [];
  let i = 0;
  for (;;) {
    const a = text.indexOf('<trkpt', i); if (a < 0) break;
    let b = text.indexOf('</trkpt>', a); if (b < 0) b = text.length;
    const seg = text.substring(a, b); i = b + 8;
    const la = num(tagAttr(seg, ' lat="')), lo = num(tagAttr(seg, ' lon="'));
    const k = seg.indexOf('<time>'); if (k < 0 || !isNum(la) || !isNum(lo)) continue;
    const tt = parseISODate(seg.substring(k + 6, seg.indexOf('<', k + 6)));
    if (!isNum(tt)) continue;
    const ke = seg.indexOf('<ele>'), ks = seg.indexOf('<speed>'), kh = seg.indexOf('<hAcc>');
    t.push(tt); lat.push(la); lon.push(lo);
    ele.push(ke >= 0 ? num(seg.substring(ke + 5, seg.indexOf('<', ke + 5))) : NaN);
    spd.push(ks >= 0 ? num(seg.substring(ks + 7, seg.indexOf('<', ks + 7))) : NaN);
    hacc.push(kh >= 0 ? num(seg.substring(kh + 6, seg.indexOf('<', kh + 6))) : NaN);
  }
  if (t.length > 1) { // ensure time order
    let sorted = true; for (let j = 1; j < t.length; j++) if (t[j] < t[j - 1]) { sorted = false; break; }
    if (!sorted) {
      const idx = t.map((_, j) => j).sort((x, y) => t[x] - t[y]);
      const re = arr => idx.map(j => arr[j]);
      return { t: re(t), lat: re(lat), lon: re(lon), ele: re(ele), spd: re(spd), hacc: re(hacc) };
    }
  }
  return { t, lat, lon, ele, spd, hacc };
}

async function streamIntoParser(textStream, total, parser, onProgress) {
  const reader = textStream.getReader();
  let done = 0, last = Date.now();
  for (;;) {
    const r = await reader.read();
    if (r.done) break;
    parser.feed(r.value);
    done += r.value.length;
    if (Date.now() - last > 150) { onProgress(Math.min(0.995, done / Math.max(1, total))); await yieldUI(); last = Date.now(); }
  }
  parser.end();
}

// Read an export (zip or xml) entirely on this device. Returns the assembled data object.
async function importHealthFile(file, onProgress, prev) {
  onProgress = onProgress || (() => {});
  const head = new Uint8Array(await file.slice(0, 8).arrayBuffer());
  const isZip = head[0] === 0x50 && head[1] === 0x4b;
  const parser = new HealthParser();
  let routeReader = null;
  if (isZip) {
    onProgress({ stage: 'open', p: 0 });
    const entries = await readZipDirectory(file);
    const xmls = entries.filter(e => /\.xml$/i.test(e.name) && !/cda/i.test(e.name) && !/__MACOSX/.test(e.name)).sort((a, b) => b.uncomp - a.uncomp);
    if (!xmls.length) throw new UserError('ZIP 안에서 건강 기록(export.xml)을 찾지 못했어요. 건강 앱의 \'모든 건강 데이터 내보내기\'로 만든 파일인지 확인해 주세요.');
    const xe = xmls[0];
    await streamIntoParser(await zipEntryStream(file, xe), xe.uncomp, parser, p => onProgress({ stage: 'xml', p }));
    const gpx = new Map();
    for (const e of entries) if (/\.gpx$/i.test(e.name)) gpx.set(e.name.split('/').pop(), e);
    routeReader = async path => {
      const e = gpx.get(String(path).split('/').pop()); if (!e) return null;
      return parseGPX(await readAllText(await zipEntryStream(file, e)));
    };
  } else {
    const txt = new TextDecoder().decode(head);
    if (!/^\s*</.test(txt) && !/^﻿?</.test(txt)) throw new UserError('건강 앱에서 내보낸 ZIP 파일(또는 그 안의 export.xml)을 선택해 주세요.');
    await streamIntoParser(file.stream().pipeThrough(new TextDecoderStream()), file.size, parser, p => onProgress({ stage: 'xml', p }));
  }
  const raw = parser.finish();
  if (!raw.workouts.length && raw.hr.length === 0) throw new UserError('파일에서 운동이나 심박 기록을 찾지 못했어요. 건강 앱에서 내보낸 파일이 맞는지 확인해 주세요.');
  return assemble(raw, routeReader, onProgress, prev);
}

function spreadInc(inc, a, b, d) { // spread distance d over continuous seconds [a,b)
  const N = inc.length;
  if (b <= a) { const i = Math.floor(a); if (i >= 0 && i < N) inc[i] += d; return; }
  const per = d / (b - a);
  const i0 = Math.max(0, Math.floor(a)), i1 = Math.min(N - 1, Math.ceil(b) - 1);
  for (let s = i0; s <= i1; s++) { const ov = Math.min(b, s + 1) - Math.max(a, s); if (ov > 0) inc[s] += per * ov; }
}

function hrPerSecond(packed, T0, N) {
  const H = new Float32Array(N);
  const ht = [], hv = [];
  for (let i = 0; i < packed.length; i++) {
    const v = packed[i], t = Math.floor(v / 256), b = v - t * 256;
    if (b < 30 || b > 240) continue;
    if (ht.length && ht[ht.length - 1] === t) { hv[hv.length - 1] = (hv[hv.length - 1] + b) / 2; continue; }
    ht.push(t); hv.push(b);
  }
  if (!ht.length) return H;
  let j = 0;
  for (let s = 0; s < N; s++) {
    const tt = T0 + s;
    while (j + 1 < ht.length && ht[j + 1] <= tt) j++;
    if (ht[j] <= tt) {
      if (j + 1 < ht.length) {
        const g = ht[j + 1] - ht[j];
        if (g <= 45) H[s] = hv[j] + (hv[j + 1] - hv[j]) * (tt - ht[j]) / g;
        else if (tt - ht[j] <= 10) H[s] = hv[j];
        else if (ht[j + 1] - tt <= 10) H[s] = hv[j + 1];
      } else if (tt - ht[j] <= 10) H[s] = hv[j];
    } else if (ht[j] - tt <= 10) H[s] = hv[j];
  }
  return H;
}

function fillFromSamples(arr, idxs, buf, T0, lo, hi, holdMax) {
  const S = buf.s.a, D = buf.d.a, V = buf.v.a, N = arr.length;
  for (let k = 0; k < idxs.length; k++) {
    const i = idxs[k], v = V[i];
    if (!(v >= lo && v <= hi)) continue;
    const a = S[i] - T0;
    let b;
    if (D[i] >= 1) b = a + D[i];
    else { const nx = k + 1 < idxs.length ? S[idxs[k + 1]] - T0 : a + holdMax; b = Math.min(nx, a + holdMax); if (b <= a) b = a + 1; }
    const i0 = Math.max(0, Math.floor(a)), i1 = Math.min(N - 1, Math.ceil(b) - 1);

function blockMean(arr, j0, j1, nonzero) {
  let s = 0, n = 0;
  for (let j = j0; j < j1; j++) { const x = arr[j]; if (nonzero ? x > 0 : isNum(x)) { s += x; n++; } }

function statOf(w, key) { return w.stats['HKQuantityTypeIdentifier' + key]; }

function buildRun(w, hrPacked, stepIdx, distIdx, dynIdx, raw, route, coarse) {

  if (route && route.t.length >= 20 && !indoor) {

    for (let k = 0; k < route.t.length; k++) {

      if (tk < T0 - 10 || tk > T0 + N + 10) continue;
      if (isNum(route.hacc[k]) && route.hacc[k] > 50) continue;
      if (last >= 0) {
        const dt = tk - route.t[last]; if (dt <= 0) continue;
        const d = haversine(route.lat[last], route.lon[last], route.lat[k], route.lon[k]);
        if (d / dt > 12) continue;
        spreadInc(inc, route.t[last] - T0, tk - T0, d);
      }
      pts.push(k); last = k;
    }
    if (pts.length >= 20) {

      const et = [], ev = [];
      for (const k of pts) if (isNum(route.ele[k])) { et.push(route.t[k] - T0); ev.push(route.ele[k]); }
      if (et.length >= 10) {

      if (s < N) { let a = 0, c = 0; for (let k = Math.max(0, s - 2); k <= Math.min(N - 1, s + 2); k++) { a += inc[k]; c++; } slow = a / c < 0.35; }

    let ref = Em ? Em[0] : 0;
    const push = (t, d) => {

        pw: pn ? Math.round(ps / pn) : 0, gap: gd > 0 ? round(t / gd * 1000, 1) : 0, up: Math.round(gain), dn: Math.round(loss) });
      hs = hn = cs = cn = ps = pn = gd = gain = loss = 0;
    };
    for (let j = 0; j < M; j++) {

      if (Cm[j] > 0) { cs += Cm[j]; cn++; }

      if (dd >= D) { const t = (j - i) * D / dd; if (t < best) { best = t; bi = i; } }
    }
    if (best < Infinity && D / best < 9.5) bests[D] = [round(best, 1), Math.round(Dm[bi])];
  }

  let maxHRr = 0;
  { let acc = 0, n = 0; const q = []; for (let s = 0; s < N; s++) { const x = H[s]; q.push(x); if (x > 0) { acc += x; n++; } if (q.length > 10) { const y = q.shift(); if (y > 0) { acc -= y; n--; } } if (n >= 8) maxHRr = Math.max(maxHRr, acc / n); } }
  let hr20 = 0;
  if (M >= 1200) { let acc = 0, n = 0; for (let j = 0; j < M; j++) { if (Hm[j] > 0) { acc += Hm[j]; n++; } if (j >= 1200) { const y = Hm[j - 1200]; if (y > 0) { acc -= y; n--; } } if (j >= 1199 && n >= 1080) hr20 = Math.max(hr20, acc / n); } }

const RUN_V = 3; // bump when the per-run building changes, so cached runs are rebuilt

      start: isNum(n.start) ? Math.round(n.start) : null, end: isNum(n.end) ? Math.round(n.end) : null, off: n.off || 0, staged: !!n.staged };

    exportUtc: isNum(raw.exportUtc) ? raw.exportUtc : null, exportOff: raw.exportOff || 0,
    me: { dob: raw.me.dob || '', sex: raw.me.sex || '', height: lastH ? round(lastH, 2) : null, mass: lastMass ? round(lastMass, 1) : null },
    runs, others, days,

    let spread = 0; const ts = [];
    for (const d of data) { const t = parseDateLoose(d.date); if (isNum(t)) ts.push(t); if (isNum(d.Min) && isNum(d.Max) && d.Max - d.Min > 0.5) spread++; }
    ts.sort((a, b) => a - b);
    if (data.length > 5 && (spread / data.length > 0.3 || medianGap(ts) >= 1800)) return;
  }
  for (const d of data) {
    const t = parseDateLoose(d.date); if (!isNum(t)) continue;
    const off = PD_off, day = PD_day, sod = PD_sod;
    const v = isNum(d.qty) ? d.qty : isNum(d.Avg) ? d.Avg : NaN; if (!isNum(v)) continue;
    switch (kind) {
      case 'hr': if (v >= 30 && v <= 240) P.hr.push(Math.round(t) * 256 + Math.round(v)); break;
      case 'rhr': P.rhr.push([day, v]); break;
      case 'hrv': if (v > 0) P.hrv.push([t, day, sod, v]); break;
      case 'vo2': P.vo2.push([t, day, v]); break;
      case 'resp': P.resp.push([t, day, sod, v]); break;
      case 'temp': P.temp.push([dayOfUtc(t + 8 * 3600, off), toCelsius(v, unit)]); break;
      case 'mass': P.mass.push([t, toKg(v, unit)]); break;
      case 'hrr1': P.hrr1.push([t, v]); break;
      case 'power': P.dyn.power.push(t, 0, v); break;
      case 'speed': P.dyn.speed.push(t, 0, toMps(v, haeSpeedUnit(unit))); break;
      case 'stride': P.dyn.stride.push(t, 0, toMeters(v, unit || 'm')); break;
      case 'vosc': P.dyn.vosc.push(t, 0, toMeters(v, unit || 'cm') * 100); break;
      case 'gct': P.dyn.gct.push(t, 0, unit === 's' ? v * 1000 : v); break;
    }
  }
}

function haeSleep(P, data) {
  for (const d of data) {
    if (d.startDate && d.endDate && d.value !== undefined) {
      const s = parseDateLoose(d.startDate), off = PD_off, e = parseDateLoose(d.endDate);
      const st = HAE_SLEEP[haeNorm(d.value)];
      if (st === undefined || !isNum(s) || !isNum(e) || e <= s) continue;
      const src = String(d.source || 'Health Auto Export');
      const key = s + '|' + e + '|' + st + '|' + src;
      if (P.sleepKeys) { if (P.sleepKeys.has(key)) continue; P.sleepKeys.add(key); }
      P.sleep.push([s, e, st, P.srcByName(src, /watch/i.test(src)), off]);
    } else if (isNum(d.totalSleep) || isNum(d.asleep) || isNum(d.core) || isNum(d.deep)) {
      const s = parseDateLoose(d.sleepStart || d.inBedStart || d.date), off = PD_off;
      const e = parseDateLoose(d.sleepEnd || d.inBedEnd || '');
      const h = x => isNum(x) ? x * 3600 : 0;
      const deep = h(d.deep), rem = h(d.rem), core = h(d.core);
      const asleep = h(d.totalSleep) || (deep + rem + core + h(d.asleep));
      const day = isNum(s) && d.sleepStart ? dayOfUtc(s + 6 * 3600, off) : isoToDay(String(d.date || '').slice(0, 10));
      if (!isNum(day)) continue;
      (P.sleepAgg || (P.sleepAgg = [])).push({ day, asleep, deep, rem, core, awake: h(d.awake), inbed: h(d.inBed), start: s, end: e, off, staged: deep + rem + core > 0 });
    }
  }
}

function haeWorkout(P, w, routes) {
  const name = String(w.name || w.workoutActivityType || '');
  const start = parseDateLoose(w.start); const off = PD_off, day = PD_day;
  const end = parseDateLoose(w.end);
  if (!isNum(start) || !isNum(end) || end <= start) return;
  const obj = o => o && typeof o === 'object' && !Array.isArray(o) ? o : null;
  const meta = {}, stats = {};
  const indoor = w.isIndoor === true || /indoor/i.test(String(w.location || '')) || /indoor|treadmill/i.test(name);
  meta.HKIndoorWorkout = indoor ? '1' : '0';
  const tmp = obj(w.temperature); if (tmp && isNum(tmp.qty)) meta.HKWeatherTemperature = tmp.qty + ' ' + (/F/.test(tmp.units || '') ? 'degF' : 'degC');
  const hum = obj(w.humidity); if (hum && isNum(hum.qty)) meta.HKWeatherHumidity = (hum.qty > 0 && hum.qty <= 1 ? hum.qty * 100 : hum.qty) + ' %';
  const up = obj(w.elevationUp); if (up && isNum(up.qty)) meta.HKElevationAscended = up.qty + ' ' + (up.units || 'm');
  const dist = obj(w.distance); if (dist && isNum(dist.qty)) stats.HKQuantityTypeIdentifierDistanceWalkingRunning = { sum: dist.qty, unit: dist.units || 'km' };
  const hs = obj(w.heartRate) || {}, q = o => (o = obj(o)) && isNum(o.qty) && o.qty >= 30 && o.qty <= 250 ? o.qty : NaN;
  const hAvg = q(hs.avg) || q(w.avgHeartRate), hMax = q(hs.max) || q(w.maxHeartRate), hMin = q(hs.min);
  if (isNum(hAvg) || isNum(hMax)) stats.HKQuantityTypeIdentifierHeartRate = { avg: hAvg, max: hMax, min: hMin, unit: 'count/min' };
  const en = obj(w.activeEnergyBurned) || obj(w.activeEnergy);
  if (en && isNum(en.qty)) stats.HKQuantityTypeIdentifierActiveEnergyBurned = { sum: en.qty, unit: en.units || 'kcal' };
  // heart rate in the session; a known app bug sometimes puts the post-workout recovery series here instead
  const hrd = Array.isArray(w.heartRateData) ? w.heartRateData : [];
  const hrT = hrd.map(d => parseDateLoose(d.date));
  const inside = hrT.filter(t => isNum(t) && t < end - 5).length;
  if (hrd.length && inside >= Math.min(3, hrd.length) && inside >= hrd.length * 0.5) {
    hrd.forEach((d, i) => { const v = isNum(d.Avg) ? d.Avg : d.qty; if (isNum(hrT[i]) && v >= 30 && v <= 240 && hrT[i] <= end + 5) P.hr.push(Math.round(hrT[i]) * 256 + Math.round(v)); });
  }
  const isRun = haeType(name) === 'Running';
  if (isRun) {
    haeChunks(w.stepCount, (t, du, v) => { if (du <= 600) P.steps.push(t, du, v); });
    haeChunks(w.walkingAndRunningDistance, (t, du, v, u) => { if (du <= 600) P.dist.push(t, du, toMeters(v, u || 'km')); });
  }
  let routeId = null;
  if (isRun && Array.isArray(w.route) && w.route.length >= 2) {
    const rt = { t: [], lat: [], lon: [], ele: [], spd: [], hacc: [] };
    for (const p of w.route) {
      const t = parseDateLoose(p.timestamp || p.date);
      const la = isNum(p.latitude) ? p.latitude : p.lat, lo = isNum(p.longitude) ? p.longitude : p.lon;
      if (!isNum(t) || !isNum(la) || !isNum(lo)) continue;
      rt.t.push(t); rt.lat.push(la); rt.lon.push(lo);
      rt.ele.push(isNum(p.altitude) ? p.altitude : NaN); rt.spd.push(isNum(p.speed) ? p.speed : NaN); rt.hacc.push(isNum(p.horizontalAccuracy) ? p.horizontalAccuracy : NaN);
    }
    if (rt.t.length >= 2) {
      let sorted = true; for (let i = 1; i < rt.t.length; i++) if (rt.t[i] < rt.t[i - 1]) { sorted = false; break; }
      if (!sorted) { const idx = rt.t.map((_, i) => i).sort((a, b) => rt.t[a] - rt.t[b]); for (const k in rt) rt[k] = idx.map(i => rt[k][i]); }
      routeId = 'hae-' + Math.round(start); routes[routeId] = rt;
    }
  }
  const cad = obj(w.stepCadence);
  const rec = Array.isArray(w.heartRateRecovery) ? w.heartRateRecovery : [];
  P.workouts.push({
    type: haeType(name), name, start, end, off, day, dur: isNum(w.duration) && w.duration > 0 ? w.duration : end - start,
    src: String(w.source || 'Health Auto Export'), legacyDist: NaN, legacyEnergy: NaN, meta, stats, events: [], routes: routeId ? [routeId] : [],
    cadAvg: cad && isNum(cad.qty) ? cad.qty : null,
    hrRec: rec.map(d => [parseDateLoose(d.date), isNum(d.Avg) ? d.Avg : d.qty]).filter(x => isNum(x[0]) && isNum(x[1])),
  });
}

function haeToRaw(objs) {
  const P = new HealthParser(), routes = {};
  P.sleepKeys = new Set();
  const best = new Map();
  const size = w => (Array.isArray(w.route) ? w.route.length : 0) + (Array.isArray(w.heartRateData) ? w.heartRateData.length : 0) + (Array.isArray(w.stepCount) ? w.stepCount.length : 0) + (Array.isArray(w.walkingAndRunningDistance) ? w.walkingAndRunningDistance.length : 0);
  for (const o of objs) {
    const data = o && o.data ? o.data : o;
    if (!data || typeof data !== 'object') continue;
    for (const m of Array.isArray(data.metrics) ? data.metrics : []) haeMetric(P, m);
    for (const w of Array.isArray(data.workouts) ? data.workouts : []) {
      const k = String(w.start) + '|' + haeType(String(w.name || ''));
      const ex = best.get(k); if (!ex || size(w) > size(ex)) best.set(k, w);
    }
  }
  for (const w of best.values()) haeWorkout(P, w, routes);
  // one-minute heart-rate recovery from the recovery series when the watch's own value is missing
  for (const w of P.workouts) {
    if (!w.hrRec || w.hrRec.length < 2) continue;
    if (P.hrr1.some(x => x[0] >= w.end - 120 && x[0] <= w.end + 1200)) continue;
    const s = w.hrRec.slice().sort((a, b) => a[0] - b[0]);
    const h0 = s[0][1]; let h60 = NaN;
    for (let i = 1; i < s.length; i++) if (s[i][0] - s[0][0] >= 55) { h60 = s[i][1]; break; }
    if (isNum(h60) && h0 - h60 > 3) P.hrr1.push([w.end + 60, Math.round(h0 - h60)]);
  }
  const raw = P.finish();
  raw.exportUtc = Math.max(0, ...raw.workouts.map(w => w.end)) || null;
  return { raw, routes };
}

// how complete a run's data is, so a thinner copy never replaces a richer one
function runQuality(r) { return (r.gps ? 2 : 0) + (r.hrCov || 0) * 2 + (r.cad ? 0.4 : 0) + (r.pw ? 0.3 : 0) + (r.sl ? 0.3 : 0) + (r.splits && r.splits.length ? 0.2 : 0); }
// the same workout can arrive from two sources with start times a second apart: match by time, not only by id
function mergeList(baseList, incList, better) {
  const out = new Map(), byMin = new Map();
  const add = r => { out.set(r.id, r); const k = Math.round(r.start / 60); if (!byMin.has(k)) byMin.set(k, []); byMin.get(k).push(r.id); };
  for (const r of baseList || []) add(r);
  let added = 0, updated = 0;
  for (const r of incList || []) {
    let ex = out.get(r.id);
    if (!ex) {
      const k = Math.round(r.start / 60);
      for (let j = k - 2; j <= k + 2 && !ex; j++) for (const id of byMin.get(j) || []) {
        const c = out.get(id); if (c && Math.abs(c.start - r.start) <= 90 && (c.type || '') === (r.type || '')) { ex = c; break; }
      }
    }
    if (!ex) { add(r); added++; }
    else if (better(r, ex)) { out.delete(ex.id); add(r); updated++; }
  }
  return { list: [...out.values()].sort((a, b) => a.start - b.start), added, updated };
}
function mergeData(base, inc) {
  if (!base || base.source === 'demo' || !Array.isArray(base.runs)) return { data: inc, added: inc.runs.length, updated: 0, recChanged: Object.keys((inc.days || {}).sleep || {}).length + Object.keys((inc.days || {}).hrv || {}).length };
  const R = mergeList(base.runs, inc.runs, (r, ex) => runQuality(r) >= runQuality(ex) - 0.25);
  const O = mergeList(base.others, inc.others, () => true);
  const added = R.added, updated = R.updated;
  const days = {}; let recChanged = 0;
  for (const k of ['rhr', 'hrv', 'vo2', 'resp', 'temp', 'sleep', 'mass']) {
    const a = (base.days || {})[k] || {}, b = (inc.days || {})[k] || {}, o = Object.assign({}, a);
    for (const d in b) {
      // a file that starts in the middle of a night (or of a day) holds only part of it: keep the fuller copy
      if (k === 'sleep' && a[d] && a[d].asleep > b[d].asleep + 600) continue;
      if (k === 'hrv' && a[d] && a[d][1] > b[d][1]) continue;
      if (JSON.stringify(a[d]) !== JSON.stringify(b[d])) recChanged++;
      o[d] = b[d];
    }
    days[k] = o;
  }
  const me = Object.assign({}, base.me || {}); for (const k in inc.me || {}) if (inc.me[k]) me[k] = inc.me[k];
  return {
    data: Object.assign({}, base, {
      runs: R.list, others: O.list, days, me,
      importedAt: inc.importedAt, exportUtc: Math.max(base.exportUtc || 0, inc.exportUtc || 0) || null,
      source: base.source === 'apple' || inc.source === 'apple' ? 'apple' : inc.source, haeAt: inc.source === 'hae' ? inc.importedAt : base.haeAt,
      counts: Object.assign({}, inc.counts, { runs: R.list.length, workouts: R.list.length + O.list.length }),
    }), added, updated, recChanged,
  };
}

// one entry point for everything the person can pick: the Health app export (.zip/.xml) and/or Health Auto Export files (.json, or a .zip of them)
async function importFiles(files, onProgress, prev) {
  onProgress = onProgress || (() => {});
  files = Array.from(files || []);
  const full = [], hae = [];
  for (const f of files) {
    const head = new Uint8Array(await f.slice(0, 4).arrayBuffer());
    const nm = String(f.name || '').toLowerCase();
    if (head[0] === 0x50 && head[1] === 0x4b) {
      const entries = await readZipDirectory(f);
      if (entries.some(e => /\.xml$/i.test(e.name) && !/cda/i.test(e.name))) full.push(f);
      else if (entries.some(e => /\.json$/i.test(e.name))) hae.push({ file: f, entries: entries.filter(e => /\.json$/i.test(e.name) && !/__MACOSX/.test(e.name)) });
      else throw new UserError('\'' + f.name + '\' 안에서 건강 기록을 찾지 못했어요.');
    } else if (/\.csv$/.test(nm)) throw new UserError('CSV 파일이에요. Health Auto Export 자동화의 형식(Format)을 JSON으로 바꿔 주세요.');
    else if (/\.json$/.test(nm) || head[0] === 0x7b || head[0] === 0x5b || (head[0] === 0xef && head[3] === 0x7b)) hae.push({ file: f });
    else if (/\.xml$/.test(nm) || head[0] === 0x3c) full.push(f);
    else throw new UserError('\'' + f.name + '\'은(는) 읽을 수 없는 파일이에요. 건강 앱 내보내기 파일(.zip) 또는 Health Auto Export의 JSON 파일을 골라 주세요.');
  }
  const info = { full: full.length, hae: hae.length, runs: 0, recDays: 0, recChanged: 0 };
  let data = prev && prev.source !== 'demo' ? prev : null;
  for (const f of full) {
    const d = await importHealthFile(f, onProgress, data);
    if (data) { const m = mergeData(data, d); data = m.data; info.recChanged += m.recChanged; } else data = d;
  }
  if (hae.length) {
    onProgress({ stage: 'hae', p: 0 });
    const objs = []; let k = 0;
    for (const h of hae) {
      const big = h.entries ? h.entries.reduce((a, e) => a + e.uncomp, 0) : h.file.size;
      if (big > 250e6) throw new UserError('\'' + h.file.name + '\' 파일이 너무 커요 (' + Math.round(big / 1e6) + 'MB). Health Auto Export 자동화의 Date Range를 Week로 두고, 가장 최근 파일만 골라 주세요.');
      const texts = [];
      if (h.entries) for (const e of h.entries) texts.push(await readAllText(await zipEntryStream(h.file, e)));
      else texts.push(await h.file.text());
      for (const t of texts) {
        let o;
        try { o = JSON.parse(t.charCodeAt(0) === 0xfeff ? t.slice(1) : t); }
        catch (e) { throw new UserError('\'' + h.file.name + '\' 파일을 읽지 못했어요. Health Auto Export에서 JSON 형식으로 내보낸 파일인지 확인해 주세요.'); }
        if (o && o.app === 'running-lab') throw new UserError('\'' + h.file.name + '\'은(는) SOOM 백업 파일이에요. 데이터 화면의 \'백업 파일 불러오기\'로 열어 주세요.');
        objs.push(o);
      }
      onProgress({ stage: 'hae', p: ++k / hae.length * 0.5 });
      await yieldUI();
    }
    const { raw, routes } = haeToRaw(objs);
    if (!raw.workouts.length && !raw.hr.length && !raw.rhr.length && !raw.sleep.length && !raw.sleepAgg.length && !raw.hrv.length)
      throw new UserError('Health Auto Export 파일에 운동이나 건강 기록이 없어요. 자동화에서 Workouts와 Health Metrics를 골랐는지 확인해 주세요.');
    const inc = await assemble(raw, async id => routes[id] || null, p => onProgress({ stage: p.stage === 'routes' ? 'hae' : p.stage, p: p.stage === 'routes' ? 0.5 + p.p / 2 : p.p }), null);
    inc.source = 'hae';
    info.runs = inc.runs.length;
    info.recDays = new Set([...Object.keys(inc.days.sleep), ...Object.keys(inc.days.hrv), ...Object.keys(inc.days.rhr)]).size;
    for (const r of inc.runs) r.imp = 'hae'; // built from the app's files: rebuilt (not reused) when a full Health export arrives
    if (data) { const m = mergeData(data, inc); data = m.data; info.recChanged += m.recChanged; } else { data = inc; info.recChanged += info.recDays; }
  }
  if (!data) throw new UserError('가져올 파일이 없어요.');
  data.lastImport = info;
  return data;
}

// ---------- profile & zones ----------
function makeZones(method, rest, max, lthr) {
  let lows;
  if (method === 'max') lows = [0.5, 0.6, 0.7, 0.8, 0.9].map(p => p * max);
  else if (method === 'lthr') lows = [0.75, 0.85, 0.9, 0.95, 1.0].map(p => p * lthr);
  else lows = [0.5, 0.6, 0.7, 0.8, 0.9].map(p => rest + p * (max - rest));
  return lows.map(Math.round);
}
function zoneIdx(h, z) { return h >= z[4] ? 4 : h >= z[3] ? 3 : h >= z[2] ? 2 : h >= z[1] ? 1 : 0; }

function buildProfile(data, S, today) {
  const me = data.me || {};
  const sex = S.sex || me.sex || 'male';
  let age = null, birthYear = S.birthYear || null;
  if (!birthYear && me.dob) { const by = parseInt(me.dob.slice(0, 4), 10); if (by > 1900) birthYear = by; }
  if (birthYear) age = civilFromDays(today)[0] - birthYear;
  const ageKnown = age !== null && age > 5 && age < 100; if (!ageKnown) age = 35;
  const weight = S.weight || me.mass || null;
  const rd = Object.keys(data.days.rhr).map(Number).sort((a, b) => a - b);
  const recentR = rd.filter(d => d > today - 30 && d <= today);
  let restAuto = median((recentR.length >= 5 ? recentR : rd.slice(-30)).map(d => data.days.rhr[d]));

function labelRun(r, runs, fastSh, P) {

  if (r.teN >= 3.0 && r.teN >= r.teA) return 'anaerobic';
  if (r.teN >= 1.8) return 'vo2';
  if (tot > mv * 0.4) {
    const f = x => x / tot;
    if (f(b[3]) >= 0.15) return 'vo2';
    if (f(b[2]) + f(b[3]) >= 0.25) return 'threshold';
    if (f(b[1]) + f(b[2]) + f(b[3]) >= 0.30) return 'tempo';
  } else if (r.lvl && r.dist > 0) {
    const tS = speedForVO2(0.88 * r.lvl) / 60, v = r.dist / mv;
    if (v >= tS * 0.98) return 'threshold';
    if (v >= tS * 0.92) return 'tempo';
  }
  const prev = runs.filter(x => x.day < r.day && x.day >= r.day - 56).map(x => x.moving);
  const med = prev.length >= 3 ? median(prev) : 2400;
  if (mv >= Math.max(4500, med * 1.4) || r.dist >= 16000) return 'long';

  if (mv <= 2700 && (r.teA < 1.8 || veryEasy)) return 'recovery';

}

  switch (kind) {

    case 'recovery': addTime('run', '아주 천천히 조깅', clamp(Math.round(km * easyMid * 1.08 / 300) * 300, 1200, 1800), recP, z1, '대화가 편한 속도'); break;
    case 'easy': addTime('run', '편안하게 달리기', clamp(Math.round(km * easyMid / 300) * 300, 1500, 4800), easyP, z2, '코로만 숨 쉬어도 될 정도'); break;

      break;
    }
    case 'long': addDist('run', '일정한 이지 페이스', Math.round(km * 2) / 2 * 1000, easyP, z2, '오르막에선 페이스보다 심박 유지'); break;
    case 'long_m': {

      addDist('work', '마라톤 페이스로 마무리', mk * 1000, pc ? pc.mar : null, z3);
      break;

    case 'progression': {

}

function buildPlan(M) {
  const S = M.S, today = M.today, P = M.P;
  const rpw = clamp(parseInt(S.runsPerWeek, 10) || 4, 2, 7);
  const lrd = clamp(parseInt(S.longRunDay, 10) || 0, 0, 6);
  const PAT = {
    2: { 0: 'L', 4: 'Q' }, 3: { 0: 'L', 5: 'Q', 3: 'E' }, 4: { 0: 'L', 5: 'Q', 3: 'E', 1: 'E' },
    5: { 0: 'L', 5: 'Q', 4: 'E', 3: 'Q2', 1: 'E' }, 6: { 0: 'L', 6: 'E', 5: 'Q', 4: 'E', 3: 'Q2', 1: 'E' },
    7: { 0: 'L', 6: 'R', 5: 'Q', 4: 'E', 3: 'Q2', 2: 'E', 1: 'E' },
  };
  const pat = PAT[rpw];
  const goalDist = +S.goalDist || 0;
  const gd = goalDist > 0 && S.goalDate ? isoToDay(S.goalDate) : NaN;
  let phase, raceDay = null, weeksToRace = null;
  if (isNum(gd) && gd >= today) {
    raceDay = gd; weeksToRace = (gd - today) / 7;
    const full = goalDist >= 42195;
    phase = gd - today <= 6 ? 'race' : weeksToRace <= 2 ? 'taper' : weeksToRace <= (full ? 6 : 5) ? 'peak' : weeksToRace <= (full ? 16 : 12) ? 'build' : 'base';
  } else phase = M.ctl < 25 || M.runs.length < 8 ? 'base' : 'build';
  const weekIdx = Math.floor((today - 4) / 7);
  let recoveryWeek = false;
  if ((phase === 'base' || phase === 'build') && M.runs.length >= 12) recoveryWeek = raceDay ? (Math.floor((raceDay - today) / 7) % 4 === 0) : weekIdx % 4 === 3;
  if (M.status.key === 'overreaching' || (M.acwr !== null && M.acwr > 1.4)) recoveryWeek = true;
  const PHASE = { base: '기초기', build: '강화기', peak: '피크기', taper: '테이퍼', race: '레이스 주간' };
  const PHASE_DESC = {
    base: '편한 달리기로 유산소 기초와 몸의 내구성을 쌓는 시기예요. 강도는 낮게, 꾸준함이 핵심이에요.',
    build: '역치·인터벌 같은 핵심 훈련으로 체력을 끌어올리는 시기예요.',
    peak: '목표 레이스에 맞춘 속도 훈련 비중을 높이는 시기예요.',
    taper: '훈련량을 줄여 피로를 빼고, 짧은 속도 훈련으로 감각만 유지해요.',
    race: '레이스 주간이에요. 충분히 쉬고 가벼운 자극만 줘요.',
  };

  const done = M.weeks.slice(-5, -1).map(w => w.km);
  const avg = mean(done.filter(x => x > 0)) || 0;
  const lastWk = done[done.length - 1] || 0;
  let factor = { base: 1.05, build: 1.08, peak: 1.0, taper: 0.7, race: 0.5 }[phase];
  if (recoveryWeek) factor = Math.min(factor, 0.78);
  let weekKm = (avg > 0 ? avg : 15) * factor;
  weekKm = Math.min(weekKm, Math.max(lastWk, avg) * 1.1 + 2);
  weekKm = Math.max(weekKm, rpw * 4);
  const longShare = rpw <= 3 ? 0.35 : rpw === 4 ? 0.3 : rpw === 5 ? 0.27 : 0.25;
  const recentLong = Math.max(0, ...M.runs.filter(r => r.day > M.ref - 42 && r.day <= M.ref).map(r => r.dist / 1000));
  let longKm = weekKm * longShare;
  if (recentLong > 0) longKm = clamp(longKm, recentLong * 0.85, recentLong * 1.12 + 1);
  const capLong = goalDist >= 42195 ? 32 : goalDist >= 21097.5 ? 22 : goalDist >= 10000 ? 18 : 20;
  longKm = clamp(longKm, 6, capLong);
  if (phase === 'taper') longKm *= 0.7;
  if (recoveryWeek) longKm *= 0.85;

  const pickQ = slot => {
    if (recoveryWeek || phase === 'base') return slot === 1 ? 'strides' : 'progression';
    if (phase === 'taper') return slot === 1 ? (goalDist && goalDist <= 10000 ? 'intervals_short' : 'tempo_short') : 'strides';
    if (phase === 'race') return 'race_prep';
    if (phase === 'peak') {
      if (goalDist <= 5000) return slot === 1 ? 'vo2' : 'speed';
      if (goalDist <= 10000) return slot === 1 ? 'vo2' : 'cruise';
      if (goalDist <= 21097.5) return slot === 1 ? 'cruise' : 'tempo';
      return slot === 1 ? 'mpace' : 'cruise';
    }
    const hasQ2 = Object.values(pat).includes('Q2');
    let q1 = weekIdx % 2 === 0 ? 'tempo' : 'cruise';
    let q2 = goalDist >= 42195 ? 'mpace' : goalDist >= 21097.5 ? 'tempo' : 'vo2';
    if (!hasQ2) {
      q1 = weekIdx % 2 === 0 ? (goalDist >= 21097.5 ? 'tempo' : 'vo2') : 'cruise';
      if (M.focus.short === 'ana') q1 = 'vo2'; else if (M.focus.short === 'high') q1 = weekIdx % 2 ? 'cruise' : 'tempo'; else if (M.focus.short === 'low') q1 = 'strides';
    } else if (M.focus.short === 'ana') q2 = goalDist >= 42195 ? 'speed' : 'vo2';
    else if (M.focus.short === 'low') q2 = 'strides';
    if (slot === 1 && goalDist >= 42195 && phase === 'build' && !hasQ2) q1 = weekIdx % 2 === 0 ? 'mpace' : 'cruise';
    return slot === 1 ? q1 : q2;
  };

  const preds = M.preds;
  let racePace = null, raceName = '';
  if (goalDist > 0) {
    raceName = goalDist === 5000 ? '5K' : goalDist === 10000 ? '10K' : goalDist >= 42195 ? '풀코스' : goalDist >= 21097.5 ? '하프' : round(goalDist / 1000, 1) + 'km';
    const gt = parseGoalTime(S.goalTime);
    if (gt) racePace = gt / goalDist * 1000;
    else if (isNum(M.level)) racePace = raceTimeFor(M.level, goalDist) / goalDist * 1000;
  }
  const typesInWeek = Object.values(pat);
  const nEasy = typesInWeek.filter(x => x === 'E' || x === 'R').length;
  const nQ = typesInWeek.filter(x => x === 'Q' || x === 'Q2').length;
  const qKm = Math.max(5, weekKm * 0.18);
  const easyKm = nEasy ? Math.max(3, (weekKm - longKm - qKm * nQ) / nEasy) : 0;
  const ctxBase = { P, paces: M.paces, level: M.level, ctl: M.ctl, weekKm, racePace, raceName, raceDist: goalDist };

  const days = [];
  for (let k = 0; k < 7; k++) {
    const d = today + k, wd = weekday(d);
    const b = (lrd - wd + 7) % 7;
    let ty = pat[b] || null;
    let kind = 'rest', km = 0;
    if (ty === 'L') { kind = goalDist >= 42195 && (phase === 'build' || phase === 'peak') && !recoveryWeek && weekIdx % 2 === 1 ? 'long_m' : 'long'; km = longKm; }
    else if (ty === 'Q') { kind = pickQ(1); km = qKm; }
    else if (ty === 'Q2') { kind = pickQ(2); km = qKm; }
    else if (ty === 'E') { kind = 'easy'; km = easyKm; }
    else if (ty === 'R') { kind = 'recovery'; km = Math.min(easyKm, 5); }
    if (phase === 'race' && raceDay !== null) {
      if (d === raceDay) { kind = 'race'; km = goalDist / 1000; }
      else if (d === raceDay - 1) { kind = 'rest'; }
      else if (d === raceDay - 2 || d === raceDay - 3) { if (kind !== 'rest') kind = 'strides'; km = Math.min(km || 5, 5); }
      else if (kind === 'long' || kind === 'long_m') { kind = 'easy'; km = Math.min(longKm, 8); }
    } else if (raceDay !== null && d === raceDay) { kind = 'race'; km = goalDist / 1000; }
    days.push({ d, kind, km, planned: kind });
  }

  // size easy runs so the 7-day total matches the weekly target (quality days include warm-up and cool-down)
  { let fixed = 0, nE = 0;
    for (const d of days) {
      if (d.kind === 'easy' || d.kind === 'recovery') { nE++; continue; }
      if (d.kind === 'rest' || d.kind === 'race') continue;
      fixed += makeWorkout(d.kind, Object.assign({}, ctxBase, { km: d.km })).estDist / 1000;
    }
    if (nE) {
      const eKm = clamp((weekKm - fixed) / nE, 3, Math.max(3, weekKm * 0.25));
      for (const d of days) { if (d.kind === 'easy') d.km = eKm; else if (d.kind === 'recovery') d.km = Math.min(eKm, 5); }
    }
  }

  // adapt today to readiness & recovery
  const rd = M.readiness, rec = M.recoveryNow;
  const doneToday = M.runs.filter(r => r.day === today);
  const t0 = days[0]; let adjust = null;
  const hard = k => ['tempo', 'cruise', 'vo2', 'speed', 'mpace', 'long', 'long_m', 'progression', 'race_prep', 'intervals_short', 'tempo_short'].includes(k);
  if (doneToday.length) { adjust = { type: 'done', msg: '오늘은 이미 ' + fmtKm(sum(doneToday.map(r => r.dist))) + 'km를 달렸어요. 남은 하루는 회복에 집중하세요.' }; }
  else if (t0.kind !== 'race' && t0.kind !== 'rest') {
    const sc = rd && rd.score !== null && M.stale !== null && M.stale <= 1 ? rd.score : null;
    if ((sc !== null && sc < 25) || rec > 48) { adjust = { type: 'down', msg: '회복이 충분하지 않아 오늘은 쉬는 것을 권해요.' }; t0.kind = 'rest'; }
    else if ((sc !== null && sc < 50) || rec > 24) {
      if (hard(t0.kind)) { adjust = { type: 'down', msg: '컨디션을 고려해 \'' + (WK[t0.kind] || {}).name + '\' 대신 가벼운 이지런으로 바꿨어요.' }; t0.kind = 'easy'; t0.km = Math.max(3, Math.min(t0.km, easyKm) * 0.7); }
      else if (t0.kind === 'easy' || t0.kind === 'strides') { adjust = { type: 'down', msg: '컨디션을 고려해 짧은 회복 조깅으로 줄였어요.' }; t0.kind = 'recovery'; t0.km = Math.min(t0.km, 5); }
    } else if (sc !== null && sc < 75 && hard(t0.kind)) { adjust = { type: 'trim', msg: '컨디션이 보통이라 반복 횟수를 조금 줄였어요.' }; t0.reduce = true; }

    phase, phaseName: PHASE[phase] + (recoveryWeek ? ' · 회복 주간' : ''), phaseDesc: recoveryWeek ? '이번 주는 회복 주간이에요. 훈련량을 20~25% 줄여 몸이 적응할 시간을 줘요.' : PHASE_DESC[phase],
    recoveryWeek, weekKm: round(weekKm, 1), longKm: round(longKm, 1), raceDay, weeksToRace, racePace, raceName, goalDist,
    days, today: days[0], adjust, doneToday,
  };
}

// even-effort race plan: first third 1% easier, last third 1% faster, scaled to hit the target exactly
function racePlan(D, target) {
  if (!(D > 0 && target > 0)) return null;
  const base = target / D * 1000;
  const marks = D <= 5000 ? [1000, 2000, 3000, 4000, 5000] : D <= 10000 ? [2000, 4000, 6000, 8000, 10000] : D <= 21097.5 ? [5000, 10000, 15000, 20000, 21097.5] : [5000, 10000, 15000, 20000, 25000, 30000, 35000, 40000, 42195];
  const paceAt = m => base * (m <= D / 3 ? 1.01 : m <= 2 * D / 3 ? 1.0 : 0.99);
  let raw = 0, prev = 0; const segs = [];
  for (const m of marks) { const p = paceAt((prev + m) / 2); segs.push([m, p, (m - prev) / 1000 * p]); raw += (m - prev) / 1000 * p; prev = m; }
  const k = target / raw; let cum = 0;
  return segs.map(([m, p, t]) => { cum += t * k; return { m, pace: p * k, cum }; });
}

// '3:59:00', '3.59.00', '50:00', '50.00' or just '50' (minutes)
function parseGoalTime(s) {
  if (!s) return null;
  const p = String(s).trim().replace(/[.,\s]+/g, ':').replace(/^:+|:+$/g, '').split(':').map(x => (/^\d+$/.test(x) ? parseInt(x, 10) : NaN));
  if (!p.length || p.some(x => !isNum(x))) return null;
  let t = null;
  if (p.length === 3 && p[1] < 60 && p[2] < 60) t = p[0] * 3600 + p[1] * 60 + p[2];
  else if (p.length === 2 && p[1] < 60) t = p[0] * 60 + p[1];
  else if (p.length === 1) t = p[0] * 60;
  return t && t >= 600 && t <= 8 * 3600 ? t : null;
}

function buildInsights(M) {
  const out = [], today = M.today;
  if (M.stale !== null && M.stale >= 2) out.push({ tone: 'info', title: '데이터가 ' + M.stale + '일 전 기준이에요', text: '건강 앱에서 다시 내보내 가져오면 오늘 컨디션과 추천이 정확해져요.' });

// auto-detect repeated fast segments (intervals) from the speed trace
function detectIntervals(r) {
  const s = r.ser, n = s.t.length; if (n < 30 || !r.dist) return null;
  const vs = []; for (let i = 0; i < n; i++) if (s.v[i] > 100) vs.push(s.v[i]);
  if (vs.length < 20) return null;
  const med = median(vs);
  let thr = med * 1.12;
  if (r.lvl) thr = Math.max(thr, speedForVO2(0.87 * r.lvl) / 60 * 100);
  const on = s.v.map(v => v >= thr);
  for (let i = 1; i < n - 2; i++) if (!on[i] && on[i - 1] && (on[i + 1] || on[i + 2])) on[i] = true; // bridge ≤10 s dips
  const segs = []; let a = -1;
  for (let i = 0; i <= n; i++) {
    if (i < n && on[i]) { if (a < 0) a = i; }
    else if (a >= 0) { const t0 = a > 0 ? s.t[a - 1] : 0, t1 = s.t[i - 1]; if (t1 - t0 >= 30) segs.push([a, i - 1]); a = -1; }
  }
  if (segs.length < 3) return null;
  const reps = segs.map(([i0, i1], k) => {
    const t0 = i0 > 0 ? s.t[i0 - 1] : 0, d0 = i0 > 0 ? s.d[i0 - 1] : 0, t = s.t[i1] - t0, d = s.d[i1] - d0;
    let hs = 0, hn = 0, hm = 0; for (let i = i0; i <= i1; i++) if (s.h[i]) { hs += s.h[i]; hn++; hm = Math.max(hm, s.h[i]); }
    const nxt = segs[k + 1]; const rest = nxt ? s.t[nxt[0] - 1] - s.t[i1] : null;
    return { n: k + 1, t, d, pace: d > 0 ? t / d * 1000 : NaN, hr: hn ? Math.round(hs / hn) : null, hrMax: hm || null, rest };
  });
  const tot = sum(reps.map(x => x.t));
  if (tot < 150) return null;
  return reps;
}

function runInsights(r, M) {

  // compared with similar earlier runs (same type, similar distance, last 90 days)
  const sim = M.runs.filter(x => x.id !== r.id && x.start < r.start && x.day >= r.day - 90 && x.label === r.label && x.dist > r.dist * 0.7 && x.dist < r.dist * 1.3 && x.hrAvg && x.ef).slice(-6);

    const dp = pace - p0, dh = r.hrAvg - h0, gain = (r.ef / e0 - 1) * 100;
    const pT = Math.abs(dp) < 2 ? '페이스는 비슷하고' : '페이스는 km당 ' + Math.round(Math.abs(dp)) + '초 ' + (dp < 0 ? '빠르고' : '느리고');

    out.push({ tone: gain >= 2 ? 'good' : gain <= -3 ? 'warn' : 'info', text: '최근 비슷한 ' + L.name + ' 러닝 ' + sim.length + '번과 비교하면 ' + pT + ', ' + hT + '.' + verdict });
  }

  if (r.dist >= 3000 && n > 20 && !['vo2', 'anaerobic', 'sprint'].includes(r.label)) {
    const half = s.d[n - 1] / 2; let k = 0; while (k < n && s.d[k] < half) k++;

    if (d1 > 0 && d2 > 0) {

      else if (diff >= 5) out.push({ tone: 'warn', text: '후반 페이스가 전반보다 ' + Math.round(diff) + '% 느려졌어요. 초반을 조금 더 참으면 기록이 좋아져요.' });

  }
  if (r.decoup !== null) {
    if (r.decoup < 5) out.push({ tone: 'good', text: '심박 드리프트 ' + r.decoup.toFixed(1) + '% — 후반까지 심박이 안정적이었어요. 이 거리에 대한 유산소 지구력이 충분해요.' });

  if (['base', 'long', 'recovery'].includes(r.label) && M.P && r.zt) {
    const tot = sum(r.zt); if (tot > 600 && (r.zt[2] + r.zt[3] + r.zt[4]) / tot > 0.35) out.push({ tone: 'info', text: '편한 달리기였지만 ' + Math.round((r.zt[2] + r.zt[3] + r.zt[4]) / tot * 100) + '%를 존 3 이상으로 달렸어요. 이지런은 더 천천히 달려야 회복과 기초 체력에 좋아요.' });

}

// ===== core_demo.js — clearly-labelled example data (an invented runner) so the tool shows its full working state =====

function makeDemoRaw(nowS, off, nDays) {
  let seed = 20261023;
  const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };

  const today = dayOfUtc(nowS, off);
  const d0 = today - nDays;
  const routes = {};
  const vo2At = di => 45 + 5 * (di / nDays);
  const speedAt = (frac, vo2) => speedForVO2(frac * vo2) / 60;
  const course = dist => {
    const L = 2400, a = 2 * Math.PI * (dist % L) / L;
    return [37.52 + 0.0035 * Math.sin(a), 127.0 + 0.005 * Math.cos(a), 20 + 8 * Math.sin(2 * Math.PI * dist / 1800) + 3 * Math.sin(2 * Math.PI * dist / 600)];
  };

    const day = d0 + di, wd = weekday(day), dayStart = day * 86400 - off;
    // sleep (night ending this morning)
    const bed = dayStart - 3600 + Math.floor(rnd() * 50) * 60;
    const total = (6.4 + rnd() * 1.7) * 3600;
    let t = bed + 600, el = 0;
    while (el < total) {
      const cyc = Math.min(5400, total - el);
      const parts = [[3, 0.45], [4, el < 3 * 3600 ? 0.2 : 0.08], [3, 0.12], [5, el > 7200 ? 0.18 : 0.1], [2, 0.03]];
      const sm = parts.reduce((a, b) => a + b[1], 0);
      for (const [st, fr] of parts) { const seg = cyc * fr / sm; if (seg < 30) continue; P.sleep.push([t, t + seg, st, watch, off]); t += seg; }
      el += cyc;
    }
    const baseHrv = 46 + di * 0.03 - fatigue * 4;
    for (const h of [1, 3, 5]) { const at2 = bed + h * 3600 + rnd() * 2400; P.hrv.push([at2, dayOfUtc(at2, off), ((at2 + off) % 86400 + 86400) % 86400, Math.max(15, gauss(baseHrv, 6))]); }
    P.resp.push([bed + 7200, day, 3600, gauss(14.5, 0.4)]);
    P.temp.push([day, gauss(35.2, 0.15)]);
    P.rhr.push([day, Math.round(REST + fatigue * 3 + gauss(0, 1.2))]);
    if (di % 7 === 3) P.vo2.push([dayStart + 8 * 3600, day, round(vo2At(di) - 3.5 + gauss(0, 0.5), 2)]);
    if (di % 10 === 0) P.mass.push([dayStart + 7 * 3600, 68 - di * 0.01]);
    if (day >= today) break;
    for (let m = 6 * 60; m < 23 * 60; m += 5) P.hr.push((dayStart + m * 60) * 256 + Math.round(gauss(68, 6)));
    // schedule: Tue quality, Wed easy (treadmill every other week), Thu strides, Sat short easy, Sun long
    const wk = Math.floor(di / 7), r = rnd();
    let kind = null, indoor = false;
    if (di === nDays - 75) kind = 'race5k';
    else if (di === nDays - 26) kind = 'race10k';
    else if (wd === 2 && r > 0.08) kind = wk % 2 === 0 ? 'tempo' : 'intervals';
    else if (wd === 3 && r > 0.1) { kind = 'easy'; indoor = wk % 2 === 0; }
    else if (wd === 4 && r > 0.15) kind = 'strides';
    else if (wd === 6 && r > 0.25) kind = 'easy_short';
    else if (wd === 0 && r > 0.05) kind = 'long';
    fatigue *= 0.6;
    if (kind) {
      const vo2 = vo2At(di) + gauss(0, 0.4), e = speedAt(0.66, vo2);
      const segs = { easy: [[2400 + Math.floor(rnd() * 900), e]], easy_short: [[1500 + Math.floor(rnd() * 600), speedAt(0.63, vo2)]],
        long: [[4800 + Math.floor(rnd() * 2100), speedAt(0.64, vo2)]], tempo: [[900, e], [1500, speedAt(0.88, vo2)], [600, e]] }[kind] || [];
      if (kind === 'strides') { segs.push([2100, e]); for (let k = 0; k < 6; k++) segs.push([20, speedAt(1.06, vo2)], [70, speedAt(0.45, vo2)]); }
      if (kind === 'intervals') { segs.push([900, e]); for (let k = 0; k < 5; k++) segs.push([Math.round(1000 / speedAt(0.98, vo2)), speedAt(0.98, vo2)], [180, speedAt(0.5, vo2)]); segs.push([600, e]); }
      if (kind === 'race5k') segs.push([720, e], [Math.round(5000 / speedAt(0.975, vo2)), speedAt(0.975, vo2)], [480, speedAt(0.55, vo2)]);

      const T0 = dayStart + 6 * 3600 + 1200 + Math.floor(rnd() * 2400);

      const rt = { t: [], lat: [], lon: [], ele: [], spd: [], hacc: [] };

        const f = (danielsVO2(v * gapFactor(g) * 60) - 3.5) / (vo2 - 3.5);

        hsum += hrv; hn++; hmax = Math.max(hmax, hrv);
        if (!indoor) {
          rt.t.push(ts); rt.lat.push(la + gauss(0, 0.000012)); rt.lon.push(lo + gauss(0, 0.000015)); rt.ele.push(ele + gauss(0, 0.4)); rt.spd.push(v); rt.hacc.push(2 + rnd() * 3);
          if (eref === null) eref = ele; else if (ele - eref >= 2) { gain += ele - eref; eref = ele; } else if (eref - ele >= 2) eref = ele;
        }
        if (tt % 10 === 0 && tt > 0) {
          const cad = 160 + 9 * (v - 2.8) + gauss(0, 1.5);
          P.steps.push(ts - 10, 10, Math.round(cad / 6));
          if (indoor) P.dist.push(ts - 10, 10, v * 10);
        }
        tt++; left--;
        if (left <= 0) { si++; if (si < segs.length) left = segs[si][0]; }
      }
      for (const [ts, v, g] of dyn) {
        if (v < 1.5) continue;
        P.dyn.power.push(ts, 0, Math.round(68 * v * gapFactor(g) * 1.04 + gauss(0, 6)));
        if ((ts - T0) % 10 === 0) {
          const cad = 160 + 9 * (v - 2.8);
          P.dyn.stride.push(ts, 10, v * 60 / cad); P.dyn.vosc.push(ts, 10, 9.6 - 0.5 * (v - 2.8) + gauss(0, 0.2)); P.dyn.gct.push(ts, 10, 265 - 22 * (v - 2.8) + gauss(0, 4));
        }
      }
      const end = T0 + tt;
      P.hrr1.push([end + 60, Math.round(28 + di / 30 + gauss(0, 2))]);
      P.effort.push([T0, end, { easy: 3, easy_short: 2, strides: 4, long: 6, tempo: 7, intervals: 8, race5k: 9, race10k: 9 }[kind], 19]);
      const id = 'demo-' + di;
      if (!indoor) routes[id] = rt;
      const meta = { HKIndoorWorkout: indoor ? '1' : '0', HKAverageMETs: '10.1 kcal/hr·kg' };
      if (!indoor) { meta.HKWeatherTemperature = round(tempC * 9 / 5 + 32, 1) + ' degF'; meta.HKWeatherHumidity = (55 + Math.floor(rnd() * 30)) * 100 + ' %'; meta.HKElevationAscended = Math.round(gain * 100) + ' cm'; }
      P.workouts.push({ type: 'Running', start: T0, end, off, day, dur: tt, src: '예시 러너의 Apple Watch', legacyDist: NaN, legacyEnergy: NaN, meta,
        stats: { HKQuantityTypeIdentifierDistanceWalkingRunning: { sum: dist / 1000, unit: 'km' }, HKQuantityTypeIdentifierActiveEnergyBurned: { sum: dist / 1000 * 68, unit: 'kcal' },
          HKQuantityTypeIdentifierHeartRate: { avg: hsum / hn, max: hmax, unit: 'count/min' } },
        events: [], routes: indoor ? [] : [id] });
      fatigue += { long: 1.0, tempo: 0.9, intervals: 1.0, race5k: 1.2, race10k: 1.4 }[kind] || 0.3;
    }
    if ((wd === 1 || wd === 5) && rnd() < 0.7) {
      const s0 = dayStart + 18 * 3600 + 600, mins = 30 + Math.floor(rnd() * 20); let h = 85;
      for (let k = 0; k < mins * 60; k += 5) { h += (98 - h) / 5; P.hr.push((s0 + k) * 256 + Math.round(h + gauss(0, 2))); }
      P.workouts.push({ type: 'Walking', start: s0, end: s0 + mins * 60, off, day, dur: mins * 60, src: '예시 러너의 Apple Watch', legacyDist: NaN, legacyEnergy: NaN, meta: {},
        stats: { HKQuantityTypeIdentifierDistanceWalkingRunning: { sum: mins * 0.085, unit: 'km' }, HKQuantityTypeIdentifierActiveEnergyBurned: { sum: mins * 5.5, unit: 'kcal' } }, events: [], routes: [] });
    }
  }

  raw.exportUtc = nowS; raw.exportOff = off;
  return { raw, routes };
}

async function makeDemoData(nowS, off) {
  nowS = nowS || nowUtc(); off = off === undefined ? localOffsetSec() : off;
  const { raw, routes } = makeDemoRaw(nowS, off, 120);
  const data = await assemble(raw, async id => routes[id] || null, () => {});

}

  if (upx >= 18) { out += '<g style="stroke:var(--line)" stroke-width="1" opacity=".7">'; for (let x = W / 2 % upx; x < W; x += upx) out += '<line x1="' + x.toFixed(1) + '" x2="' + x.toFixed(1) + '" y1="0" y2="' + H + '"/>'; for (let y = H / 2 % upx; y < H; y += upx) out += '<line x1="0" x2="' + W + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/>'; out += '</g>'; }
  let cur = -1, pts = '';
  out += '<polyline points="' + rt.la.map((_, i) => px(i) + ',' + py(i)).join(' ') + '" fill="none" style="stroke:var(--surface)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>';
  for (let i = 1; i < rt.la.length; i++) {
    const b = bucket(sp[i]);
    if (b !== cur) { if (pts) out += '<polyline points="' + pts + '" fill="none" style="stroke:' + ZC[cur] + '" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'; cur = b; pts = px(i - 1) + ',' + py(i - 1); }
    pts += ' ' + px(i) + ',' + py(i);
  }
  if (pts) out += '<polyline points="' + pts + '" fill="none" style="stroke:' + ZC[cur] + '" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>';

  out += '<rect x="' + (px(L) - 6) + '" y="' + (py(L) - 6) + '" width="12" height="12" rx="2" style="fill:var(--ink);stroke:var(--surface)" stroke-width="3"/>';

// opens this run's route on a real map in a new tab (geojson.io reads the route from the link itself)
function mapLink(r) {
  const rt = r.route; if (!rt || rt.la.length < 2) return '';
  const n = rt.la.length, step = Math.max(1, Math.ceil(n / 300)), c = [];
  for (let i = 0; i < n; i += step) c.push([round(rt.lo[i], 5), round(rt.la[i], 5)]);
  if ((n - 1) % step) c.push([round(rt.lo[n - 1], 5), round(rt.la[n - 1], 5)]);
  const fc = { type: 'FeatureCollection', features: [
    { type: 'Feature', properties: { name: fmtDay(r.day) + ' 러닝 ' + (r.dist / 1000).toFixed(2) + 'km', stroke: '#4f46e5', 'stroke-width': 4, 'stroke-opacity': 0.9 }, geometry: { type: 'LineString', coordinates: c } },
    { type: 'Feature', properties: { name: '출발', 'marker-color': '#16a34a' }, geometry: { type: 'Point', coordinates: c[0] } },
    { type: 'Feature', properties: { name: '도착', 'marker-color': '#111827' }, geometry: { type: 'Point', coordinates: c[c.length - 1] } }] };
  // encoded twice: the site decodes the link once before reading it as a data URL, and '#' in colours must survive that
  return 'https://geojson.io/#data=' + encodeURIComponent('data:application/json,' + encodeURIComponent(JSON.stringify(fc)));
}

// Garmin-style colour gauge for running dynamics. ranges: 4 cut points from worst to best side.
const DYN_RANGES = {
  cad: { name: '케이던스', unit: 'spm', cuts: [151, 163, 174, 186], better: 'high', fmt: v => Math.round(v) },
  gc: { name: '지면 접촉 시간', unit: 'ms', cuts: [308, 278, 248, 218], better: 'low', fmt: v => Math.round(v) },
  vo: { name: '수직 진폭', unit: 'cm', cuts: [11.5, 9.75, 8.15, 6.4], better: 'low', fmt: v => v.toFixed(1) },
  vr: { name: '수직 비율', unit: '%', cuts: [10.1, 8.65, 7.45, 6.1], better: 'low', fmt: v => v.toFixed(1) },
};
const GCOL = ['var(--g-red)', 'var(--g-orange)', 'var(--g-green)', 'var(--g-blue)', 'var(--g-purple)'];
const GNAME = ['개선 필요', '보통 이하', '보통', '우수', '최상위'];
function dynGauge(key, v) {
  const R = DYN_RANGES[key]; if (!isNum(v)) return '';
  v = +R.fmt(v);
  const c = R.cuts, hi = R.better === 'high';
  let zone = 0; for (let i = 0; i < 4; i++) if (hi ? v >= c[i] : v <= c[i]) zone = i + 1;
  // position within its zone (0..1) → overall 0..100%
  const edges = [hi ? c[0] - (c[1] - c[0]) : c[0] + (c[0] - c[1]), ...c, hi ? c[3] + (c[3] - c[2]) : c[3] - (c[2] - c[3])];
  const a = edges[zone], b = edges[zone + 1];
  const f = clamp((v - a) / (b - a), 0.04, 0.96);
  const pos = (zone + f) / 5 * 100;
  return '<div class="gauge"><div class="gl"><span>' + esc(R.name) + '</span><span><b>' + esc(R.fmt(v)) + '</b> <span class="xs muted">' + R.unit + '</span> · <span class="xs" style="font-weight:700">' + GNAME[zone] + '</span></span></div>' +
    '<div class="gt">' + GCOL.map(col => '<i style="background:' + col + '"></i>').join('') + '<span class="mk" style="left:' + pos + '%"></span></div>' +
    '<div class="gs"><span>' + (hi ? '낮음' : '큼') + '</span><span>' + (hi ? '높음 (좋음)' : '작음 (좋음)') + '</span></div></div>';
}

function teBars(label, v) {
  const cells = [0, 1, 2, 3, 4].map(i => '<i><b style="width:' + clamp((v - i) * 100, 0, 100) + '%"></b></i>').join('');
  return '<div class="te-row"><span>' + label + '</span><div class="te-bar">' + cells + '</div><span class="tv"><b>' + v.toFixed(1) + '</b><span class="xs">' + teWord(v) + '</span></span></div>';
}

function hbar(label, value, max, color, valTxt, tgt) {
  const w = max > 0 ? clamp(value / max * 100, 0, 100) : 0;
  const t = tgt ? '<span class="tgt" style="left:' + clamp(tgt[0] / max * 100, 0, 100) + '%;width:' + clamp((tgt[1] - tgt[0]) / max * 100, 0, 100) + '%"></span>' : '';
  return '<div class="hbar' + (tgt ? ' has-tgt' : '') + '"><span>' + esc(label) + '</span><div class="track">' + t + '<b style="width:' + w + '%;background:' + color + '"></b></div><span class="v">' + esc(valTxt) + '</span></div>';
}

// ===== ui_map.js — the route on a real map, coloured by pace like the Fitness app =====
// Only in the home-screen web app: claude.ai pages may not load map pictures, so there the route stays a drawing.
const MAPS = new Set();
let FULLMAP = null;
function mapsOn() { return typeof TARGET !== 'undefined' && TARGET === 'web' && typeof L !== 'undefined'; }
function clearMaps() { for (const m of MAPS) { try { m.remove(); } catch (e) { /* already gone */ } } MAPS.clear(); }
function isDarkUI() { const t = document.documentElement.dataset.theme; return t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches); }
const TILE_ATTR = '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>';
function tileUrl() {
  return isDarkUI() ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png' : 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
}

// speed (m/s) at each route point, averaged over about 80 m either side so colours change smoothly along the road
function routeSpeeds(r) {
  const rt = r.route, s = r.ser, n = rt.la.length, raw = new Float64Array(n);
  for (let i = 0; i < n; i++) { const k = clamp(bsearch(s.d, rt.d[i]), 0, s.d.length - 1); raw[i] = s.v[k] / 100; }
  const out = []; let a = 0, b = -1, sum = 0, cnt = 0;
  for (let i = 0; i < n; i++) {
    while (b + 1 < n && rt.d[b + 1] <= rt.d[i] + 80) { b++; if (raw[b] > 0.5) { sum += raw[b]; cnt++; } }
    while (rt.d[a] < rt.d[i] - 80) { if (raw[a] > 0.5) { sum -= raw[a]; cnt--; } a++; }
    out.push(cnt > 0 ? sum / cnt : 0);
  }
  return out;
}
function speedRange(sp) { const mv = sp.filter(v => v > 0.5); return mv.length ? [quantile(mv, 0.05), quantile(mv, 0.95)] : [0, 1]; }
// 0 = slowest (red) … 0.5 (yellow) … 1 = fastest (green), the Fitness app's pace colours
const PACE_STOPS = [[0, [255, 59, 48]], [0.5, [255, 204, 0]], [1, [52, 199, 89]]];
function paceRGB(f) {
  f = clamp(isNum(f) ? f : 0.5, 0, 1);
  const j = f <= 0.5 ? 0 : 1, a = PACE_STOPS[j], b = PACE_STOPS[j + 1], t = (f - a[0]) / (b[0] - a[0]);
  return 'rgb(' + a[1].map((v, k) => Math.round(v + (b[1][k] - v) * t)).join(',') + ')';
}
function paceLegend(r) {
  if (!r.route) return '';
  const [lo, hi] = speedRange(routeSpeeds(r));
  const pace = v => v > 0.5 ? fmtPace(1000 / v) : '–';
  return '<div class="pace-legend"><div class="pl-scale"><span class="pl-end">느림 <b>' + pace(lo) + '</b></span><span class="pl-bar" aria-hidden="true"></span><span class="pl-end"><b>' + pace(hi) + '</b> 빠름</span></div>' +
    '<div class="pl-pts"><span class="pl-pt"><i style="background:#34c759"></i>출발</span><span class="pl-pt"><i class="sq" style="background:#12141b"></i>도착</span></div></div>';
}

// draw a run's route on a map inside el. Inline maps sit still (page scrolling stays easy); the full-screen map moves freely.
function drawRouteMap(el, r, opts) {
  opts = opts || {};
  if (!el || !mapsOn() || !r || !r.route || r.route.la.length < 2) return null;
  const full = !!opts.full, rt = r.route;
  const pts = rt.la.map((la, i) => [la, rt.lo[i]]);
  const coarse = matchMedia('(pointer: coarse)').matches;
  const map = L.map(el, { maxZoom: 20,
    zoomControl: full && !coarse, attributionControl: true, dragging: full, touchZoom: full, doubleClickZoom: full, scrollWheelZoom: full,
    boxZoom: false, keyboard: full, tap: false, zoomSnap: 0.25, preferCanvas: true, fadeAnimation: true,
  });
  map.attributionControl.setPrefix(false);
  L.tileLayer(tileUrl(), { subdomains: 'abcd', maxNativeZoom: 18, maxZoom: 20, attribution: TILE_ATTR, crossOrigin: true }).addTo(map);
  const ren = L.canvas({ padding: 0.5 }), dark = isDarkUI();
  const line = { renderer: ren, lineCap: 'round', lineJoin: 'round', interactive: false };
  L.polyline(pts, Object.assign({ color: dark ? '#0b0c10' : '#ffffff', weight: full ? 10 : 8, opacity: dark ? 0.7 : 0.95 }, line)).addTo(map);
  // colour runs of points that share (nearly) the same pace colour as one line
  const sp = routeSpeeds(r), [lo, hi] = speedRange(sp), span = Math.max(0.05, hi - lo);
  const step = f => Math.round(clamp(f, 0, 1) * 24) / 24;
  let seg = [pts[0]], cur = step((sp[1] - lo) / span);
  for (let i = 1; i < pts.length; i++) {
    const q = step((sp[i] - lo) / span);
    seg.push(pts[i]);
    if (q !== cur || i === pts.length - 1) { L.polyline(seg, Object.assign({ color: paceRGB(cur), weight: full ? 6 : 5 }, line)).addTo(map); seg = [pts[i]]; cur = q; }
  }
  const dot = c => Object.assign({ renderer: ren, radius: full ? 8 : 7, color: '#ffffff', weight: 3, fillColor: c, fillOpacity: 1, interactive: false });
  const es = full ? 18 : 16; // finish: a dark square, so it never reads as a pace colour
  L.marker(pts[pts.length - 1], { icon: L.divIcon({ className: 'end-mark', iconSize: [es, es] }), interactive: false, keyboard: false }).addTo(map);
  L.circleMarker(pts[0], dot('#34c759')).addTo(map);
  map.fitBounds(L.latLngBounds(pts), { padding: full ? [48, 48] : [22, 22], maxZoom: 17 });
  if (!full) { MAPS.add(map); if (opts.onTap) el.addEventListener('click', e => { if (!e.target.closest('.leaflet-control-attribution')) opts.onTap(); }); }
  return map;
}

function openMapFull(id) {
  const r = (st.M && st.M.runs.find(x => x.id === id)) || null; if (!r || !mapsOn()) return;
  closeMapFull();
  const pace = r.moving / Math.max(1, r.dist) * 1000;
  const w = document.createElement('div'); w.className = 'mapfull'; w.setAttribute('role', 'dialog'); w.setAttribute('aria-modal', 'true'); w.setAttribute('aria-label', '러닝 경로 지도');
  w.innerHTML = '<div class="mapfull-map" id="map-full"></div>' +
    '<div class="mapfull-top"><div class="mapfull-t"><b>' + esc(fmtDay(r.day)) + ' ' + esc(timeKo(r.start, r.off)) + '</b><span>' + kmTxt(r.dist, 2) + 'km · ' + fmtPace(pace) + '/km · ' + fmtDur(r.dur) + '</span></div><button class="btn small" data-act="mapclose">닫기</button></div>' +
    '<div class="mapfull-bottom">' + paceLegend(r) + '</div>';
  document.body.appendChild(w); document.body.style.overflow = 'hidden';
  FULLMAP = drawRouteMap(w.querySelector('#map-full'), r, { full: true });
}
function closeMapFull() {
  if (FULLMAP) { try { FULLMAP.remove(); } catch (e) { /* gone */ } FULLMAP = null; }
  const w = document.querySelector('.mapfull'); if (w) { w.remove(); document.body.style.overflow = ''; }
}

function mount(fn) { st.mounts.push(fn); }
const isDemo = () => st.data && st.data.source === 'demo';

function freshText() {
  const M = st.M;

  } else body = '<p class="small ink2"><b>' + esc(plan.phaseName) + '</b> — ' + esc(plan.phaseDesc) + '</p><p class="small muted" style="margin-top:6px">목표 대회를 등록하면 대회 날짜에 맞춰 기초기 → 강화기 → 피크기 → 테이퍼로 계획을 짜 드려요.</p>';

  if (hs) mount(() => {

    mount(() => lineChart($('#c-rhr'), { x: rs.map(s => s.d), xFmt: fmtDayShort, tipX: d => fmtDay(d), height: 150, label: '안정 심박',
