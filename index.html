  }
  const last = M.sleep.last, nights = M.sleep.nights;
  if (nights.some(n => n.asleep)) {
    const L = last && last.asleep ? last : nights.slice().reverse().find(n => n.asleep);
    const seg = L.staged ? [['깊은 수면', L.deep, 'var(--sleep-deep)'], ['코어', L.core, 'var(--sleep-core)'], ['렘', L.rem, 'var(--sleep-rem)'], ['깸', L.awake, 'var(--sleep-awake)']] : [['수면', L.asleep, 'var(--sleep-core)'], ['깸', L.awake, 'var(--sleep-awake)']];
    const tot = sum(seg.map(s => s[1]));
    h += '<section class="card"><div class="card-head"><h2>수면 ' + infoBtn('sleep') + '</h2><span class="xs muted">' + fmtDay(L.d) + '</span></div>' +

      '<div class="stack" style="margin-top:12px;height:16px">' + seg.map(s => s[1] > 0 ? '<b style="width:' + (s[1] / tot * 100) + '%;background:' + s[2] + '"></b>' : '').join('') + '</div>' +
      '<div class="legend">' + seg.map(s => '<span><i style="background:' + s[2] + '"></i>' + s[0] + ' ' + fmtDurKo(s[1]) + (L.staged && s[0] !== '깸' ? ' (' + Math.round(s[1] / L.asleep * 100) + '%)' : '') + '</span>').join('') + '</div>' +
      '<div class="chart" id="c-sleep" style="margin-top:12px"></div></section>';
    mount(() => sleepChart($('#c-sleep'), nights));
  }
  if (isNum(M.temp.dev) || isNum(M.resp.dev)) {

  }
  return h;
}
function sleepChart(el, nights) {
  if (!el) return;
  const W = Math.max(240, el.clientWidth || 320), H = 150, m = { l: 30, r: 6, t: 8, b: 22 };
  const n = nights.length, pw = W - m.l - m.r, ph = H - m.t - m.b, maxH = Math.max(9, ...nights.map(x => (x.asleep || 0) / 3600 + (x.awake || 0) / 3600));
  const bw = Math.min(16, pw / n * 0.62), Y = v => m.t + ph - v / maxH * ph;
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" height="' + H + '" role="img" aria-label="최근 14일 수면"><g class="grid">';
  for (const t of [0, 4, 8]) s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(t) + '" y2="' + Y(t) + '"/><text x="' + (m.l - 6) + '" y="' + (Y(t) + 3.5) + '" text-anchor="end">' + t + 'h</text>';
  s += '</g>';
  nights.forEach((nt, i) => {
    const cx = m.l + (i + 0.5) * pw / n;
    if (i % 2 === (n - 1) % 2) s += '<text x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle">' + fmtDayShort(nt.d) + '</text>';
    if (!nt.asleep) return;
    const parts = nt.staged ? [[nt.deep, 'var(--sleep-deep)'], [nt.core, 'var(--sleep-core)'], [nt.rem, 'var(--sleep-rem)'], [nt.awake, 'var(--sleep-awake)']] : [[nt.asleep, 'var(--sleep-core)'], [nt.awake, 'var(--sleep-awake)']];
    let acc = 0;
    for (const [v, c] of parts) { if (!v) continue; const y1 = Y(acc / 3600), y2 = Y((acc + v) / 3600); s += '<rect x="' + (cx - bw / 2) + '" y="' + y2 + '" width="' + bw + '" height="' + Math.max(0, y1 - y2 - 1) + '" style="fill:' + c + '"/>'; acc += v; }
    s += '<text x="' + cx + '" y="' + (Y(acc / 3600) - 4) + '" text-anchor="middle" style="fill:var(--ink-2);font-size:10px">' + (nt.score || '') + '</text>';
  });
  el.innerHTML = s + '</svg><div class="legend"><span>막대 위 숫자 = 수면 점수</span></div>';
}

// ===== ui_app.js — navigation, events, import / backup flows, boot =====
const TAB_VIEWS = ['today', 'runs', 'training', 'growth', 'recovery'];
function tabOf(v) { if (TAB_VIEWS.includes(v)) return v; if (v.startsWith('run:')) return st.back.includes('runs') ? 'runs' : st.back[st.back.length - 1] || 'runs'; return null; }

function render(keepScroll) {
  const v = st.view;
  const tab = tabOf(v);
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.v === tab ? 'page' : 'false'));
  renderBanner();
  clearMaps();
  st.mounts = [];
  let html;
  try {
    if (!st.M) html = '<div class="empty">불러오는 중…</div>';
    else if (v === 'today') html = vToday();
    else if (v === 'runs') html = vRuns();
    else if (v === 'training') html = vTraining();
    else if (v === 'growth') html = vGrowth();
    else if (v === 'recovery') html = vRecovery();
    else if (v === 'settings') html = vSettings();
    else if (v === 'import') html = vImport();
    else if (v === 'guide') html = vGuide();
    else if (v.startsWith('run:')) html = vRun(v.slice(4));
    else html = vToday();
  } catch (e) {
    console.error(e);
    html = '<div class="card"><div class="empty">화면을 그리는 중 문제가 생겼어요.<br><span class="xs">' + esc(e && e.message) + '</span></div></div>';
  }
  $('#view').innerHTML = html;
  for (const f of st.mounts) { try { f(); } catch (e) { console.error(e); } }
  if (!keepScroll) window.scrollTo(0, st.scroll[v] || 0);
}
function renderBanner() {
  const b = $('#banner');
  if (st.data && isDemo() && !['import', 'guide'].includes(st.view) && !st.importing)
    b.innerHTML = '<div class="banner"><span><b>예시 데이터</b>를 보여주고 있어요. 내 애플워치 기록을 가져오면 바로 내 분석으로 바뀌어요.</span><button class="btn small" data-act="go" data-v="import">가져오기</button></div>';
  else b.innerHTML = '';
}
function go(v) {
  st.scroll[st.view] = window.scrollY;
  if (TAB_VIEWS.includes(v)) st.back = []; else if (st.view !== v) st.back.push(st.view);
  st.view = v; render();
}
function goBack() { st.scroll[st.view] = 0; st.view = st.back.pop() || 'today'; render(); }

function openSheet(html) {
  if (!html) return;
  $('#sheet-root').innerHTML = '<div class="sheet-bg" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true">' + html + '</div></div>';
  document.body.style.overflow = 'hidden';
  const btn = $('#sheet-root .sheet button'); if (btn) btn.focus({ preventScroll: true });
}
function closeSheet() { $('#sheet-root').innerHTML = ''; document.body.style.overflow = ''; }
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800); }
function recompute() { st.M = analyze(st.data, st.settings); }

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, v = a.dataset.v;
  switch (act) {
    case 'tab': closeSheet(); go(v); break;
    case 'go': closeSheet(); go(v); break;
    case 'back': goBack(); break;
    case 'run': closeSheet(); go('run:' + v); break;
    case 'info': openSheet(infoSheet(v)); break;
    case 'planday': openSheet(planDaySheet(+v)); break;
    case 'close': closeSheet(); break;
    case 'close-bg': if (e.target === a) closeSheet(); break;
    case 'filter': st.runFilter = v; st.runLimit = 60; render(true); break;
    case 'more': st.runLimit += 60; render(true); break;
    case 'grange': st.growthRange = +v; render(true); break;
    case 'rchart': {
      st.runChart = v;
      document.querySelectorAll('[data-act="rchart"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
      const r = st.M.runs.find(x => 'run:' + x.id === st.view); if (r) runChart(r);
      break;
    }
    case 'segset': { const g = a.closest('.segctl'); g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === a))); zonePreview(); break; }
    case 'reset-settings': st.settings = {}; st.savedAt = null; LS.set('settings', {}); DB.set('settings', {}); recompute(); render(true); toast('자동값으로 되돌렸어요'); break;
    case 'pick-health': closeSheet(); $('#file-health').click(); break;
    case 'mapfull': openMapFull(v); break;
    case 'mapclose': closeMapFull(); break;
    case 'howto': openSheet(howtoSheet()); break;
    case 'pick-backup': $('#file-backup').click(); break;
    case 'backup': doBackup(); break;
    case 'delete': st.confirmDelete = true; render(true); break;
    case 'delete-no': st.confirmDelete = false; render(true); break;
    case 'delete-yes': doDelete(); break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMapFull(); closeSheet(); } });
document.addEventListener('submit', e => { if (e.target.id === 'settings-form') { e.preventDefault(); saveSettings(); } });

function saveSettings() {
  const f = $('#settings-form'); if (!f) return;
  const segVal = id => { const b = f.querySelector('#' + id + ' [aria-pressed="true"]'); return b ? b.dataset.v : ''; };
  const n = id => { const x = parseFloat(f.querySelector('#' + id).value); return isNum(x) ? x : null; };
  const S = {
    sex: segVal('sex'), zoneMethod: segVal('zoneMethod') || 'hrr', birthYear: n('birthYear'), weight: n('weight'),
    maxHR: n('maxHR'), restHR: n('restHR'), lthr: n('lthr'), sleepNeed: n('sleepNeed') || 8,
    runsPerWeek: +f.querySelector('#runsPerWeek').value, longRunDay: +f.querySelector('#longRunDay').value,
    goalDist: +f.querySelector('#goalDist').value, goalDate: f.querySelector('#goalDate').value || '', goalTime: f.querySelector('#goalTime').value.trim(),
  };
  const P = st.M.P, mx = S.maxHR || P.auto.max, rs = S.restHR || P.auto.rest, lt = S.lthr || P.auto.lthr;
  if (mx <= rs + 40) return toast('최대 심박은 안정 심박보다 40 이상 높아야 해요');
  if (lt >= mx || lt <= rs) return toast('젖산역치 심박은 안정 심박과 최대 심박 사이여야 해요');
  if (S.goalTime && !parseGoalTime(S.goalTime)) return toast('목표 기록은 50.00(50분)이나 3.59.00(3시간 59분)처럼 적어 주세요');
  if (S.goalTime) S.goalTime = fmtDur(parseGoalTime(S.goalTime));
  if (S.goalDist && !S.goalDate) return toast('대회 날짜도 입력해 주세요');
  st.settings = S; LS.set('settings', S); DB.set('settings', S);
  recompute();
  const now = new Date(); st.savedAt = timeKo(now.getTime() / 1000, -now.getTimezoneOffset() * 60);
  render(true); toast('저장했어요. 새 설정으로 다시 분석했어요');
}
document.addEventListener('input', e => { if (e.target.closest && e.target.closest('#settings-form') && /^(maxHR|restHR|lthr)$/.test(e.target.id)) zonePreview(); });

async function doImport(files) {
  files = Array.from(files || []); if (!files.length) return;
  st.importError = null; st.confirmDelete = false;
  st.importing = { p: 0, text: '파일 여는 중…' };
  st.scroll[st.view] = window.scrollY; if (st.view !== 'import') st.back.push(st.view); st.view = 'import'; render();
  let wake = null;
  try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) { wake = null; }
  const t0 = Date.now();
  const prev = st.data && !isDemo() ? st.data : null;
  // a run counts as new only if nothing started within 90 s of it before (two sources can differ by a second)
  const prevMin = new Set(); if (prev) for (const r of prev.runs) { const k = Math.round(r.start / 60); prevMin.add(k - 1); prevMin.add(k); prevMin.add(k + 1); }
  try {
    const data = await importFiles(files, updateProgress, prev);
    const info = data.lastImport || {};
    if (!data.runs.length) throw new UserError(info.hae && !info.full ? '러닝 기록이 없어요. SOOM 폴더에서 \'SOOM 운동\'으로 시작하는 파일도 함께 골라 주세요.' : '러닝 기록을 찾지 못했어요. 애플워치 운동 앱의 \'실외 달리기\'·\'실내 달리기\'로 기록한 러닝만 분석할 수 있어요.');
    st.data = data;
    st.saved = await DB.set('data', cleanData(data));
    recompute();
    st.newIds = prev ? data.runs.filter(r => !prevMin.has(Math.round(r.start / 60))).map(r => r.id) : [];
    LS.set('newIds', st.newIds);
    st.importing = null; st.back = []; st.view = 'today'; st.scroll = {}; render();
    const secs = Math.max(1, Math.round((Date.now() - t0) / 1000));
    const n = st.newIds.length;
    toast(!prev ? '러닝 ' + data.runs.length + '회를 분석했어요 (' + secs + '초)'
      : n ? '새 러닝 ' + n + '개를 반영했어요' + (info.recChanged ? ' · 회복 기록도 최신으로 바꿨어요' : '')
      : info.recChanged ? '새 러닝은 없어요. 수면·회복 기록을 최신으로 반영했어요'
      : '새로 추가된 러닝은 없어요. 최신 상태예요');
  } catch (err) {
    if (!(err && err.user)) console.error(err);
    st.importing = null;
    st.importError = err && err.user ? err.message : (err && (err.name === 'RangeError' || /memory/i.test(String(err.message))) ? '기기 메모리가 부족해요. 다른 앱을 닫고 다시 시도해 주세요.' : '파일을 읽는 중 문제가 생겼어요: ' + (err && err.message));
    render();
  } finally { try { if (wake) wake.release(); } catch (e) { /* ignore */ } }
}
function updateProgress(pr) {
  const map = { open: ['파일 여는 중…', 0, 0.02], xml: ['건강 기록 읽는 중', 0.02, 0.76], sort: ['운동별로 정리하는 중…', 0.76, 0.79], routes: ['러닝 경로·구간 분석 중', 0.79, 0.99],
    hae: ['자동 내보내기 파일 읽는 중', 0.02, 0.95], done: ['마무리 중…', 0.99, 1] };
  const m = map[pr.stage] || ['처리 중', 0, 1];
  const p = m[1] + (m[2] - m[1]) * (pr.p || 0);
  st.importing = { p, text: m[0] + (pr.stage === 'xml' || pr.stage === 'routes' || pr.stage === 'hae' ? ' · ' + Math.round((pr.p || 0) * 100) + '%' : '') };
  const bar = $('#imp-bar'), stg = $('#imp-stage');
  if (bar) bar.style.width = Math.round(p * 100) + '%';
  if (stg) stg.textContent = st.importing.text;
}
$('#file-health').addEventListener('change', e => { const fs = Array.from(e.target.files || []); e.target.value = ''; if (fs.length) doImport(fs); });
$('#file-backup').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const obj = JSON.parse(await f.text());
    const data = obj && obj.data ? obj.data : obj;
    if (!data || !Array.isArray(data.runs) || !data.days) throw new Error('format');
    st.data = data;
    if (obj.settings) { st.settings = obj.settings; LS.set('settings', st.settings); DB.set('settings', st.settings); }
    st.saved = await DB.set('data', cleanData(data));
    recompute(); st.importError = null; st.back = []; st.view = 'today'; render();
    toast('백업에서 러닝 ' + data.runs.length + '회를 복원했어요');
  } catch (err) { st.importError = '백업 파일을 읽지 못했어요. 이 도구에서 저장한 .json 파일인지 확인해 주세요.'; render(true); }
});

async function setupDownloads() {
  if (TARGET === 'web') { st.dl = { save: webSave }; return; }
  try { if (window.claude && typeof window.claude.use === 'function') { st.dl = await window.claude.use('downloads'); if (st.view === 'import') render(true); } }
  catch (e) { st.dl = null; }
}
// home-screen app: hand the file to the iPhone share sheet ('파일에 저장'), or download it on a computer
async function webSave({ filename, data }) {
  const file = new File([data], filename, { type: data.type || 'application/octet-stream' });
  if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return; }
    catch (e) { if (e && e.name === 'AbortError') { const x = new Error('declined'); x.code = 'declined'; throw x; } }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
async function doBackup() {
  if (!st.dl) { toast('이 화면에서는 파일 저장을 지원하지 않아요'); return; }
  const payload = JSON.stringify({ app: 'running-lab', v: 1, savedAt: Math.round(nowUtc()), settings: st.settings, data: cleanData(st.data) });
  try {
    await st.dl.save({ filename: 'soom-backup-' + dayISO(st.M.today) + '.json', data: new Blob([payload], { type: 'application/json' }) });
    toast('백업 파일을 저장했어요');
  } catch (err) {
    if (err && err.code === 'declined') return;
    toast(err && err.code === 'rate_limited' ? '잠시 후 다시 시도해 주세요' : '백업 파일을 저장하지 못했어요');
  }
}
async function doDelete() {
  await DB.del('data'); await DB.del('settings'); LS.del('settings'); LS.del('newIds'); st.newIds = [];
  st.settings = {}; st.saved = false; st.confirmDelete = false;
  st.data = await makeDemoData(); recompute();
  st.back = []; st.view = 'today'; st.scroll = {}; render(); toast('모든 데이터를 지웠어요');
}

let rz;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (window.innerWidth !== st.lastW) { st.lastW = window.innerWidth; render(true); } }, 200); });

async function boot() {
  st.lastW = window.innerWidth;
  st.settings = LS.get('settings') || (await DB.get('settings')) || {};
  st.newIds = LS.get('newIds') || [];
  const saved = await DB.get('data');
  if (saved && Array.isArray(saved.runs) && saved.runs.length) { st.data = saved; st.saved = true; }
  else st.data = await makeDemoData();
  try { recompute(); } catch (e) { console.error(e); st.data = await makeDemoData(); recompute(); }
  const h = (location.hash || '').replace('#', '');
  if (TAB_VIEWS.includes(h)) st.view = h;
  render();
  setupDownloads();
  if (TARGET === 'web') {
    // keep the stored records from being cleared when the phone runs low on space, and make the app open offline
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* not supported */ }
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
    setTimeout(checkUpdate, 2500);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
  }
}
// a home-screen app often comes back without reloading; when a newer SOOM is online, load it (once per version)
async function checkUpdate() {
  try {
    if (st.importing || $('#sheet-root').innerHTML || document.querySelector('.mapfull')) return;
    const r = await fetch('version.json', { cache: 'no-store' }); if (!r.ok) return;
    const v = (await r.json()).v; if (!v || v === APP_VERSION) return;
    let tried = null; try { tried = sessionStorage.getItem('soom:reloadFor'); } catch (e) { /* storage blocked */ }
    if (tried === v) return;
    try { sessionStorage.setItem('soom:reloadFor', v); } catch (e) { /* storage blocked */ }
    location.reload();
  } catch (e) { /* offline */ }
}
boot();
