<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOOM</title>
<meta name="description" content="애플워치·아이폰 건강 데이터로 만드는 개인 러닝 분석">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0e13" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SOOM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>/* Layout: one phone-width column (max 720px), sticky top bar + fixed bottom tab bar; cards only where an element is a separate object. */
:root {
  --bg: #f3f4f8;
  --surface: #ffffff;
  --surface-2: #eceef4;
  --ink: #12141b;
  --ink-2: #464b5a;
  --muted: #777c8d;
  --line: #e1e4ec;
  --accent: #3b39d1;
  --accent-ink: #ffffff;
  --accent-soft: #e9e9fb;
  --track: #c8553d;
  --lane: #ffffff;
  --z1: #a1a8b6; --z2: #3a8ad3; --z3: #1aa56d; --z4: #ee9d24; --z5: #e2484c;
  --good: #15803d; --good-soft: #e3f4e8;
  --warn: #b45309; --warn-soft: #fcf0dc;
  --bad: #c62828; --bad-soft: #fbe5e5;
  --g-red: #e2484c; --g-orange: #ee9d24; --g-green: #1aa56d; --g-blue: #3a8ad3; --g-purple: #7c4ddb;
  --sleep-deep: #3330a8; --sleep-core: #6f7ce8; --sleep-rem: #4fb7e8; --sleep-awake: #f1a33c;
  --s1: #3b39d1; --s2: #ee9d24; --s3: #1aa56d; --s4: #d1376f;
  --shadow: 0 1px 2px rgba(18, 20, 27, .05), 0 8px 24px rgba(18, 20, 27, .05);
  --font-ui: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
  --font-num: "Barlow Condensed", "SF Pro Display", "Arial Narrow", -apple-system, system-ui, sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0e13; --surface: #16181f; --surface-2: #1f222c; --ink: #eceef4; --ink-2: #b9bdcb; --muted: #8b90a2; --line: #282b37;
    --accent: #8f8dff; --accent-ink: #12122e; --accent-soft: #24244a; --track: #d9694f; --lane: #16181f;
    --z1: #737b8c; --z2: #4f9be0; --z3: #2dba80; --z4: #f2ad45; --z5: #ee5d62;
    --good: #4ade80; --good-soft: #13291b; --warn: #fbbf24; --warn-soft: #2e2410; --bad: #f87171; --bad-soft: #321718;
    --g-red: #ee5d62; --g-orange: #f2ad45; --g-green: #2dba80; --g-blue: #4f9be0; --g-purple: #a07cf0;
    --sleep-deep: #6b67e8; --sleep-core: #8d97f0; --sleep-rem: #63c3ef; --sleep-awake: #f2ad45;
    --s1: #9085e9; --s2: #d95926; --s3: #199e70; --s4: #e56b9b;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0e13; --surface: #16181f; --surface-2: #1f222c; --ink: #eceef4; --ink-2: #b9bdcb; --muted: #8b90a2; --line: #282b37;
  --accent: #8f8dff; --accent-ink: #12122e; --accent-soft: #24244a; --track: #d9694f; --lane: #16181f;
  --z1: #737b8c; --z2: #4f9be0; --z3: #2dba80; --z4: #f2ad45; --z5: #ee5d62;
  --good: #4ade80; --good-soft: #13291b; --warn: #fbbf24; --warn-soft: #2e2410; --bad: #f87171; --bad-soft: #321718;
  --g-red: #ee5d62; --g-orange: #f2ad45; --g-green: #2dba80; --g-blue: #4f9be0; --g-purple: #a07cf0;
  --sleep-deep: #6b67e8; --sleep-core: #8d97f0; --sleep-rem: #63c3ef; --sleep-awake: #f2ad45;
  --s1: #9085e9; --s2: #d95926; --s3: #199e70; --s4: #e56b9b;
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.num { font-family: var(--font-num); font-weight: 600; letter-spacing: .01em; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: 13px; }
.xs { font-size: 12px; }

#app { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand b { font-size: 17px; font-weight: 700; letter-spacing: .16em; }
.brand svg { flex: none; }
.top-actions { display: flex; gap: 6px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; height: 36px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.round { width: 36px; padding: 0; justify-content: center; }

/* bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); }
.tab { background: none; border: 0; padding: 8px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }

/* banners & toast */
.banner { display: flex; align-items: center; gap: 10px; justify-content: space-between; background: var(--accent-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
.banner b { color: var(--accent); }
.banner .btn { flex: none; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-size: 14px; z-index: 60; width: max-content; max-width: calc(100% - 32px); text-align: center; box-shadow: var(--shadow); }

/* page scaffolding */
.view { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.view > * { min-width: 0; }
.page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-top: 4px; }
.page-head h1 { font-size: 26px; letter-spacing: -.02em; }
.page-sub { color: var(--muted); font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card.accent { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-head h2 { font-size: 16px; letter-spacing: -.01em; display: flex; align-items: center; gap: 6px; }
.eyebrow { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.section-title { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .03em; margin: 6px 2px -4px; }
.info { border: 0; background: var(--surface-2); color: var(--muted); width: 22px; height: 22px; border-radius: 50%; font-size: 13px; font-weight: 700; line-height: 22px; padding: 0; flex: none; }
.link { background: none; border: 0; color: var(--accent); font-size: 14px; padding: 4px 0; font-weight: 600; }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 11px 16px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.secondary { background: var(--surface-2); color: var(--ink); }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.small { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 380px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.divider { height: 1px; background: var(--line); margin: 12px 0; }

/* stats */
.stat { min-width: 0; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .k .info { width: 18px; height: 18px; line-height: 18px; font-size: 11px; margin-left: 3px; vertical-align: 1px; }
.stat .v { font-family: var(--font-num); font-weight: 600; font-size: 28px; line-height: 1.1; letter-spacing: .005em; }
.stat .v small { font-family: var(--font-ui); font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
.stat .s { font-size: 12px; color: var(--ink-2); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); text-align: left; min-width: 0; }
button.tile { width: 100%; }
.hero-v { font-family: var(--font-num); font-weight: 700; font-size: 56px; line-height: 1; letter-spacing: -.005em; }

/* chips & pills */
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 9px 3px 8px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 700; }
.pill svg { width: 14px; height: 14px; }
.tone-good { background: var(--good-soft); color: var(--good); }
.tone-ok { background: var(--accent-soft); color: var(--accent); }
.tone-warn { background: var(--warn-soft); color: var(--warn); }
.tone-bad { background: var(--bad-soft); color: var(--bad); }
.tone-muted { background: var(--surface-2); color: var(--muted); }
.tone-info { background: var(--surface-2); color: var(--ink-2); }

/* readiness */
.ready { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 14px; align-items: center; }
@media (max-width: 400px) { .ready { grid-template-columns: 136px minmax(0, 1fr); gap: 12px; } }
.oval { position: relative; width: 100%; }
.oval svg { width: 100%; height: auto; display: block; }
.oval .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.oval .c .num { font-size: 44px; font-weight: 700; line-height: .95; }
.oval .c span { font-size: 12px; font-weight: 700; }
.factors { display: grid; gap: 6px; margin-top: 10px; }
.factor { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: 12px; }
.factor .bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.factor .bar b { display: block; height: 100%; border-radius: 999px; }
.factor .val { color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }

/* workout card */
.wk-title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.wk-purpose { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.adjust { margin-top: 10px; font-size: 13px; padding: 8px 10px; border-radius: 10px; }
.steps { margin-top: 12px; display: grid; gap: 0; border-top: 1px solid var(--line); }
.step { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.step .dot { width: 10px; height: 10px; border-radius: 3px; margin-top: 6px; }
.step .lbl { font-weight: 600; font-size: 14px; }
.step .sub { font-size: 12px; color: var(--muted); }
.step .amt { font-family: var(--font-num); font-size: 20px; font-weight: 600; text-align: right; line-height: 1.2; white-space: nowrap; }
.step .tgt { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.set-box { border-left: 2px solid var(--line); padding-left: 10px; margin-top: 4px; display: grid; gap: 2px; }
.totals { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
.totals b { font-family: var(--font-num); font-size: 18px; color: var(--ink); font-weight: 600; margin-right: 2px; }
details.fold { margin-top: 12px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
details.fold summary { font-weight: 600; font-size: 14px; cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; }
details.fold summary::-webkit-details-marker { display: none; }
details.fold summary::after { content: "펼치기"; font-size: 12px; color: var(--accent); font-weight: 600; flex: none; margin-left: 10px; }
details.fold[open] summary::after { content: "접기"; }
details.fold ol { margin: 8px 0 0; padding-left: 20px; font-size: 13px; color: var(--ink-2); display: grid; gap: 4px; }
details.fold ol.steps-guide { padding-left: 0; gap: 12px; }
details.fold + details.fold { margin-top: 8px; }
.setlist { display: grid; margin-top: 8px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.setlist div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 6px 10px; font-size: 13px; border-bottom: 1px solid var(--line); }
.setlist div:last-child { border-bottom: 0; }
.setlist span { color: var(--ink-2); min-width: 0; overflow-wrap: anywhere; }
.setlist span small { display: block; font-size: 11px; color: var(--muted); }
.steps-guide .en { font-size: 12px; color: var(--muted); margin-left: 2px; }
.metric-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.metric-list > .xs { grid-column: 1 / -1; }
.metric-list .mi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 13px; color: var(--ink); line-height: 1.3; }
.metric-list .mi small { display: block; font-size: 10.5px; color: var(--muted); overflow-wrap: anywhere; }
.setlist b { color: var(--ink); font-weight: 700; text-align: right; flex: none; }

/* week strip */
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(84px, 1fr); gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; margin: 0 -2px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: left; scroll-snap-align: start; min-width: 0; display: grid; gap: 4px; }
.day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.day .dw { font-size: 12px; color: var(--muted); }
.day .dn { font-size: 13px; font-weight: 700; line-height: 1.3; min-height: 34px; }
.day .dk { font-family: var(--font-num); font-size: 18px; font-weight: 600; }
.day .bar { height: 4px; border-radius: 999px; }

/* lists */
.list { display: grid; }
.li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; }
.li:last-child { border-bottom: 0; }
.li .t { font-weight: 600; font-size: 14px; }
.li .m { font-size: 12px; color: var(--muted); }
.run-row { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.run-row .date { text-align: center; line-height: 1.1; }
.run-row .date b { display: block; font-family: var(--font-num); font-size: 22px; font-weight: 600; }
.run-row .date span { font-size: 11px; color: var(--muted); }
.run-row .main { min-width: 0; }
.run-row .main .l1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.run-row .main .l1 .num { font-size: 20px; }
.run-row .main .l2 { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.run-row .te { text-align: right; font-size: 11px; color: var(--muted); }
.run-row .te b { display: block; font-family: var(--font-num); font-size: 18px; color: var(--ink); font-weight: 600; }
.month-head { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 2px 4px; font-size: 13px; color: var(--muted); }
.month-head b { color: var(--ink); font-size: 15px; }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.filter { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; white-space: nowrap; }
.filter[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* tables */
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: right; font-weight: 600; color: var(--muted); font-size: 12px; padding: 6px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { text-align: right; padding: 7px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.l { text-align: left; white-space: normal; }
.tbl .best { color: var(--accent); font-weight: 700; }

/* bars, meters, gauges */
.hbar { display: grid; grid-template-columns: 84px minmax(0, 1fr) 86px; gap: 10px; align-items: center; font-size: 13px; padding: 4px 0; }
.hbar .track { height: 10px; border-radius: 999px; background: var(--surface-2); position: relative; overflow: hidden; }
.hbar .track b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; }
.hbar.has-tgt .track { height: 16px; border-radius: 6px; }
.hbar.has-tgt .track b { top: 4px; bottom: 4px; }
.hbar .track .tgt { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--good) 22%, transparent); border-left: 2px solid color-mix(in srgb, var(--good) 70%, transparent); border-right: 2px solid color-mix(in srgb, var(--good) 70%, transparent); }
.hbar .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.stack { display: flex; height: 14px; border-radius: 999px; overflow: hidden; gap: 2px; background: var(--surface); }
.stack b { display: block; height: 100%; min-width: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend i.line { height: 2px; border-radius: 1px; width: 14px; }
.meter { position: relative; height: 12px; border-radius: 999px; background: var(--surface-2); margin: 22px 0 6px; }
.meter .rng { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--good) 22%, transparent); border-radius: 999px; }
.meter .cur { position: absolute; top: -4px; width: 4px; height: 20px; border-radius: 2px; background: var(--ink); transform: translateX(-2px); }
.meter .cur span { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 700; white-space: nowrap; }
.gauge { margin: 6px 0 14px; }
.gauge .gl { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
.gauge .gl b { font-family: var(--font-num); font-size: 20px; font-weight: 600; }
.gauge .gt { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; height: 8px; margin-top: 6px; position: relative; }
.gauge .gt i { display: block; border-radius: 2px; opacity: .8; }
.gauge .gt .mk { position: absolute; top: -5px; width: 4px; height: 18px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); transform: translateX(-2px); }
.gauge .gs { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }
.te { display: grid; gap: 10px; }
.te-row { display: grid; grid-template-columns: 70px minmax(0, 1fr) 96px; gap: 10px; align-items: center; font-size: 13px; }
.te-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.te-bar i { height: 10px; border-radius: 3px; background: var(--surface-2); position: relative; overflow: hidden; }
.te-bar i b { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.te-row .tv { text-align: right; }
.te-row .tv b { font-family: var(--font-num); font-size: 20px; font-weight: 600; margin-right: 4px; }

/* charts */
.chart { position: relative; width: 100%; user-select: none; -webkit-user-select: none; touch-action: pan-y; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font-family: var(--font-ui); font-size: 11px; fill: var(--muted); }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart text.zl { font-size: 10px; fill: var(--muted); font-weight: 600; }
a.btn { text-decoration: none; }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn.small { white-space: nowrap; }
.chart .tip { position: absolute; top: 0; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 16px rgba(0, 0, 0, .12); white-space: nowrap; z-index: 3; }
.chart .tip .tv { font-weight: 700; font-variant-numeric: tabular-nums; }
.chart .tip .tl { color: var(--muted); }
.chart .tip i { display: inline-block; width: 10px; height: 2px; vertical-align: middle; margin-right: 5px; border-radius: 1px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; overflow-x: auto; max-width: 100%; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 8px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.tblv { margin-top: 10px; max-height: 280px; overflow: auto; }
.route { width: 100%; aspect-ratio: 4 / 3; max-width: 100%; background: var(--surface-2); border-radius: 12px; overflow: hidden; }
.route svg { width: 100%; height: 100%; display: block; }
.cal { display: grid; grid-template-columns: 22px repeat(var(--cols), minmax(0, 1fr)); gap: 3px; font-size: 10px; color: var(--muted); }
.cal i { aspect-ratio: 1; border-radius: 3px; background: var(--surface-2); display: block; }

/* insights */
.ins { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ins:last-child { border-bottom: 0; }
.ins .ic { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.ins .ic svg { width: 16px; height: 16px; }
.ins b { font-size: 14px; }
.ins p { font-size: 13px; color: var(--ink-2); }

/* sheets & forms */
.sheet-bg { position: fixed; inset: 0; background: rgba(8, 9, 14, .45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 720px; max-height: 86vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px)); }
.sheet h3 { font-size: 19px; margin-bottom: 8px; }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: -6px auto 12px; }
.sheet p { color: var(--ink-2); font-size: 15px; margin-bottom: 10px; }
.sheet .how { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--ink-2); margin-bottom: 10px; }
.field { display: grid; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.field:last-child { border-bottom: 0; }
.field label { font-weight: 600; font-size: 14px; }
.field .hint { font-size: 12px; color: var(--muted); }
.field input, .field select { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 10px; width: 100%; font-size: 16px; }
.field.inline { grid-template-columns: minmax(0, 1fr) 140px; align-items: center; }
.field.inline .hint { grid-column: 1 / -1; }
#settings-form[data-goal="0"] .goal-only { display: none; }
.date-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.date-row .link { font-size: 13px; white-space: nowrap; }
.segctl { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.segctl button { border: 0; background: transparent; border-radius: 8px; padding: 7px 4px; font-size: 13px; }
.segctl button { color: var(--ink-2); }
.segctl button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.zone-prev { padding: 4px 0 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.zp-base { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.zp-base i { font-style: normal; font-size: 10.5px; color: var(--muted); margin-left: 2px; }
.zp-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.zp { border-top: 3px solid var(--zc); background: var(--surface-2); border-radius: 0 0 8px 8px; padding: 5px 4px; font-size: 11.5px; text-align: center; font-variant-numeric: tabular-nums; color: var(--ink); }
.zp b { display: block; font-size: 10.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.steps-guide { counter-reset: s; display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.steps-guide li { counter-increment: s; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; font-size: 14px; }
.steps-guide li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: flex; align-items: center; justify-content: center; font-family: var(--font-num); font-size: 16px; }
.progress { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin: 10px 0 6px; }
.progress b { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.back { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 15px; padding: 4px 0; }
.back svg { width: 18px; height: 18px; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px 10px; }
.empty { text-align: center; padding: 30px 10px; color: var(--muted); font-size: 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* post-run report layout */
.sync { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.sync-t { display: grid; min-width: 0; }
.sync-t b { font-size: 14px; }
.sync-t span { font-size: 12px; color: var(--muted); }
.hero-v .unit { font-family: var(--font-ui); font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.rec-row { display: grid; grid-template-columns: minmax(0, 1fr) 132px; gap: 12px; align-items: center; }
.mini-oval .oval .c .num { font-size: 34px; }
.mini-oval .oval .c span { font-size: 11px; }
details.more { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
details.more summary { font-size: 13px; color: var(--ink-2); cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: "보기"; color: var(--accent); font-weight: 600; font-size: 12px; }
details.more[open] summary::after { content: "접기"; }

/* maps (home-screen web app): the route on a real map, coloured by pace */
.map { position: relative; z-index: 0; width: 100%; max-width: 100%; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: var(--surface-2); cursor: pointer; }
.map-hero { aspect-ratio: 16 / 9; margin: 8px 0 4px; }
.leaflet-container { font-family: var(--font-ui); background: var(--surface-2); outline: none; }
.leaflet-container .leaflet-control-attribution { font-size: 9.5px; line-height: 1.5; padding: 0 6px; border-radius: 6px 0 0 0; background: color-mix(in srgb, var(--surface) 80%, transparent); color: var(--muted); }
.leaflet-container .leaflet-control-attribution a { color: var(--ink-2); }
.leaflet-bar a { background: var(--surface); color: var(--ink); border-color: var(--line); }
.pace-legend { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
.pl-scale { flex: 1 1 230px; min-width: 0; display: flex; align-items: center; gap: 8px; }
.pl-pts { display: flex; gap: 12px; flex: none; }
.pl-bar { flex: 1 1 70px; min-width: 50px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, rgb(255, 59, 48), rgb(255, 204, 0), rgb(52, 199, 89)); }
.pl-end { white-space: nowrap; }
.pl-end b { font-family: var(--font-num); font-size: 15px; font-weight: 600; color: var(--ink); }
.pl-pt { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.pl-pt i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--line); }
.pl-pt i.sq { border-radius: 2px; }
.end-mark { background: #12141b; border: 3px solid #ffffff; border-radius: 4px; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
.mapfull { position: fixed; inset: 0; z-index: 80; background: var(--surface-2); }
.mapfull-map { position: absolute; inset: 0; z-index: 0; }
.mapfull-top, .mapfull-bottom { position: absolute; z-index: 1; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-radius: 14px; box-shadow: 0 2px 14px rgba(0, 0, 0, .14); }
.mapfull-top { top: calc(10px + env(safe-area-inset-top, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 10px 10px 14px; }
.mapfull-t { display: grid; min-width: 0; }
.mapfull-t b { font-size: 15px; }
.mapfull-t span { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.mapfull-bottom { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding: 0 14px 10px; }
.mapfull .leaflet-bottom { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
.mapfull .leaflet-top { top: calc(80px + env(safe-area-inset-top, 0px)); }

/* running shoes */
.shoe-uses { display: flex; flex-wrap: wrap; gap: 6px; }
.shoe-km { display: flex; align-items: baseline; gap: 6px; margin-top: 10px; font-variant-numeric: tabular-nums; }
.shoe-km b { font-family: var(--font-num); font-size: 40px; font-weight: 700; line-height: 1; }
.shoe-km span { font-size: 15px; color: var(--ink-2); }
.shoe-km em { font-style: normal; font-size: 14px; color: var(--muted); }
.shoe-km i { margin-left: auto; font-style: normal; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 3px 9px; }
.shoe-bar { position: relative; height: 10px; border-radius: 5px; background: var(--surface-2); margin-top: 8px; overflow: hidden; }
.shoe-bar b { position: absolute; inset: 0 auto 0 0; border-radius: 5px; }
.shoe-bar span { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--surface); opacity: .9; }
.bg-good { background: var(--good); } .bg-warn { background: var(--warn); } .bg-bad { background: var(--bad); }
.empty-shoe { text-align: center; padding: 12px 6px; display: grid; gap: 6px; justify-items: center; }
.empty-shoe svg { width: 44px; height: 44px; color: var(--muted); }
.usechips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.usechip { border: 1px solid var(--line); background: var(--bg); color: var(--ink-2); border-radius: 10px; padding: 8px 4px; font-size: 13px; font-weight: 600; line-height: 1.25; }
.usechip small { display: block; font-size: 10.5px; font-weight: 400; color: var(--muted); }
.usechip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.usechip[aria-pressed="true"] small { color: var(--accent-ink); opacity: .85; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 12px 0 2px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.shoe-alert { width: 100%; text-align: left; margin-top: 10px; cursor: pointer; color: inherit; font: inherit; }
.shoe-alert b { display: flex; align-items: center; gap: 6px; }
.shoe-alert b svg { width: 18px; height: 18px; flex: none; }
.page-head .btn svg { width: 15px; height: 15px; }
.map-note { position: absolute; z-index: 500; left: 10px; right: 10px; top: 10px; background: color-mix(in srgb, var(--surface) 92%, transparent); color: var(--ink-2); font-size: 12px; border-radius: 10px; padding: 8px 10px; text-align: center; }
.banner a { color: inherit; }

/* dark screens: OpenStreetMap pictures turned into a dark map (the route itself keeps its colours) */
.dark-tiles .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.55); }
.kakao-dark img[src*="daumcdn"] { filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.55); }
.start-mark { width: 16px; height: 16px; border-radius: 50%; background: #34c759; border: 3px solid #ffffff; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
#settings-form[data-map="osm"] .kakao-only { display: none; }
.codebox { display: block; margin-top: 6px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--ink); user-select: all; -webkit-user-select: all; overflow-wrap: anywhere; }

/* weather */
:root { --wx-sun: #f2a516; --wx-moon: #8d93c0; --wx-cloud: #e4e8f0; --wx-edge: #98a0b3; --wx-rain: #2f7fd0; --wx-snow: #8ab8e6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --wx-sun: #fbbf24; --wx-moon: #a5abd6; --wx-cloud: #3a3f4d; --wx-edge: #8b90a2; --wx-rain: #5aa5ec; --wx-snow: #9cc6ef; } }
:root[data-theme="dark"] { --wx-sun: #fbbf24; --wx-moon: #a5abd6; --wx-cloud: #3a3f4d; --wx-edge: #8b90a2; --wx-rain: #5aa5ec; --wx-snow: #9cc6ef; }
.wxi { width: 22px; height: 22px; flex: none; display: inline-block; vertical-align: middle; overflow: visible; }
.wxi .ws { fill: var(--wx-sun); }
.wxi .wr { fill: none; stroke: var(--wx-sun); stroke-width: 1.8; stroke-linecap: round; }
.wxi .wm { fill: var(--wx-moon); }
.wxi .wc { fill: var(--wx-cloud); stroke: var(--wx-edge); stroke-width: 1.3; stroke-linejoin: round; }
.wxi .wl { fill: none; stroke: var(--wx-edge); stroke-width: 1.8; stroke-linecap: round; }
.wxi .wp { fill: none; stroke: var(--wx-rain); stroke-width: 2; stroke-linecap: round; }
.wxi .wd circle { fill: var(--wx-rain); }
.wxi .wn circle { fill: var(--wx-snow); }
.wxi .wb { fill: var(--wx-sun); }
.wxi.wx-big { width: 46px; height: 46px; }
.wx-now { display: flex; align-items: center; gap: 12px; min-width: 0; }
.wx-t { font-size: 44px; line-height: 1; flex: none; }
.wx-desc { display: grid; font-size: 13px; color: var(--ink-2); min-width: 0; }
.wx-desc b { font-size: 15px; color: var(--ink); }
.wx-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.wx-pm { font-size: 12px; padding: 3px 9px; }
.wx-best { margin-top: 12px; display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); }
.wx-best b { font-size: 17px; color: var(--accent); }
.wx-hours { display: grid; grid-auto-flow: column; grid-auto-columns: 48px; gap: 4px; overflow-x: auto; margin: 12px -4px 0; padding: 2px 4px 6px; scroll-snap-type: x proximity; }
.wh { display: grid; justify-items: center; gap: 2px; padding: 6px 0; border-radius: 10px; border: 1px solid transparent; scroll-snap-align: start; }
.wh .h { font-size: 11px; color: var(--muted); white-space: nowrap; }
.wh b { font-size: 14px; font-weight: 600; }
.wh .p { font-size: 10.5px; color: var(--wx-rain); min-height: 15px; font-weight: 600; }
.wh.best { border-color: var(--accent); background: var(--accent-soft); }
.wx-src { margin-top: 8px; }
.wx-src a { color: inherit; }
.dwx { display: flex; flex-wrap: wrap; align-items: center; gap: 0 3px; font-size: 12px; color: var(--ink-2); white-space: nowrap; min-width: 0; }
.dwx .wxi { width: 18px; height: 18px; }
.dwx small { color: var(--muted); font-size: 11px; }
.dwx em { font-style: normal; color: var(--wx-rain); font-weight: 600; font-size: 11px; }
.dwx-flag { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px; justify-self: start; white-space: nowrap; }
.wx-plan { margin-top: 10px; display: grid; }
.wx-pl-top { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }
.wx-pl-top .wxi { width: 28px; height: 28px; }
.wx-pl-top div { display: grid; min-width: 0; }
.wx-pl-top b { font-size: 14px; }
.wx-pl-top span { font-size: 12px; color: var(--ink-2); }
.wx-swap { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px dashed color-mix(in srgb, var(--warn) 55%, var(--line)); }
.wx-swap.done { border: 1px solid var(--line); }
.wx-swap .btn { flex: none; }
.wx-tag { display: inline-flex; align-items: center; gap: 2px; }
.wx-tag .wxi { width: 15px; height: 15px; }
.wx-status { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0 2px; }
.wx-status .link { flex: none; }
#settings-form[data-wx="off"] .wx-only { display: none; }

/* analysis period typed by the person */
.period-custom { padding: 2px 0 12px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.date-pair { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: end; margin-bottom: 6px; }
.date-pair label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; min-width: 0; }
.date-pair input { -webkit-appearance: none; appearance: none; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 8px; width: 100%; min-width: 0; min-height: 42px; font-size: 16px; color: var(--ink); }
.date-pair > span { padding-bottom: 11px; color: var(--muted); }

/* Health Auto Export free trial note */
.trial-box { display: grid; gap: 4px; margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--good-soft); font-size: 13px; color: var(--ink-2); }
.trial-box b { color: var(--good); font-size: 14px; }

/* sunrise / sunset */
.wx-sun { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
.wx-sun span { display: inline-flex; align-items: center; gap: 5px; }
.wx-sun b { color: var(--ink); font-weight: 600; }
.sunic { width: 20px; height: 20px; flex: none; }
.sunic .su { fill: none; stroke: var(--wx-sun); stroke-width: 1.9; stroke-linecap: round; }
.sunic .sr { fill: none; stroke: var(--wx-sun); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* one-line memo on a run */
.memo { position: relative; display: block; margin: -4px 0 12px; }
.memo input { width: 100%; border: 1px dashed var(--line); background: transparent; border-radius: 10px; padding: 9px 10px 9px 36px; font-size: 16px; color: var(--ink); }
.memo input::placeholder { color: var(--muted); }
.memo input:focus { border-style: solid; border-color: var(--accent); background: var(--surface); outline: none; }
.memo-ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); display: flex; pointer-events: none; }
.memo-ic svg { width: 17px; height: 17px; }
.memo-show { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); margin: 2px 0 4px; }
.memo-show svg { width: 14px; height: 14px; flex: none; color: var(--muted); }

// ---------- calendar math (day numbers = days since 1970-01-01, local calendar) ----------
function daysFromCivil(y, m, d) {
  y -= m <= 2 ? 1 : 0;
  const era = Math.floor(y / 400);
  const yoe = y - era * 400;
  const mp = m + (m > 2 ? -3 : 9);
  const doy = Math.floor((153 * mp + 2) / 5) + d - 1;

  const doy = doe - (365 * yoe + Math.floor(yoe / 4) - Math.floor(yoe / 100));
  const mp = Math.floor((5 * doy + 2) / 153);
  const d = doy - Math.floor((153 * mp + 2) / 5) + 1;

const WD = ['일', '월', '화', '수', '목', '금', '토'];

function num(v) { if (v === null || v === undefined || v === '') return NaN; const x = parseFloat(v); return x; }

function parseGPX(text) {
  const t = [], lat = [], lon = [], ele = [], spd = [], hacc = [];
  let i = 0;
  for (;;) {
    const a = text.indexOf('<trkpt', i); if (a < 0) break;
    let b = text.indexOf('</trkpt>', a); if (b < 0) b = text.length;
    const seg = text.substring(a, b); i = b + 8;
    const la = num(tagAttr(seg, ' lat="')), lo = num(tagAttr(seg, ' lon="'));
    const k = seg.indexOf('<time>'); if (k < 0 || !isNum(la) || !isNum(lo)) continue;
    const tt = parseISODate(seg.substring(k + 6, seg.indexOf('<', k + 6)));
    if (!isNum(tt)) continue;
    const ke = seg.indexOf('<ele>'), ks = seg.indexOf('<speed>'), kh = seg.indexOf('<hAcc>');
    t.push(tt); lat.push(la); lon.push(lo);
    ele.push(ke >= 0 ? num(seg.substring(ke + 5, seg.indexOf('<', ke + 5))) : NaN);
    spd.push(ks >= 0 ? num(seg.substring(ks + 7, seg.indexOf('<', ks + 7))) : NaN);
    hacc.push(kh >= 0 ? num(seg.substring(kh + 6, seg.indexOf('<', kh + 6))) : NaN);
  }
  if (t.length > 1) { // ensure time order
    let sorted = true; for (let j = 1; j < t.length; j++) if (t[j] < t[j - 1]) { sorted = false; break; }
    if (!sorted) {
      const idx = t.map((_, j) => j).sort((x, y) => t[x] - t[y]);
      const re = arr => idx.map(j => arr[j]);
      return { t: re(t), lat: re(lat), lon: re(lon), ele: re(ele), spd: re(spd), hacc: re(hacc) };
    }
  }
  return { t, lat, lon, ele, spd, hacc };
}

async function streamIntoParser(textStream, total, parser, onProgress) {
  const reader = textStream.getReader();
  let done = 0, last = Date.now();
  for (;;) {
    const r = await reader.read();
    if (r.done) break;
    parser.feed(r.value);
    done += r.value.length;
    if (Date.now() - last > 150) { onProgress(Math.min(0.995, done / Math.max(1, total))); await yieldUI(); last = Date.now(); }
  }
  parser.end();
}

// Read an export (zip or xml) entirely on this device. Returns the assembled data object.
async function importHealthFile(file, onProgress, prev) {
  onProgress = onProgress || (() => {});
  const head = new Uint8Array(await file.slice(0, 8).arrayBuffer());
  const isZip = head[0] === 0x50 && head[1] === 0x4b;
  const parser = new HealthParser();
  let routeReader = null;
  if (isZip) {
    onProgress({ stage: 'open', p: 0 });
    const entries = await readZipDirectory(file);
    const xmls = entries.filter(e => /\.xml$/i.test(e.name) && !/cda/i.test(e.name) && !/__MACOSX/.test(e.name)).sort((a, b) => b.uncomp - a.uncomp);
    if (!xmls.length) throw new UserError('ZIP 안에서 건강 기록(export.xml)을 찾지 못했어요. 건강 앱의 \'모든 건강 데이터 내보내기\'로 만든 파일인지 확인해 주세요.');
    const xe = xmls[0];
    await streamIntoParser(await zipEntryStream(file, xe), xe.uncomp, parser, p => onProgress({ stage: 'xml', p }));
    const gpx = new Map();
    for (const e of entries) if (/\.gpx$/i.test(e.name)) gpx.set(e.name.split('/').pop(), e);
    routeReader = async path => {
      const e = gpx.get(String(path).split('/').pop()); if (!e) return null;
      return parseGPX(await readAllText(await zipEntryStream(file, e)));
    };
  } else {
    const txt = new TextDecoder().decode(head);
    if (!/^\s*</.test(txt) && !/^﻿?</.test(txt)) throw new UserError('건강 앱에서 내보낸 ZIP 파일(또는 그 안의 export.xml)을 선택해 주세요.');
    await streamIntoParser(file.stream().pipeThrough(new TextDecoderStream()), file.size, parser, p => onProgress({ stage: 'xml', p }));
  }
  const raw = parser.finish();
  if (!raw.workouts.length && raw.hr.length === 0) throw new UserError('파일에서 운동이나 심박 기록을 찾지 못했어요. 건강 앱에서 내보낸 파일이 맞는지 확인해 주세요.');
  return assemble(raw, routeReader, onProgress, prev);
}

function spreadInc(inc, a, b, d) { // spread distance d over continuous seconds [a,b)
  const N = inc.length;
  if (b <= a) { const i = Math.floor(a); if (i >= 0 && i < N) inc[i] += d; return; }
  const per = d / (b - a);
  const i0 = Math.max(0, Math.floor(a)), i1 = Math.min(N - 1, Math.ceil(b) - 1);
  for (let s = i0; s <= i1; s++) { const ov = Math.min(b, s + 1) - Math.max(a, s); if (ov > 0) inc[s] += per * ov; }
}

function hrPerSecond(packed, T0, N) {
  const H = new Float32Array(N);

    ht.push(t); hv.push(b);

  if (!ht.length) return H;
  let j = 0;
  for (let s = 0; s < N; s++) {
    const tt = T0 + s;
    while (j + 1 < ht.length && ht[j + 1] <= tt) j++;
    if (ht[j] <= tt) {
      if (j + 1 < ht.length) {
        const g = ht[j + 1] - ht[j];
        if (g <= 45) H[s] = hv[j] + (hv[j + 1] - hv[j]) * (tt - ht[j]) / g;
        else if (tt - ht[j] <= 10) H[s] = hv[j];
        else if (ht[j + 1] - tt <= 10) H[s] = hv[j + 1];
      } else if (tt - ht[j] <= 10) H[s] = hv[j];
    } else if (ht[j] - tt <= 10) H[s] = hv[j];
  }

}

function fillFromSamples(arr, idxs, buf, T0, lo, hi, holdMax) {
  const S = buf.s.a, D = buf.d.a, V = buf.v.a, N = arr.length;
  for (let k = 0; k < idxs.length; k++) {
    const i = idxs[k], v = V[i];

    let b;

    else { const nx = k + 1 < idxs.length ? S[idxs[k + 1]] - T0 : a + holdMax; b = Math.min(nx, a + holdMax); if (b <= a) b = a + 1; }

function buildRun(w, hrPacked, stepIdx, distIdx, dynIdx, raw, route, coarse) {

    let ref = Em ? Em[0] : 0;
    const push = (t, d) => {

        pw: pn ? Math.round(ps / pn) : 0, gap: gd > 0 ? round(t / gd * 1000, 1) : 0, up: Math.round(gain), dn: Math.round(loss) });

  if (M >= 1200) { let acc = 0, n = 0; for (let j = 0; j < M; j++) { if (Hm[j] > 0) { acc += Hm[j]; n++; } if (j >= 1200) { const y = Hm[j - 1200]; if (y > 0) { acc -= y; n--; } } if (j >= 1199 && n >= 1080) hr20 = Math.max(hr20, acc / n); } }

    if (SLm) ser.sl.push(Math.round(blockMean(SLm, j0, j1, true) * 100));
    if (VOm) ser.vo.push(Math.round(blockMean(VOm, j0, j1, true) * 10));

function haeSleep(P, data) {

      const s = parseDateLoose(d.startDate), off = PD_off, e = parseDateLoose(d.endDate);
      const st = HAE_SLEEP[haeNorm(d.value)];
      if (st === undefined || !isNum(s) || !isNum(e) || e <= s) continue;
      const src = String(d.source || 'Health Auto Export');
      const key = s + '|' + e + '|' + st + '|' + src;
      if (P.sleepKeys) { if (P.sleepKeys.has(key)) continue; P.sleepKeys.add(key); }
      P.sleep.push([s, e, st, P.srcByName(src, /watch/i.test(src)), off]);
    } else if (isNum(d.totalSleep) || isNum(d.asleep) || isNum(d.core) || isNum(d.deep)) {
      const s = parseDateLoose(d.sleepStart || d.inBedStart || d.date), off = PD_off;
      const e = parseDateLoose(d.sleepEnd || d.inBedEnd || '');

      const asleep = h(d.totalSleep) || (deep + rem + core + h(d.asleep));
      const day = isNum(s) && d.sleepStart ? dayOfUtc(s + 6 * 3600, off) : isoToDay(String(d.date || '').slice(0, 10));
      if (!isNum(day)) continue;
      (P.sleepAgg || (P.sleepAgg = [])).push({ day, asleep, deep, rem, core, awake: h(d.awake), inbed: h(d.inBed), start: s, end: e, off, staged: deep + rem + core > 0 });

}

function haeWorkout(P, w, routes) {

  const start = parseDateLoose(w.start); const off = PD_off, day = PD_day;
  const end = parseDateLoose(w.end);

  const en = obj(w.activeEnergyBurned) || obj(w.activeEnergy);

  const hrd = Array.isArray(w.heartRateData) ? w.heartRateData : [];

    for (const p of w.route) {

      const la = isNum(p.latitude) ? p.latitude : p.lat, lo = isNum(p.longitude) ? p.longitude : p.lon;
      if (!isNum(t) || !isNum(la) || !isNum(lo)) continue;

      rt.ele.push(isNum(p.altitude) ? p.altitude : NaN); rt.spd.push(isNum(p.speed) ? p.speed : NaN); rt.hacc.push(isNum(p.horizontalAccuracy) ? p.horizontalAccuracy : NaN);

    src: String(w.source || 'Health Auto Export'), legacyDist: NaN, legacyEnergy: NaN, meta, stats, events: [], routes: routeId ? [routeId] : [],
    cadAvg: cad && isNum(cad.qty) ? cad.qty : null,
    hrRec: rec.map(d => [parseDateLoose(d.date), isNum(d.Avg) ? d.Avg : d.qty]).filter(x => isNum(x[0]) && isNum(x[1])),

}

function haeToRaw(objs) {
  const P = new HealthParser(), routes = {};
  P.sleepKeys = new Set();

// how complete a run's data is, so a thinner copy never replaces a richer one
function runQuality(r) { return (r.gps ? 2 : 0) + (r.hrCov || 0) * 2 + (r.cad ? 0.4 : 0) + (r.pw ? 0.3 : 0) + (r.sl ? 0.3 : 0) + (r.splits && r.splits.length ? 0.2 : 0); }

  const R = mergeList(base.runs, inc.runs, (r, ex) => runQuality(r) >= runQuality(ex) - 0.25);

    const a = (base.days || {})[k] || {}, b = (inc.days || {})[k] || {}, o = Object.assign({}, a);

      if (k === 'sleep' && a[d] && a[d].asleep > b[d].asleep + 600) continue;
      if (k === 'hrv' && a[d] && a[d][1] > b[d][1]) continue;

// one entry point for everything the person can pick: the Health app export (.zip/.xml) and/or Health Auto Export files (.json, or a .zip of them)
async function importFiles(files, onProgress, prev) {
  onProgress = onProgress || (() => {});
  files = Array.from(files || []);
  const full = [], hae = [];
  for (const f of files) {
    const head = new Uint8Array(await f.slice(0, 4).arrayBuffer());
    const nm = String(f.name || '').toLowerCase();
    if (head[0] === 0x50 && head[1] === 0x4b) {
      const entries = await readZipDirectory(f);
      if (entries.some(e => /\.xml$/i.test(e.name) && !/cda/i.test(e.name))) full.push(f);
      else if (entries.some(e => /\.json$/i.test(e.name))) hae.push({ file: f, entries: entries.filter(e => /\.json$/i.test(e.name) && !/__MACOSX/.test(e.name)) });
      else throw new UserError('\'' + f.name + '\' 안에서 건강 기록을 찾지 못했어요.');
    } else if (/\.csv$/.test(nm)) throw new UserError('CSV 파일이에요. Health Auto Export 자동화의 형식(Format)을 JSON으로 바꿔 주세요.');
    else if (/\.json$/.test(nm) || head[0] === 0x7b || head[0] === 0x5b || (head[0] === 0xef && head[3] === 0x7b)) hae.push({ file: f });
    else if (/\.xml$/.test(nm) || head[0] === 0x3c) full.push(f);
    else throw new UserError('\'' + f.name + '\'은(는) 읽을 수 없는 파일이에요. 건강 앱 내보내기 파일(.zip) 또는 Health Auto Export의 JSON 파일을 골라 주세요.');
  }
  const info = { full: full.length, hae: hae.length, runs: 0, recDays: 0, recChanged: 0 };
  let data = prev && prev.source !== 'demo' ? prev : null;
  for (const f of full) {
    const d = await importHealthFile(f, onProgress, data);
    if (data) { const m = mergeData(data, d); data = m.data; info.recChanged += m.recChanged; } else data = d;
  }
  if (hae.length) {
    onProgress({ stage: 'hae', p: 0 });
    const objs = []; let k = 0;
    for (const h of hae) {
      const big = h.entries ? h.entries.reduce((a, e) => a + e.uncomp, 0) : h.file.size;
      if (big > 250e6) throw new UserError('\'' + h.file.name + '\' 파일이 너무 커요 (' + Math.round(big / 1e6) + 'MB). Health Auto Export 자동화의 Date Range를 Week로 두고, 가장 최근 파일만 골라 주세요.');
      const texts = [];
      if (h.entries) for (const e of h.entries) texts.push(await readAllText(await zipEntryStream(h.file, e)));
      else texts.push(await h.file.text());
      for (const t of texts) {
        let o;
        try { o = JSON.parse(t.charCodeAt(0) === 0xfeff ? t.slice(1) : t); }
        catch (e) { throw new UserError('\'' + h.file.name + '\' 파일을 읽지 못했어요. Health Auto Export에서 JSON 형식으로 내보낸 파일인지 확인해 주세요.'); }
        if (o && o.app === 'running-lab') throw new UserError('\'' + h.file.name + '\'은(는) SOOM 백업 파일이에요. 데이터 화면의 \'백업 파일 불러오기\'로 열어 주세요.');
        objs.push(o);
      }
      onProgress({ stage: 'hae', p: ++k / hae.length * 0.5 });
      await yieldUI();
    }
    const { raw, routes } = haeToRaw(objs);
    if (!raw.workouts.length && !raw.hr.length && !raw.rhr.length && !raw.sleep.length && !raw.sleepAgg.length && !raw.hrv.length)
      throw new UserError('Health Auto Export 파일에 운동이나 건강 기록이 없어요. 자동화에서 Workouts와 Health Metrics를 골랐는지 확인해 주세요.');
    const inc = await assemble(raw, async id => routes[id] || null, p => onProgress({ stage: p.stage === 'routes' ? 'hae' : p.stage, p: p.stage === 'routes' ? 0.5 + p.p / 2 : p.p }), null);
    inc.source = 'hae';
    info.runs = inc.runs.length;
    info.recDays = new Set([...Object.keys(inc.days.sleep), ...Object.keys(inc.days.hrv), ...Object.keys(inc.days.rhr)]).size;
    for (const r of inc.runs) r.imp = 'hae'; // built from the app's files: rebuilt (not reused) when a full Health export arrives
    if (data) { const m = mergeData(data, inc); data = m.data; info.recChanged += m.recChanged; } else { data = inc; info.recChanged += info.recDays; }
  }
  if (!data) throw new UserError('가져올 파일이 없어요.');
  data.lastImport = info;
  return data;
}

// How much heat and wind slowed a run, the best time to run on a given day, and plain-language advice for the plan.
// Weather: Open-Meteo (CC BY 4.0). Air quality: CAMS through Open-Meteo. The temperature and humidity the Apple Watch
// saved with the workout come first when present; the rest (wind, rain, sky) comes from Open-Meteo.

    let all = null, yr = null;
    for (const r of runs) { const b = r.bests[Dm]; if (!b) continue; if (!all || b[0] < all.t) all = { t: b[0], id: r.id, day: r.day }; if (r.day > today - 365 && (!yr || b[0] < yr.t)) yr = { t: b[0], id: r.id, day: r.day }; }
    return { D: Dm, all, yr };
  }).filter(x => x.all);
  const prName = { 400: '400m', 1000: '1km', 1609.344: '1마일', 3000: '3km', 5000: '5km', 10000: '10km', 15000: '15km', 21097.5: '하프', 30000: '30km', 42195: '풀코스' };
  for (const p of prs) p.name = prName[p.D];
  // a run 'sets a record' when it beats every earlier run at that distance (progression, like Strava/Garmin PR badges)
  for (const r of runs) r.prs = [];
  for (const Dm of BEST_D) {
    let best = Infinity;
    for (const r of runs) { const b = r.bests[Dm]; if (!b) continue; if (b[0] < best) { if (best < Infinity) r.prs.push(prName[Dm]); best = b[0]; } }
  }

  // distance-band strengths (relative to overall level), last 12 weeks
  let abilities = null;
  if (isNum(level)) {
    const bands = [['스피드', '1–1.6km', [1000, 1609.344]], ['중거리', '3–5km', [3000, 5000]], ['장거리', '10–15km', [10000, 15000]], ['지구력', '하프 이상', [21097.5, 30000, 42195]]];
    abilities = bands.map(([name, sub, ds]) => {
      let best = NaN;
      for (const r of runs) { if (r.day <= ref - 84 || r.day > ref) continue; for (const Dm of ds) { const b = r.bests[Dm]; if (!b) continue; const v = vdotFromRace(Dm, b[0]) - 0.03 * (ref - r.day); if (!(best >= v)) best = v; } }
      return { name, sub, vdot: isNum(best) ? round(best, 1) : null, pct: isNum(best) ? Math.round(clamp(best / level * 100, 40, 115)) : null };
    });
  }

  // fitness age (VO2max vs age/sex medians)
  const vo2ForAge = isNum(appleVO2) ? appleVO2 : isNum(levelHR) ? levelHR : level;
  let fitAge = null;
  if (isNum(vo2ForAge) && P.ageKnown) fitAge = Math.round(clamp(female ? (46.0 - vo2ForAge) / 0.30 : (54.0 - vo2ForAge) / 0.32, 18, 85));

  // critical power (if Apple running power exists)
  let cp = null;
  const pr90 = runs.filter(r => r.day > ref - 90 && r.day <= ref && r.p3 > 0);
  if (pr90.length) {
    const P3 = Math.max(...pr90.map(r => r.p3)), P12 = Math.max(0, ...pr90.map(r => r.p12));
    if (P12 > 0 && P3 > P12) { const v = (P12 * 720 - P3 * 180) / 540; if (v > 0.6 * P12 && v < P12) cp = { cp: Math.round(v), wp: Math.round((P3 - v) * 180), p3: P3, p12: P12 }; }
    if (!cp && P12 > 0) cp = { cp: Math.round(P12 * 0.93), wp: null, p3: P3, p12: P12, rough: true };
  }

  // running dynamics (last 4 weeks, duration weighted) and monthly trend
  const dynKeys = ['cad', 'sl', 'vo', 'gc', 'pw'];
  const dyn = {};
  for (const k of dynKeys) {
    let s = 0, w = 0; for (const r of runs28) if (r[k]) { s += r[k] * r.moving; w += r.moving; }
    dyn[k] = w ? s / w : null;
  }
  dyn.vr = dyn.vo && dyn.sl ? dyn.vo / (dyn.sl * 100) * 100 : null;
  const months = [];
  if (runs.length) {
    const [ty, tm] = civilFromDays(today);
    for (let k = 11; k >= 0; k--) {
      let y = ty, m = tm - k; while (m <= 0) { m += 12; y--; }
      const a = daysFromCivil(y, m, 1), b = daysFromCivil(m === 12 ? y + 1 : y, m === 12 ? 1 : m + 1, 1) - 1;
      const rr = runs.filter(r => r.day >= a && r.day <= b);
      const row = { a, label: m + '월', km: sum(rr.map(r => r.dist)) / 1000, n: rr.length };
      for (const kk of dynKeys) { let s = 0, w = 0; for (const r of rr) if (r[kk]) { s += r[kk] * r.moving; w += r.moving; } row[kk] = w ? s / w : null; }
      row.vr = row.vo && row.sl ? row.vo / (row.sl * 100) * 100 : null;
      months.push(row);
    }
  }

  // aerobic efficiency: pace at a fixed heart rate on easy-type runs
  const easyRuns = runs.filter(r => r.ef && ['base', 'long', 'recovery'].includes(r.label));
  const refHR = Math.round(median(easyRuns.slice(-40).map(r => r.hrAvg)) || (P.rest + 0.7 * (P.max - P.rest)));
  const effSeries = easyRuns.map(r => ({ d: r.day, id: r.id, pace: 1000 / ((r.efW || r.ef) * refHR / 60) }));

  // readiness today + history (30 days), HRV/RHR/sleep series (60 days)
  const readiness = readinessFor(evalDay);
  const readHist = []; for (let d = evalDay - 29; d <= evalDay; d++) readHist.push(readinessFor(d));
  const hrvSeries = []; for (let d = evalDay - 59; d <= evalDay; d++) { const v = hrvVal(d); const st = hrvStat(d); hrvSeries.push({ d, v: isNum(v) ? Math.exp(v) : null, avg7: st ? Math.exp(st.avg7) : null, lo: st && st.lo ? Math.exp(st.lo) : null, hi: st && st.hi ? Math.exp(st.hi) : null }); }
  const rhrSeries = []; for (let d = evalDay - 59; d <= evalDay; d++) rhrSeries.push({ d, v: isNum(D.rhr[d]) ? D.rhr[d] : null, base: rhrBase(d) });
  const nights = []; for (let d = evalDay - 13; d <= evalDay; d++) { const s = sleepOf(d); nights.push(s || { d }); }
  const recoveryNow = recoveryAt(now);

  const M = {
    S, today, now, off, evalDay, lastDataDay, stale: staleDays, ref, fromDay, realToday, asOf, range: { from: isNum(fromDay) && fromDay > -Infinity ? fromDay : (runs.length ? runs[0].day : today), to: today, custom: range.custom },
    fc: S.weather === false || asOf !== null ? null : opt.fc || null, sun: opt.sun || null,
    P, runs, others, LT, level, levelPerf, levelHR, appleVO2, appleDays, preds, paces,
    pmc: { d0, load, ctl, atl }, ctl: c, atl: a, acwr, form, fatigue, intensityTrend: it, itBand, load7, load28, recLoad, loadPerKm,
    status: Object.assign({ key: status, vo2Delta }, STATUS[status]),
    focus: Object.assign({ total: fT, msg: focusMsg, short: focusShort }, focus),
    dist: { z: dist, total: distT, msg: distMsg },
    weeks, avg4, prs, abilities, fitAge, vo2ForAge, cp, dyn, months, refHR, effSeries,
    hrv: { stat: hsToday, series: hrvSeries }, rhr: { series: rhrSeries, base: rhrBase(evalDay), today: D.rhr[evalDay] ?? null },
    temp: { dev: tempDev(evalDay) }, resp: { dev: respDev(evalDay) },
    sleep: { nights, last: sleepOf(evalDay) },
    readiness, readHist, recoveryNow,
  };
  M.plan = buildPlan(M);
  M.insights = buildInsights(M);
  return M;
}

function labelRun(r, runs, fastSh, P) {
  const mv = r.moving, b = r.ltb, tot = b[0] + b[1] + b[2] + b[3];
  if (r.teN >= 2.0 && r.sprints >= 5 && fastSh < 0.15) return 'sprint';
  if (r.teN >= 3.0 && r.teN >= r.teA) return 'anaerobic';
  if (r.teN >= 1.8) return 'vo2';
  if (tot > mv * 0.4) {
    const f = x => x / tot;
    if (f(b[3]) >= 0.15) return 'vo2';
    if (f(b[2]) + f(b[3]) >= 0.25) return 'threshold';
    if (f(b[1]) + f(b[2]) + f(b[3]) >= 0.30) return 'tempo';
  } else if (r.lvl && r.dist > 0) {
    const tS = speedForVO2(0.88 * r.lvl) / 60, v = r.dist / mv;
    if (v >= tS * 0.98) return 'threshold';
    if (v >= tS * 0.92) return 'tempo';
  }
  const prev = runs.filter(x => x.day < r.day && x.day >= r.day - 56).map(x => x.moving);
  const med = prev.length >= 3 ? median(prev) : 2400;
  if (mv >= Math.max(4500, med * 1.4) || r.dist >= 16000) return 'long';
  const veryEasy = r.hrAvg && P && r.hrAvg < 0.74 * P.lthr;
  if (mv <= 2700 && (r.teA < 1.8 || veryEasy)) return 'recovery';
  return 'base';
}

function paceTxt(r) { return r ? fmtPace(r[0]) + '–' + fmtPace(r[1]) : ''; }

function hrZone(P, z) { const zs = P.zones; return z === 4 ? [zs[4], P.max] : [zs[z], zs[z + 1] - 1]; }

function makeWorkout(kind, ctx) {
  const def = WK[kind] || WK.easy, P = ctx.P;
  // hot day: every target pace slows by the heat effect; heart-rate targets stay the same
  const hf = 1 + (ctx.heat > 0 ? ctx.heat : 0) / 100;
  const pc = ctx.paces && hf > 1 ? Object.fromEntries(Object.entries(ctx.paces).map(([k, v]) => [k, [v[0] * hf, v[1] * hf]])) : ctx.paces;
  const z1 = hrZone(P, 0), z2 = hrZone(P, 1), z3 = hrZone(P, 2);
  const thrHR = [Math.round(P.lthr * 0.95), Math.round(P.lthr * 1.0)];
  const easyP = pc ? pc.easy : null, recP = pc ? pc.rec : null;
  const steps = []; let t = 0, d = 0;
  const easyMid = easyP ? midPace(easyP) : 390;
  const addTime = (k, label, sec, pace, hr, note) => { steps.push({ k, label, amount: fmtDurKo(sec), pace, hr, note }); t += sec; d += pace ? sec / midPace(pace) * 1000 : sec / easyMid * 1000; };
  const addDist = (k, label, m, pace, hr, note) => { steps.push({ k, label, amount: m >= 1000 ? round(m / 1000, 1) + 'km' : m + 'm', pace, hr, note }); const sp = pace ? midPace(pace) : easyMid; t += m / 1000 * sp; d += m; };
  const addSet = (reps, work, rest) => {
    const wSec = work.m ? work.m / 1000 * midPace(work.pace || [easyMid, easyMid]) : work.sec;
    const rSec = rest.sec || (rest.m ? rest.m / 1000 * (recP ? midPace(recP) : easyMid * 1.1) : 0);
    steps.push({ k: 'set', reps, work: { label: work.label, amount: work.m ? (work.m >= 1000 ? round(work.m / 1000, 1) + 'km' : work.m + 'm') : shortDur(work.sec), pace: work.pace, hr: work.hr, sec: wSec, m: work.m },
      rest: { label: rest.label, amount: rest.m ? rest.m + 'm' : shortDur(rSec), pace: rest.pace, sec: rSec, m: rest.m } });
    t += reps * (wSec + rSec);
    d += reps * ((work.m || wSec / easyMid * 1000) + (rest.m || rSec / (recP ? midPace(recP) : easyMid * 1.1) * 1000));
  };
  const km = ctx.km || 6;
  const warm = () => addTime('warm', '워밍업 (천천히)', 900, easyP, z2);
  const cool = () => addTime('cool', '쿨다운 (천천히)', 600, easyP, z2);
  switch (kind) {
    case 'rest': steps.push({ k: 'rest', label: '완전 휴식 · 가벼운 산책 · 스트레칭' }); break;
    case 'recovery': addTime('run', '아주 천천히 조깅', clamp(Math.round(km * easyMid * 1.08 / 300) * 300, 1200, 1800), recP, z1, '대화가 편한 속도'); break;
    case 'easy': addTime('run', '편안하게 달리기', clamp(Math.round(km * easyMid / 300) * 300, 1500, 4800), easyP, z2, '코로만 숨 쉬어도 될 정도'); break;
    case 'strides': {
      addTime('run', '편안하게 달리기', clamp(Math.round((km - 0.8) * easyMid / 300) * 300, 1200, 3600), easyP, z2);
      addSet(6, { label: '스트라이드 (빠르고 가볍게)', sec: 20, pace: pc ? pc.rep : null }, { label: '걷기·조깅', sec: 70 });
      break;
    }
    case 'long': addDist('run', '일정한 이지 페이스', Math.round(km * 2) / 2 * 1000, easyP, z2, '오르막에선 페이스보다 심박 유지'); break;
    case 'long_m': {
      const tot = Math.round(km * 2) / 2, mk = Math.max(3, Math.round(tot * 0.25));
      addDist('run', '이지 페이스', (tot - mk) * 1000, easyP, z2);
      addDist('work', '마라톤 페이스로 마무리', mk * 1000, pc ? pc.mar : null, z3);
      break;
    }
    case 'progression': {
      const total = clamp(Math.round(km * easyMid / 300) * 300, 1800, 4200);
      addTime('run', '편안하게 시작', total - 600, easyP, z2);
      addTime('work', '마라톤→역치 속도로 점점 빠르게', 600, pc ? [pc.thr[0], pc.mar[1]] : null, z3);
      break;
    }
    case 'tempo': case 'tempo_short': {
      const capT = pc ? Math.max(15, Math.round((ctx.weekKm || 30) * 0.1 * midPace(pc.thr) / 60 / 5) * 5) : 25; // Daniels: T running ≤ 10% of weekly volume
      let tm = kind === 'tempo' ? Math.min(clamp(Math.round((15 + (ctx.ctl || 20) * 0.2) / 5) * 5, 15, 35), capT) : 15;
      if (ctx.reduce && kind === 'tempo') tm = Math.max(15, tm - 5);
      warm(); addTime('work', '템포 (편하게 힘든 속도)', tm * 60, pc ? pc.thr : null, thrHR, '숨이 차지만 짧은 단어는 말할 수 있는 정도'); cool();
      break;
    }
    case 'cruise': {
      const tm = clamp(Math.round((18 + (ctx.ctl || 20) * 0.25)), 18, 40);
      let reps = pc ? clamp(Math.round(tm * 60 / midPace(pc.thr)), 3, 8) : 4;
      reps = Math.min(reps, Math.max(3, Math.floor((ctx.weekKm || 30) * 0.1)));
      if (ctx.reduce) reps = Math.max(3, reps - 1);
      warm(); addSet(reps, { label: '역치 속도', m: 1000, pace: pc ? pc.thr : null, hr: thrHR }, { label: '천천히 조깅', sec: 60 }); cool();
      break;
    }
    case 'vo2': case 'intervals_short': {
      const repM = (ctx.level || 40) < 42 ? 800 : 1000;
      let vol = clamp((ctx.weekKm || 25) * 0.08, 3, 8);
      let reps = kind === 'vo2' ? clamp(Math.round(vol * 1000 / repM), 4, 8) : 4;
      if (ctx.reduce) reps = Math.max(3, reps - 2);
      const wSec = pc ? repM / 1000 * midPace(pc.int) : 240;
      warm(); addSet(reps, { label: '빠르게 (VO2max 속도)', m: repM, pace: pc ? pc.int : null }, { label: '천천히 조깅', sec: Math.round(wSec / 10) * 10 }); cool();
      break;
    }
    case 'speed': {
      let reps = clamp(Math.round((ctx.weekKm || 25) * 0.04 / 0.2), 6, 12); if (ctx.reduce) reps = Math.max(4, reps - 3);
      warm(); addSet(reps, { label: '빠르게 (반복 속도)', m: 200, pace: pc ? pc.rep : null }, { label: '천천히 조깅', m: 200 }); cool();
      break;
    }
    case 'mpace': {
      const mk = clamp(Math.round((ctx.weekKm || 30) * 0.2), 5, 16);
      addDist('warm', '워밍업 (천천히)', 2000, easyP, z2); addDist('work', '마라톤 페이스', mk * 1000, pc ? pc.mar : null, z3); addDist('cool', '쿨다운 (천천히)', 1500, easyP, z2);
      break;
    }
    case 'race_prep': {
      const rp = ctx.racePace ? [ctx.racePace * 0.99 * hf, ctx.racePace * 1.01 * hf] : pc ? pc.thr : null;
      warm(); addSet(3, { label: '레이스 페이스', m: 1000, pace: rp }, { label: '천천히 조깅', sec: 120 }); cool();
      break;
    }
    case 'race': {
      const rp = ctx.racePace ? [ctx.racePace * 0.995 * hf, ctx.racePace * 1.005 * hf] : null;
      addTime('warm', '가벼운 워밍업 + 스트라이드 3회', 900, easyP, z2);
      addDist('work', '레이스 (' + (ctx.raceName || '') + ')', ctx.raceDist || 10000, rp, null, '첫 1km는 목표보다 살짝 느리게');
      break;
    }
  }
  return Object.assign({ kind, steps, estTime: Math.round(t), estDist: Math.round(d), heat: hf > 1 ? round((hf - 1) * 100, 1) : 0 }, def, { te: def.te.slice() });
}

function buildPlan(M) {
  const S = M.S, today = M.today, P = M.P;
  const rpw = clamp(parseInt(S.runsPerWeek, 10) || 4, 2, 7);
  const lrd = clamp(parseInt(S.longRunDay, 10) || 0, 0, 6);
  const PAT = {

// even-effort race plan: first third 1% easier, last third 1% faster, scaled to hit the target exactly
function racePlan(D, target) {

  return segs.map(([m, p, t]) => { cum += t * k; return { m, pace: p * k, cum }; });

// '3:59:00' or '50:00' (also with dots), or digits alone: '50' = 50 min, '5000' = 50:00, '35900' = 3:59:00
function parseGoalTime(s) {
  if (!s) return null;
  let str = String(s).trim().replace(/[.,\s]+/g, ':').replace(/^:+|:+$/g, '');

    else if (str.length <= 6) str = str.slice(0, -4) + ':' + str.slice(-4, -2) + ':' + str.slice(-2);
    else return null;
  }
  const p = str.split(':').map(x => (/^\d+$/.test(x) ? parseInt(x, 10) : NaN));
  if (!p.length || p.some(x => !isNum(x))) return null;

  if (p.length === 3 && p[1] < 60 && p[2] < 60) t = p[0] * 3600 + p[1] * 60 + p[2];
  else if (p.length === 2 && p[1] < 60) t = p[0] * 60 + p[1];

}

// auto-detect repeated fast segments (intervals) from the speed trace

  const on = s.v.map(v => v >= thr);

  const segs = []; let a = -1;

    else if (a >= 0) { const t0 = a > 0 ? s.t[a - 1] : 0, t1 = s.t[i - 1]; if (t1 - t0 >= 30) segs.push([a, i - 1]); a = -1; }

    const t0 = i0 > 0 ? s.t[i0 - 1] : 0, d0 = i0 > 0 ? s.d[i0 - 1] : 0, t = s.t[i1] - t0, d = s.d[i1] - d0;

  });

    const dp = pace - p0, dh = r.hrAvg - h0, gain = (efw(r) / e0 - 1) * 100;
    const pT = Math.abs(dp) < 2 ? '페이스는 비슷하고' : '페이스는 km당 ' + Math.round(Math.abs(dp)) + '초 ' + (dp < 0 ? '빠르고' : '느리고');
    const hT = Math.abs(dh) < 1 ? '평균 심박도 비슷해요' : '평균 심박은 ' + Math.round(Math.abs(dh)) + 'bpm ' + (dh < 0 ? '낮아요' : '높아요');
    const verdict = gain >= 2 ? ' 같은 심박으로 더 빨리 달렸어요. 체력이 좋아지고 있다는 신호예요.' : gain <= -3 ? ' 같은 속도에 심박이 더 들었어요. 피로·더위·수면 영향일 수 있어요.' : ' 평소와 비슷한 효율이에요.';
    out.push({ tone: gain >= 2 ? 'good' : gain <= -3 ? 'warn' : 'info', text: '최근 비슷한 ' + L.name + ' 러닝 ' + sim.length + '번과 비교하면 ' + pT + ', ' + hT + '.' + verdict + (wxDiff ? ' (효율은 더위·바람 영향을 빼고 비교했어요.)' : '') });
  }
  const s = r.ser, n = s.t.length;
  if (r.dist >= 3000 && n > 20 && !['vo2', 'anaerobic', 'sprint'].includes(r.label)) {
    const half = s.d[n - 1] / 2; let k = 0; while (k < n && s.d[k] < half) k++;
    const t1 = s.t[k], t2 = s.t[n - 1] - t1, d1 = s.d[k], d2 = s.d[n - 1] - d1;
    if (d1 > 0 && d2 > 0) {
      const p1 = t1 / d1 * 1000, p2 = t2 / d2 * 1000, diff = (p2 - p1) / p1 * 100;
      if (diff <= -1.5) out.push({ tone: 'good', text: '후반 페이스가 전반보다 km당 ' + Math.round(p1 - p2) + '초 빨랐어요 (네거티브 스플릿). 페이스 운영이 좋았어요.' });
      else if (diff >= 5) out.push({ tone: 'warn', text: '후반 페이스가 전반보다 ' + Math.round(diff) + '% 느려졌어요. 초반을 조금 더 참으면 기록이 좋아져요.' });

    else if (r.decoup < 10) out.push({ tone: 'info', text: '심박 드리프트 ' + r.decoup.toFixed(1) + '% — 후반에 같은 속도를 내는 데 심박이 조금 더 들었어요.' });
    else out.push({ tone: 'warn', text: '심박 드리프트 ' + r.decoup.toFixed(1) + '% — 후반 심박 상승이 커요. ' + (r.wx && r.wx.heat >= 2 ? '더운 날이라 심박이 더 오른 영향이 커요. 물을 충분히 마시고 더운 날엔 초반을 더 천천히 달리세요.' : '더위·탈수·초반 오버페이스이거나 이 거리에 대한 지구력이 아직 부족하다는 신호예요.') });
  }

    if (r.perfPct >= 103) out.push({ tone: 'good', text: '러닝 퍼포먼스 ' + r.perfPct + '% — 평소 체력보다 좋은 컨디션으로 달렸어요.' });
    else if (r.perfPct <= 95) out.push({ tone: 'warn', text: '러닝 퍼포먼스 ' + r.perfPct + '% — 평소보다 같은 속도에 심박이 높았어요. ' + (r.wx && Math.abs(r.wx.tot) >= 1 ? '더위·바람 영향은 이미 빼고 계산했으니, 피로나 수면을 살펴보세요.' : '피로·수면·더위 영향일 수 있어요.') });
  }
  if (r.prs && r.prs.length) out.push({ tone: 'good', text: '개인 최고 기록: ' + r.prs.join(', ') + '!' });

    const tot = sum(r.zt); if (tot > 600 && (r.zt[2] + r.zt[3] + r.zt[4]) / tot > 0.35) out.push({ tone: 'info', text: '편한 달리기였지만 ' + Math.round((r.zt[2] + r.zt[3] + r.zt[4]) / tot * 100) + '%를 존 3 이상으로 달렸어요. 이지런은 더 천천히 달려야 회복과 기초 체력에 좋아요.' });
  }
  if (r.hrr1 && M.runs.length) {
    const prev = median(M.runs.filter(x => x.hrr1 && x.id !== r.id).slice(-20).map(x => x.hrr1));
    if (isNum(prev)) out.push({ tone: r.hrr1 >= prev ? 'good' : 'info', text: '운동 후 1분 심박 회복 ' + r.hrr1 + 'bpm (평소 ' + Math.round(prev) + 'bpm). 클수록 심폐 회복력이 좋아요.' });

}

// what the weather did to this run, in plain words
function wxInsights(r) {
  const W = r.wx, out = []; if (!W) return out;
  const pace = r.moving / Math.max(1, r.dist) * 1000, adj = pace / wxFactor(r);
  const T = v => Math.round(v) + '°C';
  if (W.heat >= 1) out.push({ tone: W.heat >= 3 ? 'warn' : 'info', text: '기온 ' + T(W.t) + (isNum(W.dp) ? ' · 이슬점 ' + T(W.dp) : '') + ' — 더위 때문에 같은 노력에서 약 ' + W.heat.toFixed(1) + '% 느려지는 날씨였어요.' + (W.tot >= 1 && pace - adj >= 2 ? ' 날씨 영향을 빼면 평균 페이스 ' + fmtPace(adj) + '/km 수준이에요.' : '') });
  if (W.om && isNum(W.ws)) {
    const dir = isNum(W.wd) ? ', ' + windName(W.wd) : '';
    if (W.wind >= 1) out.push({ tone: 'info', text: '바람(초속 ' + W.ws.toFixed(1) + 'm' + dir + ') 때문에 약 ' + W.wind.toFixed(1) + '% 손해를 봤어요. 맞바람 구간이 ' + Math.round(W.head * 100) + '%였어요.' + (W.heat < 1 && pace - adj >= 2 ? ' 바람 영향을 빼면 평균 페이스 ' + fmtPace(adj) + '/km 수준이에요.' : '') });
    else if (W.wind <= -1) out.push({ tone: 'info', text: '뒷바람(초속 ' + W.ws.toFixed(1) + 'm' + dir + ') 덕분에 약 ' + Math.abs(W.wind).toFixed(1) + '% 빨라진 효과가 있었어요. 비교할 때는 이 점을 빼고 봤어요.' });
    else if (W.ws >= 5) out.push({ tone: 'info', text: '바람이 셌지만(초속 ' + W.ws.toFixed(1) + 'm' + dir + ') 맞바람과 뒷바람 구간이 비슷해서 기록에 준 영향은 작았어요.' });
  }
  if (isNum(W.pr) && W.pr >= 0.5) out.push({ tone: 'info', text: '비가 오는 중에 달렸어요 (약 ' + W.pr.toFixed(1) + 'mm). 젖은 노면에서는 페이스가 조금 느려지는 게 자연스러워요.' });
  if (W.t <= 0) out.push({ tone: 'info', text: '영하의 추운 날씨' + (isNum(W.at) ? '(체감 ' + T(W.at) + ')' : '') + '였어요. 추운 날은 근육이 덜 풀려 초반이 무겁고, 심박이 평소보다 낮게 나올 수 있어요.' });
  return out;
}

// ---------- running outfit ----------
// 체감온도 as 기상청 shows it: wind chill when it's cool and windy (≤10°C, wind ≥ 4.8 km/h), the heat-humidity feel when it's hot (≥ 25°C),
// otherwise the air temperature itself. ws in m/s.
function feelsKo(tC, rh, ws) {
  if (!isNum(tC)) return null;
  const v = (isNum(ws) ? ws : 0) * 3.6;
  if (tC <= 10 && v >= 4.8) { const p = Math.pow(v, 0.16); return 13.12 + 0.6215 * tC - 11.37 * p + 0.3965 * tC * p; }
  if (tC >= 25) return Math.max(tC, feelsLike(tC, rh, ws));
  return tC;
}
// Bands by 체감온도, from the user's own experience (8°: long sleeve + shorts, 13°+: short sleeve + shorts, ≤5°: gloves)
// and five running YouTubers' advice (docs/clothing_refs.md). lo = lowest feel temperature the band covers.
const OUTFIT = [
  { lo: 25, top: '민소매 또는 얇은 반팔(통풍 잘 되는 것)', bottom: '반바지', acc: ['모자', '선크림'], note: '땀이 많이 나요. 물을 챙기고 그늘진 길을 고르세요.' },
  { lo: 13, top: '반팔', bottom: '반바지', acc: [] },
  { lo: 10, top: '반팔 또는 얇은 긴팔', bottom: '반바지', acc: [], alt: '쌀쌀함을 많이 타면 하프집업' },
  { lo: 7, top: '긴팔', bottom: '반바지', acc: [], alt: '반팔 + 바람막이(몸이 데워지면 벗기)' },
  { lo: 4, top: '긴팔 + 바람막이', bottom: '반바지 또는 긴바지', acc: [], alt: '베이스레이어 + 하프집업' },
  { lo: 1, top: '베이스레이어 + 하프집업 + 바람막이', bottom: '긴바지', acc: ['장갑'] },
  { lo: -2, top: '베이스레이어 + 하프집업 + 패딩조끼', bottom: '긴바지', acc: ['장갑', '귀마개'], alt: '긴팔 + 바람막이 + 조끼' },
  { lo: -5, top: '긴팔 + 패딩조끼 + 바람막이', bottom: '기모바지', acc: ['장갑', '귀마개', '넥워머(버프)'] },
  { lo: -10, top: '베이스레이어 + 기모 하프집업 + 패딩조끼 + 바람막이', bottom: '기모바지', acc: ['장갑', '귀마개', '넥워머(버프)'] },
  { lo: -99, top: '긴팔 + 경량패딩 + 바람막이 + 조끼', bottom: '기모바지', acc: ['장갑', '바라클라바(얼굴 가리개)'], note: '아주 추워요. 짧게 달리고 미끄러운 길을 조심하세요.' },
